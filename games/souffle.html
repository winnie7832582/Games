<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>舒芙蕾廚房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Huninn&display=swap">
<style>
:root{
  --bg:#D3E5D6; --tile:#BFD7C5; --ink:#3A2318; --ink-soft:#6B5244; --surface:#FBFBF7;
  --board:#F5F6F2; --vein:#DDE1D9; --track:#E3E6DF;
  --yolk:#F0AE24; --good:#3C8A57; --bad:#C2453B; --on-accent:#FFFFFF;
  --btn:#3A2318; --btn-ink:#FFF3D6; --btn-shadow:#1C100A; --btn-held:#F0AE24;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C2822; --tile:#24332B; --ink:#F2E6D2; --ink-soft:#B9AA94; --surface:#26342C;
    --board:#2B2F2C; --vein:#373D39; --track:#3A423D;
    --yolk:#F5BE45; --good:#7CC796; --bad:#F07A6E; --on-accent:#1A1410;
    --btn:#F5BE45; --btn-ink:#2A1A10; --btn-shadow:#9C7016; --btn-held:#FFF0C2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C2822; --tile:#24332B; --ink:#F2E6D2; --ink-soft:#B9AA94; --surface:#26342C;
  --board:#2B2F2C; --vein:#373D39; --track:#3A423D;
  --yolk:#F5BE45; --good:#7CC796; --bad:#F07A6E; --on-accent:#1A1410;
  --btn:#F5BE45; --btn-ink:#2A1A10; --btn-shadow:#9C7016; --btn-held:#FFF0C2;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(var(--tile) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--tile) 1.5px,transparent 1.5px);
  background-size:32px 32px;background-position:-1px -1px;
  font-family:Huninn,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

/* title */
#title{align-items:center;justify-content:center;text-align:center;padding:16px 24px 24px}
.hero{display:block;width:min(70vw,290px);aspect-ratio:1}
h1{font-weight:400;font-size:clamp(3.4rem,17vw,4.8rem);line-height:1;margin:0 0 12px;letter-spacing:.06em}
h1 span{display:inline-block;transform-origin:50% 90%;animation:puff .7s cubic-bezier(.34,1.56,.64,1) both}
h1 span:nth-child(1){animation-delay:1.5s}
h1 span:nth-child(2){animation-delay:1.62s}
h1 span:nth-child(3){animation-delay:1.74s}
@keyframes puff{from{transform:scale(.55,.4);opacity:0}to{transform:none;opacity:1}}
.lede{text-wrap:balance;max-width:20em;margin:0 0 22px;color:var(--ink-soft);font-size:1.05rem;line-height:1.75}
.flavs{display:flex;gap:8px;margin:0 0 6px;justify-content:center;flex-wrap:wrap}
.flavs button{border:2px solid var(--vein);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 14px;font:inherit;cursor:pointer}
.flavs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.flavs button:disabled{opacity:.45;cursor:default}
.farmegg{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0;font-size:.9rem;color:var(--ink-soft);flex-wrap:wrap}.farmegg .eggtg{border:2px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;min-height:36px}.farmegg .eggtg[aria-pressed="true"]{background:#F2B632;color:#1F2A37;border-color:#F2B632}
.fdesc{margin:0 0 14px;color:var(--ink-soft);min-height:1.5em;text-align:center;font-size:.95rem}
.best{margin:14px 0 0;color:var(--ink-soft);font-size:.95rem;min-height:1.5em}

/* buttons */
.act{
  flex:1;min-width:0;font:inherit;font-size:1.3rem;line-height:1.2;padding:16px 14px;
  border-radius:18px;border:2px solid var(--ink);background:var(--btn);color:var(--btn-ink);
  box-shadow:0 5px 0 var(--btn-shadow);cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  transition:transform .06s,box-shadow .06s,background-color .1s;
}
.act.hold{touch-action:none}
.act:active,.act.held{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-shadow)}
.act.held{background:var(--btn-held);color:#2A1A10}
.act:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 5px 0 var(--btn-shadow)}
.act:focus-visible,.ghost:focus-visible{outline:3px solid var(--yolk);outline-offset:3px}
#start{flex:none;min-width:200px}
.ghost{font:inherit;font-size:.95rem;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer}

/* game */
.steps{display:flex;list-style:none;margin:0;padding:10px 12px 2px;gap:2px}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:.74rem;white-space:nowrap}
.steps .num{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-soft);display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:.82rem;background:var(--surface)}
.steps li.done{color:var(--ink)}
.steps li.done .num{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.steps li.now{color:var(--ink)}
.steps li.now .num{background:var(--yolk);border-color:var(--ink);color:#2A1A10}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 16px 0 18px}
.head h2{margin:0;font-weight:400;font-size:1.55rem;line-height:1.2}
.head p{margin:2px 0 0;color:var(--ink-soft);font-size:.95rem;line-height:1.45}
.board{position:relative;flex:1;min-height:220px;margin:8px 12px 4px;border:2px solid var(--ink);border-radius:24px;overflow:hidden;background:var(--board)}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);opacity:0;padding:7px 15px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:1rem;white-space:nowrap;pointer-events:none;transition:opacity .15s,transform .15s;z-index:2}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--good);color:var(--on-accent)}
.toast.bad{background:var(--bad);color:var(--on-accent)}
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(40,30,20,.18);z-index:3}
.intro[hidden]{display:none}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:20px;padding:18px 18px 20px;max-width:340px;width:100%;box-shadow:0 6px 0 var(--ink)}
.card .n{margin:0;color:var(--ink-soft);font-size:.9rem}
.card h3{margin:2px 0 8px;font-weight:400;font-size:1.7rem}
.card .t{white-space:pre-line;text-wrap:pretty;margin:0 0 18px;line-height:1.75;font-size:1rem}
.card .act{width:100%}
.controls{display:flex;gap:10px;padding:10px 12px 16px}

/* result */
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 24px}
.sheet{background:var(--surface);border:2px solid var(--ink);border-radius:24px;padding:16px 18px 22px}
.res-hero{display:block;width:min(62vw,230px);aspect-ratio:1;margin:0 auto}
.score{text-align:center;margin:0}
.score b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:4.6rem;line-height:1;font-variant-numeric:lining-nums}
.score span{font-size:1.15rem;margin-left:4px}
.grade{text-align:center;font-weight:400;font-size:1.65rem;margin:6px 0 4px}
.desc{text-wrap:balance;text-align:center;color:var(--ink-soft);margin:0 auto 4px;max-width:22em;line-height:1.7}
.rise{text-align:center;margin:0 0 6px}
.newbest{text-align:center;margin:0 0 14px;color:var(--good);min-height:1.4em}
.rows{list-style:none;padding:0;margin:0 0 20px;border-top:2px solid var(--ink)}
.rows li{padding:11px 2px;border-bottom:1px solid var(--track)}
.row-top{display:flex;justify-content:space-between;align-items:baseline}
.row-top b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.25rem}
.meter{height:6px;background:var(--track);border-radius:3px;margin:5px 0;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.rows p{margin:0;color:var(--ink-soft);font-size:.92rem;line-height:1.55}
.res-actions{display:flex}

@media (prefers-reduced-motion:reduce){
  h1 span{animation:none}
  .toast,.act{transition:none}
}
#restart{white-space:nowrap;flex:none}
</style>
<script src="../gc.js"></script>
</head>
<body>
<div class="app">

  <section class="screen on" id="title" aria-labelledby="t-h">
    <canvas class="hero" id="hero" aria-hidden="true"></canvas>
    <h1 id="t-h"><span>舒</span><span>芙</span><span>蕾</span></h1>
    <p class="lede">從分蛋到出爐，一共六步。<br>每一步都會決定它最後能膨多高。</p>
    <div class="flavs" id="flavs" role="group" aria-label="口味"></div>
    <p class="fdesc" id="fdesc"></p>
    <button class="act" id="start" type="button">開始做</button>
    <p class="farmegg" id="farmegg" hidden></p>
    <p class="best" id="best"></p>
  </section>

  <section class="screen" id="game" aria-label="遊戲">
    <ol class="steps" id="steps"></ol>
    <div class="head">
      <div><h2 id="stage-title"></h2><p id="stage-hint"></p></div>
      <button class="ghost" id="restart" type="button">重來</button>
    </div>
    <div class="board" id="board">
      <canvas id="cv"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="intro" id="intro" hidden>
        <div class="card">
          <p class="n" id="intro-n"></p>
          <h3 id="intro-title"></h3>
          <p class="t" id="intro-text"></p>
          <button class="act" id="intro-go" type="button">開始</button>
        </div>
      </div>
    </div>
    <div class="controls" id="controls"></div>
  </section>

  <section class="screen" id="result" aria-label="成果">
    <div class="scroll">
      <div class="sheet">
        <canvas class="res-hero" id="res-hero" aria-hidden="true"></canvas>
        <p class="score"><b id="r-score">0</b><span>分</span></p>
        <h2 class="grade" id="r-grade"></h2>
        <p class="desc" id="r-desc"></p>
        <p class="rise" id="r-rise"></p>
        <p class="newbest" id="r-best"></p>
        <ul class="rows" id="r-rows"></ul>
        <div class="res-actions"><button class="act" id="again" type="button">再做一次</button></div>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const FONT='Huninn,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const OUT='#3A2318';
const C={
  shell:'#F3DFC1', yolk:'#F4A81C', yolkHi:'#FFD873',
  bowl:'#FFFFFF', bowlIn:'#EDF1F3', enamel:'#4F7DB3',
  copper:'#C8693A', copperDark:'#8E441F',
  batter:'#F2CF72', batterPale:'#F8E7AE', surface:'#F5D98A',
  ramekin:'#FFFFFF', oven:'#22466B', ovenDark:'#173350', door:'#28507A', brass:'#C9A25A', glass:'#2A1A12',
  flame:'#4F9FEA', flameIn:'#CFE8FF', spatula:'#E0533F'
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hex(h){h=String(h).trim();const m=h.match(/^rgba?\(([^)]+)\)/);if(m){const q=m[1].split(',').map(Number);return[q[0]||0,q[1]||0,q[2]||0];}h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255];}
function mixHex(a,b,t){const A=hex(a),B=hex(b);t=clamp(t,0,1);return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';}
function rgba(h,a){const A=hex(h);return 'rgba('+A[0]+','+A[1]+','+A[2]+','+a+')';}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function seeded(n,seed){const a=[];let s=seed;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;a.push(s/233280);}return a;}

const RAMP=[[0,'#F7E8B5'],[0.45,'#F0D088'],[0.62,'#E0A04A'],[0.8,'#B56E2A'],[1.0,'#784218'],[1.25,'#3A2416']];
function crustBase(t){t=clamp(t,0,1.25);for(let i=1;i<RAMP.length;i++){if(t<=RAMP[i][0]){const a=RAMP[i-1],b=RAMP[i];return mixHex(a[1],b[1],(t-a[0])/(b[0]-a[0]));}}return RAMP[RAMP.length-1][1];}
function crust(t){const b=crustBase(t),F=FLV();if(!F.tint)return b;return mixHex(b,F.tint,F.tw*(F===FLAVORS.matcha?(1-clamp(t,0,1)*.55):1));}

let P={};
function readPalette(){
  const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue(n).trim();
  P={ink:g('--ink'),inkSoft:g('--ink-soft'),board:g('--board'),vein:g('--vein'),track:g('--track'),good:g('--good'),bad:g('--bad'),yolk:g('--yolk'),surface:g('--surface')};
}
readPalette();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readPalette);}catch(e){}
new MutationObserver(readPalette).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* drawing primitives (scene units: 0..100) */
function ell(c,x,y,rx,ry,fill,stroke,lw){c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.lineWidth=lw||.7;c.strokeStyle=stroke;c.stroke();}}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fs(c,fill,stroke,lw){if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.lineWidth=lw||.7;c.strokeStyle=stroke;c.stroke();}}
function txt(c,s,x,y,size,color,align){
  const m=c.getTransform();c.save();c.setTransform(1,0,0,1,0,0);
  c.font=(size*m.a).toFixed(2)+'px '+FONT;c.fillStyle=color;c.textAlign=align||'center';c.textBaseline='middle';
  c.fillText(s,m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f);c.restore();
}
function bar(c,x,y,w,h,t,fill){
  rr(c,x,y,w,h,h/2);fs(c,P.track);
  if(t>0){c.save();rr(c,x,y,w,h,h/2);c.clip();c.fillStyle=fill;c.fillRect(x,y,w*clamp(t,0,1),h);c.restore();}
  rr(c,x,y,w,h,h/2);fs(c,null,P.ink,.45);
}

function drawBowl(c,x,y,r,d,inner){
  c.beginPath();c.ellipse(x,y,r,d,0,0,Math.PI);c.closePath();fs(c,C.bowl,OUT,.7);
  c.save();c.beginPath();c.ellipse(x,y,r,d,0,0,Math.PI);c.closePath();c.clip();
  c.fillStyle='rgba(58,35,24,.07)';c.beginPath();c.ellipse(x+r*.6,y+d*.1,r*.6,d*1.2,0,0,Math.PI*2);c.fill();c.restore();
  const ry=r*.26;
  ell(c,x,y,r,ry,C.bowlIn);
  if(inner){c.save();c.beginPath();c.ellipse(x,y,r*.94,ry*.9,0,0,Math.PI*2);c.clip();inner();c.restore();}
  ell(c,x,y,r*.975,ry*.95,null,C.enamel,.9);
  ell(c,x,y,r,ry,null,OUT,.7);
}

function eggPath(c,s){c.beginPath();c.moveTo(0,-1.3*s);c.bezierCurveTo(.98*s,-1.3*s,1.02*s,.85*s,0,s);c.bezierCurveTo(-1.02*s,.85*s,-.98*s,-1.3*s,0,-1.3*s);c.closePath();}
function drawEgg(c,x,y,s,rot,half){
  c.save();c.translate(x,y);c.rotate(rot||0);
  if(half){
    const dir=half==='L'?-1:1;c.beginPath();c.moveTo(0,-1.5*s);
    for(let i=0;i<=6;i++){c.lineTo((i%2?.2:-.2)*s,-1.5*s+i*(2.65*s/6));}
    c.lineTo(dir*1.6*s,1.15*s);c.lineTo(dir*1.6*s,-1.5*s);c.closePath();c.clip();
  }
  eggPath(c,s);c.fillStyle=C.shell;c.fill();
  c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-.38*s,-.5*s,.17*s,.32*s,-.3,0,Math.PI*2);c.fill();
  eggPath(c,s);c.lineWidth=.7;c.strokeStyle=OUT;c.stroke();
  if(half){c.beginPath();c.moveTo(-.2*s,-1.5*s);for(let i=0;i<=6;i++){c.lineTo((i%2?.2:-.2)*s,-1.5*s+i*(2.65*s/6));}c.lineWidth=.6;c.strokeStyle=OUT;c.stroke();}
  c.restore();
}

function ramekinPath(c,cx,rimY,rx,h){const ry=rx*.3;c.beginPath();c.moveTo(cx-rx,rimY);c.lineTo(cx-rx*.95,rimY+h);c.ellipse(cx,rimY+h,rx*.95,ry*.95,0,Math.PI,0,true);c.lineTo(cx+rx,rimY);c.closePath();}
function ramekinFlutes(c,cx,rimY,rx,h){const ry=rx*.3;c.save();ramekinPath(c,cx,rimY,rx,h);c.clip();c.strokeStyle='rgba(58,35,24,.15)';c.lineWidth=.4;
  for(let k=-5;k<=5;k++){const f=k/6,q=Math.sqrt(1-f*f);c.beginPath();c.moveTo(cx+f*rx,rimY+ry*q);c.lineTo(cx+f*rx*.95,rimY+h+ry*.95*q);c.stroke();}
  c.fillStyle='rgba(58,35,24,.07)';c.fillRect(cx+rx*.35,rimY-ry,rx,h+ry*3);c.restore();}
function ramekinLip(c,cx,rimY,rx){const ry=rx*.3;c.beginPath();c.ellipse(cx,rimY+Math.max(.8,rx*.06),rx*.993,ry,0,.18,Math.PI-.18);c.lineWidth=.4;c.strokeStyle='rgba(58,35,24,.35)';c.stroke();}
function drawRamekin(c,cx,rimY,rx,h,o){
  o=o||{};const ry=rx*.3;
  ramekinPath(c,cx,rimY,rx,h);
  fs(c,C.ramekin,OUT,.7);
  ramekinFlutes(c,cx,rimY,rx,h);
  ell(c,cx,rimY,rx,ry,'#EEF0F2');
  if(o.inner){c.save();c.beginPath();c.ellipse(cx,rimY,rx*.94,ry*.9,0,0,Math.PI*2);c.clip();o.inner();c.restore();}
  if(o.over){o.over();c.beginPath();c.ellipse(cx,rimY,rx,ry,0,0,Math.PI);c.lineWidth=.7;c.strokeStyle=OUT;c.stroke();}
  else ell(c,cx,rimY,rx,ry,null,OUT,.7);
  ramekinLip(c,cx,rimY,rx);
}

const SUGAR=seeded(80,7);
function drawSouffle(c,cx,rimY,rx,rise,ct,o){
  o=o||{};const ry=rx*.3,w=rx*.94;
  if(rise<.6){ell(c,cx,rimY,w,ry*.9,crust(ct*.9),OUT,.5);return;}
  const tilt=o.tilt||0,tx=cx+tilt*rx*.3,top=rimY-rise;
  const side=mixHex(tintC('#F6E6B0',.35),crust(ct*.8),.55);
  c.beginPath();c.moveTo(cx-w,rimY);c.lineTo(tx-w,top);c.lineTo(tx+w,top);c.lineTo(cx+w,rimY);c.ellipse(cx,rimY,w,ry*.94,0,0,Math.PI,false);c.closePath();
  fs(c,side,OUT,.6);

    st.phase='serve';st.s=0;gsfx('ding');st.set=smooth(6,11,st.tb);
    const cs=colorScore(st.c);st.bakeScore=cs*.6+(st.h/st.Hmax)*100*.4;
    {const w=FLV().win;st.bakeNote=st.c<w[0]-.05?'太早出爐，表面還很白，中間沒定型':st.c<w[0]?'再多烤一下顏色會更好':st.c<=w[1]?'烤色剛好，出爐時機對了（'+FLV().n+'）':st.c<=w[1]+.25?'烤得偏久，表面有點乾':'烤焦了';}
    st.dust=0;st.lp=null;st.fp=null;
    renderControls([{label:'不撒糖，直接上桌',onTap:()=>this.serve()}]);setControlsEnabled(true);buzz(20);
    $('#stage-hint').textContent='用手指在舒芙蕾上方左右刷兩下撒糖粉，撒好就會上桌。它很快會塌，要快！';
  },
  serve(){
    const st=this.st;if(!running||st.phase!=='serve')return;
    st.phase='served';const s=st.s;
    const serveScore=s<=1.5?100:Math.max(0,100-(s-1.5)*28);
    const serveNote=s<=1.5?'出爐 '+s.toFixed(1)+' 秒就上桌，正是最高的時候':s>=7?'等太久才上桌，塌掉不少':s.toFixed(1)+' 秒才上桌，已經塌了一些';
    S.finalH=st.h;S.finalColor=st.c;S.finalTilt=st.tilt;
    toast(s<=1.5?'完美上桌':'上桌了',s<=1.5?'good':'');
    finishStage([{key:'bake',score:st.bakeScore,note:st.bakeNote},{key:'serve',score:serveScore,note:serveNote}]);
  },
  draw(c){
    const st=this.st;
    if(st.phase!=='bake'){
      drawPlate(c,st.h*.56,st.c,{tilt:st.tilt,sugar:st.phase==='served'?1:st.phase==='serve'?clamp(st.dust/40,0,1):0,steam:true});
      if(st.phase==='serve'&&st.fp){const f=st.fp;ell(c,f.x,f.y,6,6,'rgba(255,255,255,.35)',OUT,.6);for(let k=-4;k<=4;k+=2){c.beginPath();c.moveTo(f.x+k,f.y-Math.sqrt(36-k*k)*.9);c.lineTo(f.x+k,f.y+Math.sqrt(36-k*k)*.9);c.lineWidth=.25;c.strokeStyle=OUT;c.stroke();}c.beginPath();c.moveTo(f.x+6,f.y);c.lineTo(f.x+14,f.y-3);c.lineWidth=1.4;c.strokeStyle='#8A5A3B';c.stroke();for(let k=0;k<6;k++){const ph=(NOW*2+k/6)%1;ell(c,f.x-4+k*1.6,f.y+6+ph*10,.45,.45,'rgba(255,255,255,'+(1-ph)+')');}}
      if(st.phase==='serve'){const grace=.9+st.set*1.1,t=clamp(1-st.s/grace,0,1);bar(c,30,93,40,3,t,t>.3?P.good:P.bad);}
      return;
    }
    rr(c,8,4,84,92,6);fs(c,C.oven,OUT,.8);
    rr(c,12,8,76,14,3);fs(c,C.ovenDark,OUT,.5);
    [[22,NOW*.3],[35,-.7],[48,st.tb*.25]].forEach(([kx,rot])=>{ell(c,kx,15,4.2,4.2,C.brass,OUT,.5);ell(c,kx,15,2.8,2.8,'#E2C27E');c.save();c.translate(kx,15);c.rotate(rot);c.beginPath();c.moveTo(0,0);c.lineTo(0,-3.3);c.lineWidth=.8;c.strokeStyle=OUT;c.stroke();c.restore();});
    txt(c,'目標色',67,15,3,'#F2E6D2');rr(c,76,11.5,9,7,2);fs(c,crust(FLV().mid),OUT,.5);
    rr(c,12,25,76,67,4);fs(c,C.door,OUT,.6);
    rr(c,20,28,60,2.6,1.3);fs(c,C.brass,OUT,.5);
    rr(c,20,34,60,52,5);fs(c,C.glass,OUT,.6);
    c.save();rr(c,20,34,60,52,5);c.clip();
    const g=c.createRadialGradient(50,66,2,50,62,40);g.addColorStop(0,'rgba(255,170,70,'+(.85*st.flick)+')');g.addColorStop(.6,'rgba(230,110,40,'+(.35*st.flick)+')');g.addColorStop(1,'rgba(60,20,10,0)');c.fillStyle=g;c.fillRect(20,34,60,52);
    c.beginPath();for(let k=0;k<=10;k++){const x=24+k*5.2,y=38+(k%2?1.6:0);k?c.lineTo(x,y):c.moveTo(x,y);}c.lineWidth=.9;c.strokeStyle='rgba(255,120,50,'+(.7*st.flick+.2)+')';c.stroke();
    c.beginPath();c.moveTo(20,77.5);c.lineTo(80,77.5);c.lineWidth=.8;c.strokeStyle='#8C8C8C';c.stroke();
    drawRamekin(c,50,65,13,8.5,{over:()=>drawSouffle(c,50,65,13,st.h*.5,st.c,{tilt:st.tilt})});
    c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.moveTo(56,34);c.lineTo(66,34);c.lineTo(42,86);c.lineTo(32,86);c.closePath();c.fill();
    c.restore();
  }
};

const STAGES=[eggs,base,whip,fold,fill,bake];
const ROWS=[['eggs','分蛋',.1],['base','煮麵糊',.15],['whip','打發蛋白',.2],['fold','翻拌',.2],['fill','入模',.1],['bake','烘烤',.15],['serve','上桌',.1]];
const GRADES=[[90,'米其林甜點主廚','膨得又高又挺，可以直接端上餐廳的桌。'],[75,'巴黎甜點店學徒','很漂亮的舒芙蕾，再精準一點就是大師級。'],[55,'週末烘焙家','有膨起來，口感也不錯，幾個步驟還能再穩一點。'],[35,'還在練習中','舒芙蕾很挑剔，看看下面哪一步失分最多。'],[0,'塌掉的舒芙蕾','它塌了，不過每個甜點師都塌過。再來一次。']];

/* ---------- main board canvas ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d'),board=$('#board');
let W=0,H=0,DPR=1,SC={s:1,ox:0,oy:0};
function resize(){
  const r=board.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2.5);W=r.width;H=r.height;
  cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));
  const s=Math.min(W,H)/100;SC={s,ox:(W-100*s)/2,oy:(H-100*s)/2};
}
try{new ResizeObserver(resize).observe(board);}catch(e){addEventListener('resize',resize);}
const VEINS=(()=>{const r=seeded(200,21),v=[];let j=0;for(let i=0;i<6;i++){const pts=[];let x=r[j++],y=r[j++];const a=r[j++]*Math.PI;for(let k=0;k<7;k++){pts.push([x,y]);const t=a+(r[j++]-.5)*1.1;x+=Math.cos(t)*.16;y+=Math.sin(t)*.16;}v.push({pts,w:.6+r[j++]*1.6});}return v;})();
function drawBoardBg(c,w,h){
  c.fillStyle=P.board;c.fillRect(0,0,w,h);c.strokeStyle=P.vein;c.lineCap='round';c.lineJoin='round';
  VEINS.forEach(v=>{c.lineWidth=v.w;c.beginPath();v.pts.forEach(([x,y],i)=>i?c.lineTo(x*w,y*h):c.moveTo(x*w,y*h));c.stroke();});
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);drawBoardBg(ctx,W,H);
  ctx.setTransform(DPR*SC.s,0,0,DPR*SC.s,DPR*SC.ox,DPR*SC.oy);ctx.lineJoin='round';ctx.lineCap='round';
  if(cur)cur.draw(ctx);
}
function toScene(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-SC.ox)/SC.s,y:(e.clientY-r.top-SC.oy)/SC.s};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}if(running&&cur&&cur.down){const p=toScene(e);cur.down(p.x,p.y);}});
cv.addEventListener('pointermove',e=>{if(!cur||!cur.move)return;const p=toScene(e);cur.move(p.x,p.y);});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,()=>{if(cur&&cur.up)cur.up();}));
addEventListener('keydown',e=>{if(screen!=='game'||!running||!cur||!cur.key_)return;if(e.key.indexOf('Arrow')===0){e.preventDefault();cur.key_(e.key);}});

/* ---------- hero canvases ---------- */
function fitHero(canvas){
  const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2.5);
  const w=Math.max(1,r.width),h=Math.max(1,r.height),pw=Math.round(w*dpr),ph=Math.round(h*dpr);
  if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;}
  const c=canvas.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,pw,ph);
  const s=Math.min(w,h)/100;c.setTransform(dpr*s,0,0,dpr*s,dpr*(w-100*s)/2,dpr*(h-100*s)/2);c.lineJoin='round';c.lineCap='round';return c;
}
let heroT=reduceMotion?10:0;
function drawTitleHero(){
  const c=fitHero($('#hero'));const t=heroT;
  const rise=23*easeOutBack(clamp((t-.3)/2,0,1));
  drawPlate(c,rise,.66,{sugar:t>2.4,steam:true,steamA:clamp((t-2)/1,0,1)});
}
function drawResultHero(){const c=fitHero($('#res-hero'));drawPlate(c,S.finalH*.56,S.finalColor,{tilt:S.finalTilt||0,sugar:true,steam:S.finalH>6});}

/* ---------- UI flow ---------- */
let screen='title',cur=null,curIdx=0,running=false,finishing=false;
function gsfx(n){try{window.GC&&GC.sfx(n);}catch(e){}}
function show(name){screen=name;if(name!=='game')stopAllLoops();if(name==='title'&&typeof renderFlavs==='function')renderFlavs();['title','game','result'].forEach(n=>$('#'+n).classList.toggle('on',n===name));if(name==='game')requestAnimationFrame(resize);}
let toastTimer=0;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast show'+(kind?' '+kind:'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast';},1300);}
function renderSteps(){
  $('#steps').innerHTML=STAGES.map((s,i)=>'<li class="'+(i<curIdx?'done':i===curIdx?'now':'')+'"'+(i===curIdx?' aria-current="step"':'')+'><span class="num">'+(i+1)+'</span><span>'+s.name+'</span></li>').join('');
}
function renderControls(specs){
  const box=$('#controls');box.innerHTML='';
  specs.forEach(sp=>{
    const b=document.createElement('button');b.type='button';b.className='act'+(sp.hold?' hold':'');b.textContent=sp.label;
    if(sp.hold){
      const end=()=>{if(!b.classList.contains('held'))return;b.classList.remove('held');sp.onEnd();};
      b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.disabled)return;b.classList.add('held');try{b.setPointerCapture(e.pointerId);}catch(_){}sp.onStart();});
      ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,end));
      b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')){e.preventDefault();if(e.repeat||b.disabled)return;b.classList.add('held');sp.onStart();}});
      b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();end();}});
      b.addEventListener('blur',end);
      b.addEventListener('contextmenu',e=>e.preventDefault());
    }else b.addEventListener('click',()=>{if(!b.disabled)sp.onTap();});
    box.appendChild(b);
  });
}
function setControlsEnabled(on){document.querySelectorAll('#controls .act').forEach(b=>{b.disabled=!on;if(!on&&b.classList.contains('held')){b.classList.remove('held');}});}
function goStage(i){
  curIdx=i;cur=STAGES[i];running=false;finishing=false;
  cur.init();
  $('#stage-title').textContent=cur.name;$('#stage-hint').textContent=cur.hint;
  renderSteps();renderControls(cur.controls());setControlsEnabled(false);
  $('#intro-n').textContent='第 '+(i+1)+' 步，共 6 步';$('#intro-title').textContent=cur.name;$('#intro-text').textContent=cur.intro+(i===0?'\n\n今天做「'+FLV().n+'」。今日條件：'+condOf().n+'，'+condOf().d:'');
  $('#intro').hidden=false;setTimeout(()=>{try{$('#intro-go').focus({preventScroll:true});}catch(e){}},50);
}
$('#intro-go').addEventListener('click',()=>{$('#intro').hidden=true;running=true;setControlsEnabled(true);const b=document.querySelector('#controls .act');if(b)try{b.focus({preventScroll:true});}catch(e){}});
function finishStage(results){
  if(finishing)return;finishing=true;running=false;setControlsEnabled(false);
  results.forEach(r=>{S.scores[r.key]=Math.round(clamp(r.score,0,100));S.notes[r.key]=r.note;});
  setTimeout(()=>{if(screen!=='game'||cur!==STAGES[curIdx])return;if(curIdx<STAGES.length-1)goStage(curIdx+1);else showResult();},1400);
}
function renderFlavs(){
  const box=$('#flavs');box.innerHTML=Object.keys(FLAVORS).map(k=>{const ok=flavorOpen(k);return '<button type="button" data-fl="'+k+'" aria-pressed="'+(FL.pick===k)+'"'+(ok?'':' disabled')+'>'+FLAVORS[k].n+(ok?'':'（未解鎖）')+'</button>';}).join('');
  const F=FLAVORS[FL.pick];$('#fdesc').textContent=F.d+(flavorOpen('choc')&&flavorOpen('matcha')?'':'　原味 2 顆星解鎖巧克力，巧克力 2 顆星解鎖抹茶。');
  S.flavor=FL.pick;
}
renderFlavs();
$('#flavs').addEventListener('click',e=>{const b=e.target.closest('[data-fl]');if(!b||b.disabled)return;FL.pick=b.dataset.fl;saveFL();renderFlavs();});

/* 小菜園的雞蛋（共用倉庫）：用了有加分，沒有也照樣玩 */
function eggCount(){try{return window.GC&&GC.pantry?(GC.pantry().egg||0):0;}catch(e){return 0;}}
function eggOn(k){try{return GCStore.getItem(k)!=='0';}catch(e){return true;}}
function renderEgg(el,k,need){const n=eggCount();if(n<need){el.hidden=true;return;}el.hidden=false;const on=eggOn(k);
  el.innerHTML='<span>小菜園的雞蛋 ×'+n+'：用了 +5 分（每次 '+need+' 顆）</span><button type="button" class="eggtg" aria-pressed="'+on+'">'+(on?'使用':'不用')+'</button>';
  el.querySelector('button').onclick=()=>{try{GCStore.setItem(k,on?'0':'1');}catch(e){}renderEgg(el,k,need);};}
function takeEgg(k,need){if(!eggOn(k)||eggCount()<need)return false;try{return GC.take('egg',need);}catch(e){return false;}}
renderEgg($('#farmegg'),'souffle-egg',2);
function startGame(){resetRun();S.egg=takeEgg('souffle-egg',2);show('game');goStage(0);}
$('#start').addEventListener('click',startGame);
$('#again').addEventListener('click',startGame);
$('#restart').addEventListener('click',()=>{cur=null;startGame();});

function loadBest(){try{const v=GCStore.getItem('souffle-best');return v?JSON.parse(v):null;}catch(e){return null;}}
function saveBest(o){try{GCStore.setItem('souffle-best',JSON.stringify(o));}catch(e){}}
function showBest(){const b=loadBest();$('#best').textContent=b&&typeof b.score==='number'?'最佳紀錄 '+b.score+' 分，'+b.grade:'';}
showBest();

function scoreColor(v){return v>=80?'var(--good)':v>=50?'var(--yolk)':'var(--bad)';}
function showResult(){
  const qf=.4+.6*clamp(S.q||0,0,1);let total=0;ROWS.forEach(([k,,w])=>{total+=(S.scores[k]||0)*w*(k==='bake'||k==='serve'?qf:1);});total=Math.round(total);if(S.egg)total=Math.min(100,total+5);
  try{window.GC&&GC.report('souffle',{score:total,choc:S.flavor==='choc'?total:0,matcha:S.flavor==='matcha'?total:0,hard:S.cond!=='ok'?total:0});}catch(e){}
  const g=GRADES.find(x=>total>=x[0]);
  $('#r-score').textContent=total;$('#r-grade').textContent=g[1];$('#r-desc').textContent=g[2];
  const cm=S.finalH*.14;const stN=starsOfScore(total);$('#r-rise').textContent=(cm<.4?'幾乎沒有膨起來':'高出杯緣 '+cm.toFixed(1)+' 公分')+'　口味：'+FLV().n+'　條件：'+condOf().n+'　'+'★'.repeat(stN)+'☆'.repeat(3-stN)+(S.egg?'　自家雞蛋 +5':'');
  {const pb=FL.best[S.flavor||'plain']||0;const before={choc:flavorOpen('choc'),matcha:flavorOpen('matcha')};if(total>pb){FL.best[S.flavor||'plain']=total;saveFL();}if(!before.choc&&flavorOpen('choc'))toast('解鎖巧克力口味！');if(!before.matcha&&flavorOpen('matcha'))toast('解鎖抹茶口味！');}
  const best=loadBest();
  if(!best||total>best.score){saveBest({score:total,grade:g[1]});$('#r-best').textContent=best?'新紀錄！比上次多 '+(total-best.score)+' 分':'第一份成績已記下';}
  else $('#r-best').textContent='最佳紀錄 '+best.score+' 分';
  $('#r-rows').innerHTML=ROWS.map(([k,name])=>{const v=S.scores[k]||0;return '<li><div class="row-top"><span>'+name+'</span><b>'+v+'</b></div><div class="meter"><i style="width:'+v+'%;background:'+scoreColor(v)+'"></i></div><p>'+(S.notes[k]||'')+'</p></li>';}).join('');
  show('result');showBest();renderEgg($('#farmegg'),'souffle-egg',2);$('.scroll').scrollTop=0;
}

/* ---------- loop ---------- */
let last=performance.now();
function gl(id,on){try{window.GC&&GC.loop(id,on);}catch(e){}}
function stopAllLoops(){try{window.GC&&GC.stopLoops();}catch(e){}}
let ptrDown=false;cv.addEventListener('pointerdown',()=>{ptrDown=true;});['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{ptrDown=false;}));
function soundTick(){
  const on=screen==='game'&&cur&&running,k=cur&&cur.key,st=cur&&cur.st||{};
  gl('boil',!!(on&&k==='base'&&st.holding));
  gl('stir',!!(on&&(k==='whip'||k==='fold')&&ptrDown));
  gl('pour',!!(on&&k==='fill'&&(st.holding||st.pending>.05)));
  gl('oven',!!(on&&k==='bake'&&st.phase==='bake'));
}
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;NOW+=dt;
  soundTick();
  if(screen==='game'&&cur){cur.update(dt);if(W>0&&H>0)render();}
  else if(screen==='title'){heroT+=dt;drawTitleHero();}
  else if(screen==='result')drawResultHero();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load){document.fonts.load('16px Huninn','舒芙蕾').catch(()=>{});}
})();
</script>
