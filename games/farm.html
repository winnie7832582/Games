<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小菜園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{
  --bg:#EAF3DF; --surface:#FFFFFF; --ink:#33402B; --soft:#6B7A5E; --line:#D3E2C3; --accent:#3E8E41; --gold:#E0A526; --water:#3B8FD9; --bad:#C2453B; --on-accent:#FFFFFF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17211A;--surface:#223027;--ink:#E8F1DD;--soft:#A5B696;--line:#34473A;--accent:#7BC47F;--gold:#F2C14E;--water:#6FB6F0;--bad:#F07A6E;--on-accent:#14211A;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#17211A;--surface:#223027;--ink:#E8F1DD;--soft:#A5B696;--line:#34473A;--accent:#7BC47F;--gold:#F2C14E;--water:#6FB6F0;--bad:#F07A6E;--on-accent:#14211A;color-scheme:dark;}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Huninn,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.hud{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.hud .lv{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:2px 10px;font-size:.95rem;white-space:nowrap}
.hud .xp{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:30px}
.hud .xp i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hud .coins{color:var(--gold);font-size:1.15rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.stage{position:relative;flex:1;min-height:200px;margin:0 10px;border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-6px);opacity:0;padding:6px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:.95rem;white-space:nowrap;pointer-events:none;transition:opacity .15s,transform .15s;z-index:2;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:.88rem;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.seedbar{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.seedbar::-webkit-scrollbar{display:none}
.seedbar[hidden]{display:none}
.seedbar button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;cursor:pointer;font-size:.92rem;white-space:nowrap}
.seedbar button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.seedbar button:disabled{opacity:.4}
.quick{display:flex;gap:6px;padding:8px 10px 0}
.quick button{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 2px;cursor:pointer;font-size:.84rem;white-space:nowrap}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 10px 0}
.tools .tool{flex-direction:row;justify-content:center;gap:6px;padding:9px 4px;font-size:.98rem;font-weight:700}
.tools .tool svg{width:22px;height:22px}
.manage{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 10px 12px}
.manage button{position:relative;border:2px dashed var(--line);background:transparent;color:inherit;border-radius:12px;padding:7px 2px;cursor:pointer;font-size:.9rem;white-space:nowrap;touch-action:manipulation}
.manage button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.manage .bd{position:absolute;right:4px;top:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;min-width:16px;height:16px;line-height:16px;text-align:center}
.pc-crop{display:flex;align-items:baseline;gap:10px;margin:2px 0 6px}.pc-crop b{font-size:1.2rem}
.pc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.pc-btns .btn{width:100%;padding:12px 8px}
.pond{position:relative;height:130px;border-radius:14px;background:linear-gradient(#8FD0E8,#4A9CC0);overflow:hidden;margin:8px 0;touch-action:manipulation}
.pond::before{content:"";position:absolute;inset:auto -10% -30% -10%;height:60%;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.25),transparent 60%)}
.pond .bob{position:absolute;left:50%;top:48%;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff 0 38%,#E5483A 40%);box-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .12s;display:none}
.pond.wait .bob,.pond.bite .bob{display:block}.pond.wait .bob{animation:bob 1.6s ease-in-out infinite}.pond.bite .bob{transform:translateY(9px) scale(.8)}
.pond .ex{position:absolute;left:calc(50% + 14px);top:22%;font-weight:900;color:#fff;font-size:26px;display:none;text-shadow:0 2px 0 rgba(0,0,0,.25)}.pond.bite .ex{display:block}
.pond .msg{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
@keyframes bob{50%{transform:translateY(3px)}}@media (prefers-reduced-motion:reduce){.pond.wait .bob{animation:none}}
.pbar{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px 7px;cursor:pointer;font-size:.86rem;position:relative;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tool svg{width:26px;height:26px}
.tool[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.tool .bd{position:absolute;right:6px;top:3px;background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;min-width:16px;height:16px;line-height:16px;text-align:center}
.tool:focus-visible,.quick button:focus-visible,.seedbar button:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer;touch-action:manipulation}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.sheet{position:absolute;inset:0;z-index:6;display:flex;align-items:flex-end;background:rgba(20,30,20,.45)}
.sheet[hidden]{display:none}
.sbox{width:100%;max-height:84%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.barnart{display:block;width:100%;height:auto;max-height:150px;border-radius:14px;margin:0 0 8px;touch-action:manipulation}
.barnart .smoke{animation:smk 2.4s ease-in-out infinite}@keyframes smk{50%{transform:translateY(-3px);opacity:.5}}@media (prefers-reduced-motion:reduce){.barnart .smoke{animation:none}}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.shead h3{margin:0;flex:1;font-weight:400;font-size:1.25rem}
.soft{color:var(--soft);font-size:.9rem;line-height:1.6;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin:6px 0 8px}
.tab{flex:1;border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 4px;cursor:pointer}
.tab[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .tx b{font-weight:400;display:block}
.row .tx span{display:block;color:var(--soft);font-size:.84rem;line-height:1.45}
.row .btn{flex:none;padding:7px 11px;font-size:.92rem}
.row .btns{display:flex;gap:6px}
.up{color:#C2453B}
.hud .wx{border:0;background:transparent;padding:0 2px;font-size:1.15rem;line-height:1;cursor:pointer;position:relative;touch-action:manipulation}
.hud .wx.warn::after{content:"";position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.bump{animation:bump .45s ease-out}@keyframes bump{40%{transform:scale(1.35)}100%{transform:scale(1)}}
.hud .lv,.hud .coins{display:inline-block}
.fly{position:fixed;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);z-index:5;pointer-events:none}
.hearts{color:#E5587A;letter-spacing:1px}
.mbar{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}.mbar i{display:block;height:100%;background:#E5587A;border-radius:4px}
.tg{min-width:64px}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}
.row.big{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:12px;padding:9px 8px}.down{color:var(--water)}
.done{opacity:.55}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="../gc.js"></script>
</head>
<body>
<div class="app">
  <div class="hud"><span class="lv" id="lv"></span><span class="xp" id="xpb" role="progressbar" aria-label="經驗值"><i id="xpi"></i></span><button type="button" class="wx" id="wx" aria-label="天氣"></button><span class="coins" id="coins"></span></div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="菜園，點田地來操作"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="seedbar" id="seedbar" hidden></div>
  <div class="quick"><button type="button" id="q-water">全部澆水</button><button type="button" id="q-harvest">全部收成</button><button type="button" id="q-care">全部除草抓蟲</button></div>
  <div class="tools" id="tools"><button class="tool" type="button" data-tool="plant" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28V14M16 14c0-5-4-8-9-8 0 5 4 8 9 8zM16 18c0-4 3-7 8-7 0 4-3 7-8 7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>種植</span></button><button class="tool" type="button" data-tool="water" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4C11 12 8 16 8 20a8 8 0 0 0 16 0c0-4-3-8-8-16z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>澆水</span></button><button class="tool" type="button" data-tool="harvest" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 14h20l-2 12H8zM10 14c0-6 3-9 6-9s6 3 6 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>收成</span></button></div>
  <div class="manage"><button type="button" id="b-shop">商店</button><button type="button" id="b-order">訂單<span class="bd" id="ord-bd" hidden></span></button><button type="button" id="b-kit">農舍<span class="bd" id="kit-bd" hidden></span></button></div>
  <div class="sheet" id="sheet" hidden><div class="sbox" id="sbox" role="dialog" aria-modal="true"></div></div>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT='Huninn,"PingFang TC","Noto Sans TC",sans-serif';
function gsfx(n){try{window.GC&&GC.sfx(n);}catch(e){}}
function GCadd(m,k,n){try{window.GC&&GC.add('farm',k,n);}catch(e){}}
function GCmax(o){try{window.GC&&GC.max('farm',o);}catch(e){}}

/* ---------- data ---------- */
const MIN=60000;
const CROPS={
  cabbage:{n:'小白菜',grow:3*MIN,seed:3,sell:7,lv:1,col:'#6DB36B',fruit:'#8FD18B'},
  radish:{n:'白蘿蔔',grow:8*MIN,seed:5,sell:12,lv:1,col:'#5FA25F',fruit:'#F4F0E6'},
  tomato:{n:'番茄',grow:20*MIN,seed:12,sell:28,lv:2,col:'#4F9A4D',fruit:'#E5483A'},
  corn:{n:'玉米',grow:45*MIN,seed:22,sell:52,lv:3,col:'#5BA14F',fruit:'#F2C14E'},
  strawberry:{n:'草莓',grow:90*MIN,seed:40,sell:92,lv:4,col:'#5BA55A',fruit:'#D93A55'},
  pumpkin:{n:'南瓜',grow:240*MIN,seed:70,sell:165,lv:5,col:'#5A9E4E',fruit:'#F08A2E'},
  sunflower:{n:'向日葵',grow:120*MIN,seed:90,sell:210,lv:6,col:'#5CA14E',fruit:'#F5C20F'}
};
const CK=Object.keys(CROPS);
const EXTRA={dandelion:{n:'蒲公英',sell:2},cricket:{n:'蟋蟀',sell:4}};
const EK=Object.keys(EXTRA);
/* 加工坊：作物做成加工品，放進共用倉庫（gc.js），賣得比較貴，之後其他遊戲也能用 */
const RECIPES=[
  {id:'pickle',n:'醃蘿蔔',in:'radish',q:4,time:15*MIN,sell:70,lv:1},
  {id:'ketchup',n:'番茄醬',in:'tomato',q:3,time:30*MIN,sell:120,lv:2},
  {id:'jam',n:'草莓果醬',in:'strawberry',q:3,time:60*MIN,sell:380,lv:4}
];
function recipe(id){return RECIPES.find(r=>r.id===id);}
function hasPan(){return !!(window.GC&&GC.stock&&GC.take&&GC.pantry);}
function pan(){if(hasPan())try{return GC.pantry();}catch(e){}return Object.assign({},F.goods||{});}
function panAdd(id,n){if(hasPan())try{GC.stock(id,n);return;}catch(e){}F.goods=F.goods||{};F.goods[id]=(F.goods[id]||0)+n;}
function panTake(id,n){if(hasPan())try{return GC.take(id,n);}catch(e){}F.goods=F.goods||{};if((F.goods[id]||0)<n)return false;F.goods[id]-=n;return true;}
function kitSlots(){return F.up.kitchen2?2:1;}
const GOODS={pickle:['醃蘿蔔',70,'夜市人生'],ketchup:['番茄醬',120,'夜市人生'],jam:['草莓果醬',380,'搖搖茶舖（草莓果茶）'],egg:['雞蛋',15,'舒芙蕾、三味廚房、夜市人生'],fish:['吳郭魚',30,'夜市人生'],milkfish:['虱目魚',55,'夜市人生']};
/* 雞舍：餵飽的雞每 4 小時下一顆蛋；池塘：每 30 分鐘補一條魚，最多 5 條 */
const EGG_MS=4*60*MIN,FED_MS=12*60*MIN,POND_MS=30*MIN,POND_MAX=5;
function hens(){return F.up.coop2?4:F.up.coop?2:0;}
/* 雞的心情 0–100：心情好下蛋快（最快約 3 小時），心情差下蛋慢（約 5 小時）；餓著每小時 −2，吃飽每小時 −0.5，最低 10 */
function henRate(){const m=F.hen.mood==null?70:F.hen.mood;return .75+m/200;}
function henMood(){const m=F.hen.mood==null?70:F.hen.mood;return m>=75?'很開心，下蛋比較快':m>=45?'普通':'不太開心，下蛋比較慢';}
function henSim(now){const h=F.hen;if(h.mood==null)h.mood=70;if(!hens()){h.t=now;return;}const from=h.t||now,end=Math.min(now,h.fed||0);
  const fedMs=Math.max(0,end-from),hunMs=Math.max(0,now-from-fedMs);
  if(fedMs>0)h.prog=(h.prog||0)+fedMs*henRate();h.t=now;
  h.mood=clamp(h.mood-hunMs/3600000*2-fedMs/3600000*.5,10,100);
  while(h.prog>=EGG_MS){h.prog-=EGG_MS;h.eggs=Math.min(hens()*4,(h.eggs||0)+hens());}}
function pondSim(now){const p=F.pond;if(!F.up.pond){p.t=now;return;}if(p.n>=POND_MAX){p.t=now;return;}const k=Math.floor((now-(p.t||now))/POND_MS);if(k>0){p.n=Math.min(POND_MAX,p.n+k);p.t=p.n>=POND_MAX?now:p.t+k*POND_MS;}}
function fmtLeft(ms){const m=Math.ceil(ms/MIN);return m>=60?Math.floor(m/60)+' 小時'+(m%60?' '+m%60+' 分':''):m+' 分鐘';}
function nameOf(k){return (CROPS[k]||EXTRA[k]).n;}
const PLOTS=[4,6,9,12];
const UPS=[
  {id:'plots1',n:'擴建農田（6 塊）',cost:150,lv:2,d:'田地從 4 塊增加到 6 塊',need:s=>s.up.plots<6},
  {id:'scarecrow',n:'稻草人',cost:300,lv:2,d:'再也不會有蟲跑來',need:s=>!s.up.scarecrow},
  {id:'plots2',n:'擴建農田（9 塊）',cost:400,lv:4,d:'田地增加到 9 塊',need:s=>s.up.plots===6},
  {id:'fert',n:'有機肥料',cost:500,lv:4,d:'所有作物長得快 25%',need:s=>!s.up.fert},
  {id:'sprinkler',n:'自動灑水器',cost:700,lv:3,d:'田地永遠是濕的，不用再澆水',need:s=>!s.up.sprinkler},
  {id:'coop',n:'雞舍（2 隻雞）',cost:250,lv:2,d:'餵飽的雞會下蛋，蛋可以給舒芙蕾、三味廚房、夜市人生用',barn:'hen',need:s=>!s.up.coop},
  {id:'pond',n:'池塘',cost:350,lv:3,d:'可以釣魚，魚可以給夜市人生用',barn:'pond',need:s=>!s.up.pond},
  {id:'coop2',n:'雞舍擴建（4 隻雞）',cost:450,lv:4,d:'多養兩隻雞，蛋變兩倍',barn:'hen',need:s=>s.up.coop&&!s.up.coop2},
  {id:'kitchen2',n:'加工坊第二口鍋',cost:400,lv:3,d:'可以同時加工兩批',barn:'kit',need:s=>!s.up.kitchen2},
  {id:'plots3',n:'擴建農田（12 塊）',cost:900,lv:6,d:'田地增加到 12 塊',need:s=>s.up.plots===9},
  {id:'autoH',n:'自動收成',cost:1200,lv:6,d:'作物成熟會自動收進背包，離開遊戲時也會收',need:s=>!s.up.autoH},
  {id:'autoP',n:'自動補種',cost:1000,lv:7,d:'收成後用同一種種子自動種回去（要有種子）',need:s=>!s.up.autoP}
];
function autoOn(k){return !!F.up[k]&&(F.auto||{})[k]!==0;}
/* 村民：有名字和喜歡的作物；訂單裡有喜歡的作物，獎勵 +20%；每交一次貨好感 +1，5 和 10 顆心送種子 */
const VILS=[
  {n:'王奶奶',like:'cabbage',d:'每天煮小白菜湯給孫子喝'},
  {n:'隔壁的陳伯',like:'radish',d:'自己曬蘿蔔乾，越曬越多'},
  {n:'便當店的美玲姐',like:'tomato',d:'番茄炒蛋是店裡的招牌'},
  {n:'小學的林老師',like:'corn',d:'常帶學生做玉米濃湯'},
  {n:'甜點店的小芸',like:'strawberry',d:'草莓蛋糕一定要用新鮮草莓'},
  {n:'麵店的阿珠姨',like:'pumpkin',d:'冬天會賣南瓜米粉'},
  {n:'社區志工阿德',like:'sunflower',d:'喜歡在活動中心擺花'},
  {n:'背包客艾瑪',like:'radish',d:'走到哪裡都想吃在地的菜'}
];
function vil(n){return VILS.find(v=>v.n===n);}
function hearts(n){const h=(F.vil||{})[n]||0;return h;}
/* 魚圖鑑：吳郭魚和虱目魚放進共用倉庫，其他的直接賣給魚販；越稀有，上鉤後拉竿的時間越短 */
const FISH=[
  {id:'fish',n:'吳郭魚',r:0,w:50,cm:[15,30],pan:1},

/* 天氣：每天固定（同一天大家一樣）；下雨和颱風整天田地濕潤，颱風會吹壞一塊田 */
const WX={sun:{n:'晴天',i:'☀️',d:'陽光很好，記得澆水。'},cloud:{n:'多雲',i:'⛅',d:'雲多一點，跟平常一樣。'},rain:{n:'下雨',i:'🌧️',d:'田地整天都是濕的，不用澆水。'},typhoon:{n:'颱風',i:'🌀',d:'整天下雨，但強風會吹壞一塊田的作物。前一天先收成比較保險。'}};
let wxC={d:'',w:''};
function weather(d){d=d||today();if(d===wxC.d)return wxC.w;const r=rng('wx'+d)();const w=r<.04?'typhoon':r<.24?'rain':r<.5?'cloud':'sun';if(d===today())wxC={d,w};return w;}
function tomorrow(){const t=new Date();t.setDate(t.getDate()+1);return dstr(t);}
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function rainyDay(d){const w=weather(d);return w==='rain'||w==='typhoon';}
function rainNow(){return rainyDay(today());}
function wetTime(p,from,to){if(F.up.sprinkler)return to-from;let s=0,a=from;while(a<to){const b=Math.min(to,dayStart(a)+86400000);s+=rainyDay(dstr(new Date(a)))?b-a:clamp(Math.min(b,p.w)-a,0,b-a);a=b;}return s;}
/* 週末市集：六、日行情起伏大，還有一樣特別搶手的作物 */
function isMarket(){const k=new Date().getDay();return k===0||k===6;}
function hotCrop(){const lv=level(),pool=CK.filter(k=>CROPS[k].lv<=lv);return pool[Math.floor(rng('hot'+today())()*pool.length)];}

let F=null;
function dstr(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function today(){return dstr(new Date());}
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}
function newFarm(){
  const plots=[];for(let i=0;i<12;i++)plots.push({c:null,g:0,w:0,weed:false,bug:false});

}

function canGive(){return !!(window.GC&&(GC.give||GC.earn));}

function xpAt(l){return 25*(l-1)*(l-1);}
function themeBoost(id){try{const t=window.GC&&GC.theme&&GC.theme();return(t&&t.farm&&t.farm[id])||1;}catch(e){return 1;}}
function price(id){if(EXTRA[id])return EXTRA[id].sell;const base=CROPS[id].sell*themeBoost(id);const r=rng(today()+id)();if(isMarket())return Math.round(base*(0.55+1.1*r)*(id===hotCrop()?1.6:1));return Math.round(base*(0.8+0.4*r));}

function trend(id){if(EXTRA[id])return '';const p=price(id),b=CROPS[id].sell;return p>b*1.05?'up':p<b*.95?'down':'';}
function wetDur(id){return Math.max(90000,CROPS[id].grow*.5);}
function isWet(p,now){return F.up.sprinkler||rainNow()||p.w>now;}
function progress(p){return p.c?clamp(p.g/CROPS[p.c].grow,0,1):0;}
function stageOf(p){const x=progress(p);return x>=1?3:x>=.55?2:x>=.25?1:0;}

/* growth simulation (also catches up after being away) */
function sim(now){
  henSim(now);pondSim(now);
  const dt=Math.min(now-F.last,24*3600000);if(dt<=0){F.last=now;return;}
  const from=now-dt;let changed=false;
  F.plots.forEach((p,i)=>{
    if(i>=F.up.plots||!p.c||progress(p)>=1)return;
    const slow=(p.weed||p.bug)?.55:1;const fert=F.up.fert?1.25:1;
    const wet=wetTime(p,from,now);
    if(wet>0){{const was=progress(p)>=1;p.g=Math.min(CROPS[p.c].grow,p.g+wet*slow*fert);changed=true;if(!was&&progress(p)>=1&&dt<5000)gsfx('grow');}}
    const mins=dt/MIN;
    if(!p.weed&&Math.random()<1-Math.pow(.97,mins))p.weed=true;
    if(!p.bug&&!F.up.scarecrow&&Math.random()<1-Math.pow(.98,mins))p.bug=true;
  });
  F.last=now;
  if(autoOn('autoH'))for(let i=0;i<F.up.plots;i++){const p=F.plots[i];if(p.c&&progress(p)>=1){if(doHarvest(i,dt>5000))autoLog.h++;}}
}
let autoLog={h:0,p:0};
const ORDER_GAP=20*MIN,DAY_MAX=12;
function makeOrder(big){
  const lv=level(),pool=CK.filter(k=>CROPS[k].lv<=lv),pk=a=>a[Math.floor(Math.random()*a.length)];
  const need={};let val=0;
  if(big){const kinds=Math.min(pool.length,lv>=3?3:2);const ks=pool.slice().sort(()=>Math.random()-.5).slice(0,kinds);ks.forEach(k=>{const q=3+Math.floor(Math.random()*3);need[k]=q;val+=CROPS[k].sell*q;});
    return{who:pk(['巷口咖啡館的店長','夜市攤販聯盟','學校營養午餐','社區辦桌師傅']),need,reward:Math.round(val*2.2),xp:Math.round(val/5)+10,done:false,big:true};}
  const busy=F.orders&&F.orders.list?F.orders.list.filter(o=>!o.done).map(o=>o.who):[];const vs=VILS.filter(v=>busy.indexOf(v.n)<0),v=pk(vs.length?vs:VILS);
  const likeOk=CROPS[v.like].lv<=lv&&Math.random()<.6,c1=likeOk?v.like:pk(pool),q1=2+Math.floor(Math.random()*3);need[c1]=q1;val=CROPS[c1].sell*q1;
  if(lv>=3&&Math.random()<.4){const c2=pk(pool);if(c2!==c1){need[c2]=2;val+=CROPS[c2].sell*2;}}
  const like=!!need[v.like];
  return{who:v.n,need,like,reward:Math.round(val*1.5*(like?1.2:1)),xp:Math.round(val/8)+3,done:false};
}
function genOrders(){
  const day=today();
  if(F.orders.day!==day){F.orders={day,list:[makeOrder(false),makeOrder(false),makeOrder(true)],made:3};return;}
  if(F.orders.made==null)F.orders.made=F.orders.list.length;
  const now=Date.now();
  F.orders.list.forEach((o,i)=>{if(o.done&&!o.big&&o.doneAt&&now-o.doneAt>=ORDER_GAP&&F.orders.made<DAY_MAX){F.orders.list[i]=makeOrder(false);F.orders.made++;}});
}
function nextVillagerText(o){
  if(o.big)return '今天的大訂單完成了，明天會有新的';
  if(F.orders.made>=DAY_MAX)return '今天的村民都來過了，明天再來';
  const left=Math.max(0,Math.ceil(((o.doneAt||0)+ORDER_GAP-Date.now())/MIN));return '下一位村民大約 '+left+' 分鐘後來';
}

function bumpEl(el){if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
function gain(xp){const before=level();F.xp+=xp;const after=level();if(after>before){bumpEl($('#lv'));gsfx('level');toast('升級了！Lv'+after+(CK.filter(k=>CROPS[k].lv===after).length?'，解鎖新作物':''));buzz([20,40,20]);}}

/* ---------- actions ---------- */
const fx=[];
function pop(i,text,col){fx.push({i,text,col:col||'#fff',t:0});}
function doPlant(i){const p=F.plots[i];if(p.c)return false;if(!seedSel||!(F.seeds[seedSel]>0)){toast('先選一種有庫存的種子');return false;}
  F.seeds[seedSel]--;Object.assign(p,{c:seedSel,g:0,w:0,weed:false,bug:false});gsfx('pop');pop(i,'種下了',CROPS[seedSel].col);buzz(8);renderSeedbar();return true;}
function doWater(i){const p=F.plots[i];if(!p.c||progress(p)>=1||F.up.sprinkler||rainNow())return false;const now=Date.now();if(p.w>now+wetDur(p.c)*.6)return false;p.w=now+wetDur(p.c);pop(i,'澆水','#6FB6F0');splashDrops(i);gsfx('drip');return true;}
function doCare(i){const p=F.plots[i];if(!p.c)return false;if(p.weed){gsfx('whoosh');p.weed=false;F.stock.dandelion=(F.stock.dandelion||0)+1;pop(i,'拔掉雜草 +蒲公英','#8FD18B');buzz(6);GCadd('farm','weeds',1);return true;}if(p.bug){gsfx('whoosh');p.bug=false;F.stock.cricket=(F.stock.cricket||0)+1;pop(i,'抓到蟋蟀 +1','#F2C14E');buzz(6);GCadd('farm','pests',1);return true;}return false;}
function doHarvest(i,quiet){const p=F.plots[i];if(!p.c||progress(p)<1)return false;
  const y=Math.max(1,2-(p.weed?1:0)-(p.bug?1:0));const id=p.c;F.stock[id]=(F.stock[id]||0)+y;F.stats.harvest+=y;
  gain(Math.round(CROPS[id].sell/6)+2);Object.assign(p,{c:null,g:0,w:0,weed:false,bug:false});
  if(!quiet){pop(i,'+'+y+' '+CROPS[id].n,CROPS[id].fruit);gsfx('coin');buzz(12);flyCrop(i,CROPS[id].fruit,y);}
  if(autoOn('autoP')&&(F.seeds[id]||0)>0){F.seeds[id]--;Object.assign(p,{c:id,g:0,w:0,weed:false,bug:false});autoLog.p++;if(!quiet)renderSeedbar();}
  GCadd('farm','harvest',y);const o={level:level(),plots:F.up.plots};o['k_'+id]=1;GCmax(o);return true;}
function tapPlot(i){
  if(i<0||i>=F.up.plots)return;
  const p=F.plots[i];let did=false;
  if(p.c&&(p.weed||p.bug)&&tool!=='harvest'){did=doCare(i);}
  else if(tool==='plant')did=doPlant(i);
  else if(tool==='water')did=doWater(i);
  else if(tool==='harvest')did=doHarvest(i);
  else if(p.c&&progress(p)>=1)did=doHarvest(i);
  else if(p.c&&!isWet(p,Date.now())&&!F.up.sprinkler){did=doWater(i);}
  else if(!p.c){toast('先選「種植」和種子');}
  if(did){save();updateHud();}
}
function bulk(kind){
  let n=0;for(let i=0;i<F.up.plots;i++){
    if(kind==='water'&&doWater(i))n++;
    else if(kind==='harvest'&&doHarvest(i))n++;
    else if(kind==='care'&&doCare(i))n++;
  }
  if(!n&&kind==='water'&&rainNow()){toast('下雨天，不用澆水');return;}
  if(!n){toast(kind==='water'?'沒有需要澆水的田':kind==='harvest'?'還沒有成熟的作物':'田裡很乾淨');return;}
  toast(kind==='water'?'澆了 '+n+' 塊田':kind==='harvest'?'收成了 '+n+' 塊田':'處理了 '+n+' 塊田');save();updateHud();
}
/* ---------- 單格資訊卡（預設模式按住田地打開） ---------- */
const STG=['剛種下','長大中','快成熟','可以收成了'];
let pcI=-1,pcSig='';
function plotEta(p,now){
  if(progress(p)>=1)return '已經可以收成了';
  const C=CROPS[p.c],slow=(p.weed||p.bug)?.55:1,rate=slow*(F.up.fert?1.25:1);
  const need=(C.grow-p.g)/rate,wetLeft=F.up.sprinkler?Infinity:Math.max(0,p.w-now,rainNow()?dayStart(now)+86400000-now:0);
  if(wetLeft>=need)return '約 '+fmtLeft(need)+' 後可以收成';
  return wetLeft>0?'濕潤結束前長不完，之後要再澆水':'田乾了，要先澆水才會繼續長大';
}
function plotWater(p,now){
  if(progress(p)>=1)return '';
  if(F.up.sprinkler)return '自動灑水器讓田地一直濕潤';
  if(rainNow())return '下雨天，田地整天都是濕的';
  return isWet(p,now)?'濕潤，還能撐 '+fmtLeft(p.w-now):'乾燥，現在不會長大';
}
function plotSig(p,now){
  return [p.c||'',p.c?stageOf(p):'',p.c?(isWet(p,now)?1:0):'',p.weed?1:0,p.bug?1:0,progress(p)>=1?1:0,F.up.sprinkler?1:0,p.c?'':(seedSel||''),p.c?'':((F.seeds[seedSel]||0)>0?1:0)].join('|');
}
function plotCardHTML(i,now){
  const p=F.plots[i],head='<div class="shead"><h3>第 '+(i+1)+' 塊田</h3><button class="btn" type="button" data-close>關閉</button></div>';
  if(!p.c){
    const can=!!seedSel&&(F.seeds[seedSel]||0)>0;
    const hint=can?'選好的種子是「'+CROPS[seedSel].n+'」，點下面可以直接種下。':(CK.some(k=>(F.seeds[k]||0)>0)?'先在上方選一種有庫存的種子，再點「種植」。':'沒有種子了，到商店買一包再來。');
    return head+'<p class="soft">這塊田是空的。'+hint+'</p>'+(can?'<div class="pc-btns"><button class="btn main" type="button" data-pc="plant">種下'+CROPS[seedSel].n+'</button></div>':'');
  }
  const C=CROPS[p.c],st=stageOf(p),ready=progress(p)>=1,y=Math.max(1,2-(p.weed?1:0)-(p.bug?1:0));
  const pct=Math.round(progress(p)*100),pests=(p.weed?'有雜草':'')+(p.weed&&p.bug?'、':'')+(p.bug?'有蟲':'');
  const btns=[];
  if(!ready&&!F.up.sprinkler&&!isWet(p,now))btns.push('<button class="btn main" type="button" data-pc="water">澆水</button>');
  if(p.weed||p.bug)btns.push('<button class="btn" type="button" data-pc="care">'+(p.weed?'拔草':'抓蟲')+'</button>');
  if(ready)btns.push('<button class="btn main" type="button" data-pc="harvest">收成</button>');
  const w=plotWater(p,now);
  return head+
    '<div class="pc-crop"><b>'+C.n+'</b><span class="soft" id="pc-stage">'+STG[st]+'</span></div>'+
    '<span class="pbar"><i id="pc-bar" style="width:'+pct+'%"></i></span>'+
    '<p class="soft" id="pc-time">'+esc(plotEta(p,now))+'</p>'+
    '<p class="soft" id="pc-water"'+(w?'':' hidden')+'>'+esc(w)+'</p>'+
    '<p class="soft" id="pc-yield">'+(ready?'可收成 '+y+' 個':'收成約 '+y+' 個')+(pests?'（'+pests+'，處理掉會多收）':'')+'</p>'+
    (btns.length?'<div class="pc-btns">'+btns.join('')+'</div>':'');
}
function renderPlotCard(i){
  const now=Date.now();pcI=i;pcSig=plotSig(F.plots[i],now);
  sheet(plotCardHTML(i,now),b=>{b.querySelectorAll('[data-pc]').forEach(x=>x.addEventListener('click',()=>plotAct(i,x.dataset.pc)));});

function plotAct(i,k){
  let did=false;
  if(k==='water')did=doWater(i);else if(k==='care')did=doCare(i);else if(k==='harvest')did=doHarvest(i);else if(k==='plant')did=doPlant(i);
  if(did){save();updateHud();}

}
function refreshPlotCard(){
  if(pcI<0)return;
  if(!$('#pc-time')||$('#sheet').hidden||pcI>=F.up.plots){pcI=-1;return;}
  const p=F.plots[pcI],now=Date.now();

  const st=$('#pc-stage');if(st)st.textContent=STG[stageOf(p)];
  const bar=$('#pc-bar');if(bar)bar.style.width=Math.round(progress(p)*100)+'%';

}

  return '<p class="soft" style="margin-top:12px"><b>魚圖鑑 '+got+'/'+FISH.length+'</b>：越稀有的魚，上鉤後要拉得越快。</p>'+FISH.map(f=>{const d=F.dex[f.id];
    return '<div class="row"><div class="tx"><b>'+(d?f.n:'？？？')+' <i style="font-style:normal;font-size:.8rem;color:'+RARE_COL[f.r]+'">'+RARE[f.r]+'</i></b><span>'+(d?'釣到 '+d.c+' 次・最大 '+d.max+' 公分・'+(f.pan?'放進共用倉庫':'魚販收購 $'+f.sell):'還沒釣到')+'</span></div></div>';}).join('');}
function openPond(){
  if(!F.up.pond){sheet(barnHead()+'<p class="soft">還沒有池塘。挖好之後就可以釣魚。</p>'+buildRows('pond'),bindTabs);return;}
  const p=F.pond,G=pan();
  sheet(barnHead()+
    '<p class="soft">池塘裡有 <b id="pd-n">'+p.n+'</b> 條魚，每 30 分鐘補一條（最多 '+POND_MAX+' 條）。拋竿後等浮標往下沉、出現「！」再拉竿，太早拉會把魚嚇跑。</p>'+
    '<div class="pond" id="pond" role="img" aria-label="池塘"><span class="bob"></span><span class="ex">！</span><span class="msg" id="pd-msg"></span></div>'+
    '<button class="btn main" type="button" id="pd-go" style="width:100%;padding:14px"'+(p.n<1?' disabled':'')+'>'+(p.n<1?'魚被釣光了，等一下再來':'拋竿')+'</button>'+
    '<p class="soft" style="margin-top:10px">吳郭魚和虱目魚會放進共用倉庫，可以賣掉或給夜市人生用。倉庫裡有<span id="pd-inv">吳郭魚 '+(G.fish||0)+' 條、虱目魚 '+(G.milkfish||0)+' 條</span>。</p><div id="pd-dex">'+dexHTML()+'</div>',b=>{bindTabs(b);
    const pd=b.querySelector('#pond'),go=b.querySelector('#pd-go'),msg=b.querySelector('#pd-msg');let st='idle',cur=null;
    const later=(f,ms)=>fishT.push(setTimeout(()=>{if(!$('#sheet').hidden&&b.isConnected)f();},ms));
    const reset=t=>{st='idle';pd.className='pond';msg.textContent=t||'';go.textContent=F.pond.n<1?'魚被釣光了，等一下再來':'再拋一次';go.disabled=F.pond.n<1;};
    const act=()=>{
      if(st==='idle'){if(F.pond.n<1)return;st='wait';pd.className='pond wait';msg.textContent='';go.textContent='等魚上鉤…';gsfx('plop');
        later(()=>{if(st!=='wait')return;st='bite';cur=pickFish();pd.className='pond bite';go.textContent='拉竿！';gsfx('splash');buzz(cur.r>=2?[30,20,30]:30);
          later(()=>{if(st==='bite')reset(cur.r>=2?'跑掉了…好像是條'+RARE[cur.r]+'的魚':'魚跑掉了…');},RARE_MS[cur.r]);},1500+Math.random()*2500);}
      else if(st==='wait'){gsfx('bad');reset('太早了，魚被嚇跑了');}
      else if(st==='bite'){const f=cur,cm=f.cm[0]+Math.floor(Math.random()*(f.cm[1]-f.cm[0]+1));F.pond.n--;if(F.pond.n===POND_MAX-1)F.pond.t=Date.now();
        F.dex=F.dex||{};const d=F.dex[f.id],isNew=!d,rec=d&&cm>d.max;F.dex[f.id]={c:(d?d.c:0)+1,max:Math.max(cm,d?d.max:0)};
        if(f.pan)panAdd(f.id,1);else{addCoins(f.sell);F.stats.earned+=f.sell;GCadd('farm','earned',f.sell);}
        gain(RARE_XP[f.r]);GCadd('farm','fish',1);GCmax({dex:FISH.filter(z=>F.dex[z.id]).length});
        gsfx(f.r>=2?'fanfare':'great');buzz([10,30,10]);b.querySelector('#pd-n').textContent=F.pond.n;{const G2=pan();b.querySelector('#pd-inv').textContent='吳郭魚 '+(G2.fish||0)+' 條、虱目魚 '+(G2.milkfish||0)+' 條';}
        b.querySelector('#pd-dex').innerHTML=dexHTML();save();updateHud();
        reset('釣到 '+cm+' 公分的'+f.n+'！'+(isNew?'（新圖鑑）':rec?'（新紀錄）':'')+(f.pan?'':' +$'+f.sell));}
    };
    go.addEventListener('click',act);pd.addEventListener('pointerdown',e=>{e.preventDefault();if(st!=='idle')act();});
  });
}
function openKitchen(){
  F.kit=F.kit||[];const now=Date.now(),lv=level(),n=kitSlots(),G=pan();
  const free=()=>{for(let i=0;i<n;i++)if(!F.kit[i])return i;return -1;};
  let slots='';for(let i=0;i<n;i++){const k=F.kit[i];
    if(!k)slots+='<div class="row"><div class="tx"><b>鍋子 '+(i+1)+'</b><span>空著，從下面選一樣來做</span></div></div>';
    else{const r=recipe(k.r),done=now>=k.end,pr=clamp(1-(k.end-now)/(k.end-k.start),0,1);
      slots+='<div class="row"><div class="tx"><b>'+r.n+' ×'+k.q+'</b><span>'+(done?'做好了！':'還要 '+fmtLeft(k.end-now))+'</span>'+(done?'':'<span class="pbar"><i style="width:'+Math.round(pr*100)+'%"></i></span>')+'</div>'+(done?'<button class="btn main" type="button" data-take="'+i+'">收進倉庫</button>':'')+'</div>';}}
  const fi=free();
  const recs=RECIPES.map(r=>{const lock=r.lv>lv,have=F.stock[r.in]||0,max=Math.min(5,Math.floor(have/r.q));
    return '<div class="row"><div class="tx"><b>'+r.n+(lock?'':'　$'+r.sell)+'</b><span>'+(lock?'Lv'+r.lv+' 解鎖':CROPS[r.in].n+' ×'+r.q+' → 1 罐，'+fmtLeft(r.time)+'（有 '+have+' 個）')+'</span></div>'+
      (lock?'':'<div class="btns"><button class="btn" type="button" data-make="'+r.id+':1"'+(fi<0||max<1?' disabled':'')+'>做 1</button><button class="btn main" type="button" data-make="'+r.id+':'+max+'"'+(fi<0||max<2?' disabled':'')+'>做 '+Math.max(2,max)+'</button></div>')+'</div>';}).join('');
  const inv=Object.keys(GOODS).filter(k=>G[k]>0).map(k=>GOODS[k][0]+' ×'+G[k]).join('、');
  sheet(barnHead()+'<p class="soft">把作物做成加工品，賣得比直接賣菜貴。做好的東西會放進<b>共用倉庫</b>，之後其他遊戲也能用。</p>'+slots+
    '<p class="soft" style="margin-top:12px">'+(fi<0?'鍋子都在忙，做好再來。':'要做什麼？一次最多 5 罐。')+'</p>'+recs+
    buildRows('kit')+'<p class="soft" style="margin-top:12px">共用倉庫：'+(inv||'還是空的')+'。可以到商店的「賣出」賣掉。</p>',b=>{bindTabs(b);
    b.querySelectorAll('[data-make]').forEach(x=>x.addEventListener('click',()=>{const[id,q0]=x.dataset.make.split(':');const r=recipe(id),q=+q0,i=free();
      if(!r||i<0||q<1||(F.stock[r.in]||0)<r.q*q)return;F.stock[r.in]-=r.q*q;const t=Date.now();F.kit[i]={r:id,q,start:t,end:t+r.time*q};
      gsfx('plop');buzz(8);toast('開始做'+r.n+' ×'+q);save();updateHud();openKitchen();}));
    b.querySelectorAll('[data-take]').forEach(x=>x.addEventListener('click',()=>{const i=+x.dataset.take,k=F.kit[i];if(!k||Date.now()<k.end)return;const r=recipe(k.r);
      panAdd(k.r,k.q);F.kit[i]=null;gain(Math.round(r.sell*k.q/20)+2);GCadd('farm','processed',k.q);gsfx('ding');buzz([10,30,10]);toast(r.n+' ×'+k.q+' 收進倉庫');save();updateHud();openKitchen();}));
  });
}

const cv=$('#cv'),ctx=cv.getContext('2d'),stageEl=$('#stage');
let W=0,H=0,DPR=1,NOW=0,layout=null;
function noteSpot(r){try{const d=document.documentElement.style;d.setProperty('--gc-note-top','auto');d.setProperty('--gc-note-bottom',Math.max(8,innerHeight-r.bottom+34)+'px');}catch(e){}}
function resize(){const r=stageEl.getBoundingClientRect();noteSpot(r);DPR=Math.min(window.devicePixelRatio||1,2.5);W=r.width;H=r.height;cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));makeLayout();}
try{new ResizeObserver(resize).observe(stageEl);}catch(e){addEventListener('resize',resize);}
function makeLayout(){
  const n=F?F.up.plots:4,cols=n<=4?2:3,rows=Math.ceil(n/cols);
  const top=H*.26,areaH=H-top-14,areaW=W-24;const cell=Math.min(areaW/cols,areaH/rows,150);
  const gw=cell*cols,gh=cell*rows;const x0=(W-gw)/2,y0=top+(areaH-gh)/2;
  layout={cols,rows,cell,x0,y0,n};
}
function plotAt(x,y){if(!layout)return-1;const{cols,cell,x0,y0,n}=layout;const cx=Math.floor((x-x0)/cell),cy=Math.floor((y-y0)/cell);if(cx<0||cx>=cols||cy<0)return-1;const i=cy*cols+cx;return i<n?i:-1;}
function rrect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function leaf(c,x,y,len,ang,col){c.save();c.translate(x,y);c.rotate(ang);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*.5,-len*.38,len,0);c.quadraticCurveTo(len*.5,len*.38,0,0);c.fillStyle=col;c.fill();c.lineWidth=1;c.strokeStyle='rgba(30,50,20,.45)';c.stroke();c.restore();}
function sprite(c,id,st,cx,by,sz,bob,sc){
  const C=CROPS[id],s=sz;c.save();c.translate(cx,by+bob);if(sc&&sc!==1)c.scale(1+(sc-1)*.6,sc);
  const k=[.35,.6,.85,1][st];
  if(id==='cabbage'){for(let i=0;i<5+st;i++){leaf(c,0,0,s*.3*k+s*.08,-Math.PI/2+(i-2.5-st/2)*.42,C.col);}if(st===3){c.beginPath();c.arc(0,-s*.1,s*.14,0,Math.PI*2);c.fillStyle=C.fruit;c.fill();c.strokeStyle='rgba(30,50,20,.4)';c.stroke();}}
  else if(id==='radish'){for(let i=0;i<4;i++)leaf(c,0,0,s*.34*k+s*.06,-Math.PI/2+(i-1.5)*.5,C.col);if(st>=2){c.beginPath();c.ellipse(0,s*.03,s*.1*k,s*.07*k,0,0,Math.PI*2);c.fillStyle=st===3?'#F7EFF0':'#E9B8C0';c.fill();c.strokeStyle='rgba(60,40,40,.4)';c.stroke();}}
  else if(id==='tomato'){c.beginPath();c.moveTo(0,0);c.lineTo(0,-s*.5*k);c.lineWidth=2.4;c.strokeStyle=C.col;c.stroke();for(let i=0;i<3;i++)leaf(c,0,-s*(.1+i*.12)*k,s*.26*k,i%2?-.3:-Math.PI+.3,C.col);if(st>=2){[[-.16,-.32],[.15,-.26],[0,-.42]].forEach(([x,y],i)=>{if(st<3&&i>0)return;c.beginPath();c.arc(x*s,y*s,s*.075,0,Math.PI*2);c.fillStyle=st===3?C.fruit:'#B7D56A';c.fill();c.strokeStyle='rgba(60,20,20,.4)';c.stroke();});}}
  else if(id==='corn'){c.beginPath();c.moveTo(0,0);c.lineTo(0,-s*.7*k);c.lineWidth=3;c.strokeStyle=C.col;c.stroke();for(let i=0;i<3;i++){leaf(c,0,-s*(.12+i*.14)*k,s*.38*k,i%2?-.25:-Math.PI+.25,C.col);}if(st>=2){c.save();c.translate(s*.06,-s*.38*k);c.rotate(.1);rrect(c,-s*.05,-s*.15,s*.1,s*.26,s*.05);c.fillStyle=st===3?C.fruit:'#CFE08A';c.fill();c.strokeStyle='rgba(80,60,0,.4)';c.stroke();c.restore();}}
  else if(id==='strawberry'){for(let i=0;i<6;i++)leaf(c,0,0,s*.3*k+s*.06,-Math.PI/2+(i-2.5)*.38,C.col);if(st>=2){[[-.15,-.06],[.14,-.04],[0,-.12]].forEach(([x,y],i)=>{if(st<3&&i>0)return;c.beginPath();c.moveTo(x*s,y*s+s*.07);c.quadraticCurveTo(x*s-s*.08,y*s-s*.04,x*s,y*s-s*.06);c.quadraticCurveTo(x*s+s*.08,y*s-s*.04,x*s,y*s+s*.07);c.fillStyle=st===3?C.fruit:'#F0D0D0';c.fill();c.strokeStyle='rgba(80,10,20,.4)';c.stroke();});}}
  else if(id==='pumpkin'){for(let i=0;i<4;i++)leaf(c,0,0,s*.34*k,-Math.PI/2+(i-1.5)*.7,C.col);if(st>=2){c.beginPath();c.ellipse(0,-s*.06,s*.17*k,s*.13*k,0,0,Math.PI*2);c.fillStyle=st===3?C.fruit:'#B9D56A';c.fill();c.strokeStyle='rgba(90,40,0,.45)';c.stroke();c.beginPath();c.moveTo(-s*.05*k,-s*.18*k);c.lineTo(0,-s*.22*k);c.lineWidth=2;c.strokeStyle='#5A7A30';c.stroke();}}
  else if(id==='sunflower'){c.beginPath();c.moveTo(0,0);c.lineTo(0,-s*.62*k);c.lineWidth=3;c.strokeStyle=C.col;c.stroke();leaf(c,0,-s*.2*k,s*.24*k,-.4,C.col);leaf(c,0,-s*.3*k,s*.24*k,-Math.PI+.4,C.col);if(st>=1){const hy=-s*.64*k;if(st===3)for(let i=0;i<10;i++){leaf(c,0,hy,s*.2,i*Math.PI/5,C.fruit);}c.beginPath();c.arc(0,hy,s*(st===3?.09:.06),0,Math.PI*2);c.fillStyle=st===3?'#6B4423':'#8FB05A';c.fill();}}
  c.restore();
}
function drawScene(c){
  const h=new Date().getHours();const night=h>=19||h<6,dusk=(h>=17&&h<19)||(h>=6&&h<8);
  const wxw=weather(),rainy=wxw==='rain'||wxw==='typhoon';
  const g=c.createLinearGradient(0,0,0,H*.4);g.addColorStop(0,night?(rainy?'#1C2333':'#243055'):rainy?'#7E8C9E':dusk?'#F4B98E':'#8CCBF0');g.addColorStop(1,night?(rainy?'#2C3446':'#3B4A7A'):rainy?'#BCC6D0':dusk?'#FBE0B8':'#D8F0FA');c.fillStyle=g;c.fillRect(0,0,W,H);
  if(rainy||wxw==='cloud'){const cs=rainy?'rgba(110,118,132,.95)':'rgba(255,255,255,.9)';[[.15,.08,1],[.5,.06,1.3],[.82,.1,1.1]].forEach(([fx,fy,k],j)=>{const cx=((W*fx+(reduceMotion?0:NOW*(wxw==='typhoon'?30:4)))+j*7)%(W+80)-40;c.fillStyle=cs;[[0,0,24,10],[18,-5,18,10],[-16,2,16,8]].forEach(([dx,dy,rx,ry])=>{c.beginPath();c.ellipse(cx+dx*k,H*fy+dy,rx*k,ry*k,0,0,Math.PI*2);c.fill();});});}

  else{c.fillStyle=dusk?'#F58B4C':'#FFE27A';c.beginPath();c.arc(W*.84,H*.1,15,0,Math.PI*2);c.fill();const cx=(NOW*6)%(W+80)-40;c.fillStyle='rgba(255,255,255,.85)';[[0,0,20,9],[16,-4,16,9],[-14,2,14,7]].forEach(([dx,dy,rx,ry])=>{c.beginPath();c.ellipse(cx+dx,H*.12+dy,rx,ry,0,0,Math.PI*2);c.fill();});}
  c.fillStyle=night?'#2A4A30':'#8CC26A';c.beginPath();c.moveTo(0,H*.3);c.quadraticCurveTo(W*.3,H*.24,W*.6,H*.3);c.quadraticCurveTo(W*.85,H*.34,W,H*.28);c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();

  drawDecos(c);
  if(F.up.scarecrow){const sx=W*.1,sy=H*.3;c.strokeStyle='#8A5A3B';c.lineWidth=3;c.beginPath();c.moveTo(sx,sy+30);c.lineTo(sx,sy-8);c.moveTo(sx-14,sy+2);c.lineTo(sx+14,sy+2);c.stroke();c.fillStyle='#F2C14E';c.beginPath();c.arc(sx,sy-14,7,0,Math.PI*2);c.fill();c.fillStyle='#8A5A3B';c.fillRect(sx-9,sy-22,18,4);}
}
function drawDecos(c){
  const by=H*.3,t=NOW;
  if(DECO.pond){c.fillStyle='#6BB6E8';c.beginPath();c.ellipse(W*.28,by-3,26,6,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=1.5;c.beginPath();c.ellipse(W*.28,by-3,12,2.6,0,0,Math.PI*2);c.stroke();}
  if(DECO.flowers){for(let i=0;i<14;i++){const x=10+i*(W-20)/13,y=by+22+(i%2)*3;c.fillStyle=['#F28CA0','#FFE27A','#B58CF0','#FFFFFF'][i%4];c.beginPath();c.arc(x,y,3,0,Math.PI*2);c.fill();c.fillStyle='#4E8F3A';c.fillRect(x-.5,y+2,1,5);}}
  if(DECO.windmill){const x=W*.86,y=by;c.fillStyle='#E9D8BE';c.beginPath();c.moveTo(x-10,y);c.lineTo(x-6,y-34);c.lineTo(x+6,y-34);c.lineTo(x+10,y);c.closePath();c.fill();c.strokeStyle='#8A6A44';c.lineWidth=2;c.stroke();c.fillStyle='#B5533C';c.beginPath();c.moveTo(x-8,y-34);c.lineTo(x,y-44);c.lineTo(x+8,y-34);c.closePath();c.fill();c.save();c.translate(x,y-34);c.rotate(t*1.2);c.strokeStyle='#8A6A44';c.lineWidth=2;c.fillStyle='rgba(255,255,255,.85)';for(let k=0;k<4;k++){c.rotate(Math.PI/2);c.fillRect(2,-3,24,6);c.strokeRect(2,-3,24,6);}c.restore();}
  if(DECO.pumpkin){const x=W*.5,y=by-2;c.fillStyle='#F08A2E';c.beginPath();c.ellipse(x,y-9,13,10,0,0,Math.PI*2);c.fill();c.strokeStyle='#8A4A10';c.lineWidth=1.5;c.stroke();c.fillStyle='#FFE27A';c.beginPath();c.moveTo(x-6,y-12);c.lineTo(x-2,y-12);c.lineTo(x-4,y-8);c.fill();c.beginPath();c.moveTo(x+2,y-12);c.lineTo(x+6,y-12);c.lineTo(x+4,y-8);c.fill();c.fillRect(x-6,y-5,12,2);c.fillStyle='#5A7A30';c.fillRect(x-1,y-21,3,5);}
  if(DECO.tree){const x=W*.62,y=by;c.fillStyle='#6B4A2E';c.fillRect(x-2,y-6,4,8);c.fillStyle='#2E7A46';[[30,26],[24,36],[18,46]].forEach(([w,o])=>{c.beginPath();c.moveTo(x-w/2,y-o+16);c.lineTo(x,y-o-6);c.lineTo(x+w/2,y-o+16);c.fill();});c.fillStyle='#F2C14E';c.beginPath();c.arc(x,y-52,3,0,Math.PI*2);c.fill();[[-5,-22,'#E5483A'],[6,-32,'#5AA9E6'],[-4,-38,'#F2C14E']].forEach(([dx,dy,col])=>{c.fillStyle=col;c.globalAlpha=.7+.3*Math.sin(t*3+dx);c.beginPath();c.arc(x+dx,y+dy,2,0,Math.PI*2);c.fill();c.globalAlpha=1;});}
  if(DECO.sakura){const x=W*.62,y=by;c.fillStyle='#7A5A3E';c.fillRect(x-2,y-22,4,24);c.fillStyle='#F6B6CC';[[0,-30,16],[-12,-22,11],[12,-24,11],[0,-18,10]].forEach(([dx,dy,r])=>{c.beginPath();c.arc(x+dx,y+dy,r,0,Math.PI*2);c.fill();});for(let k=0;k<5;k++){const ph=(t*.4+k*.37)%1;c.fillStyle='rgba(246,182,204,'+(1-ph)+')';c.beginPath();c.arc(x-20+k*10+Math.sin(ph*6)*5,y-20+ph*34,2,0,Math.PI*2);c.fill();}}
  if(DECO.lantern){[W*.4,W*.6].forEach((x,i)=>{const y=by-18+Math.sin(t*1.5+i)*1.5;c.strokeStyle='#8A4A10';c.lineWidth=1.5;c.beginPath();c.moveTo(x,by-34);c.lineTo(x,y-8);c.stroke();c.fillStyle='#D9362B';c.beginPath();c.ellipse(x,y,9,11,0,0,Math.PI*2);c.fill();c.fillStyle='#F2C14E';c.fillRect(x-4,y-12,8,2);c.fillRect(x-4,y+10,8,2);});}
  if(DECO.moon){const x=W*.5,y=H*.12;const g=c.createRadialGradient(x,y,4,x,y,34);g.addColorStop(0,'rgba(255,244,196,.9)');g.addColorStop(1,'rgba(255,244,196,0)');c.fillStyle=g;c.fillRect(x-40,y-40,80,80);c.fillStyle='#FFF4C4';c.beginPath();c.arc(x,y,13,0,Math.PI*2);c.fill();}
}
function drawPlot(c,i,now){
  const{cols,cell,x0,y0}=layout;const col=i%cols,row=Math.floor(i/cols);const x=x0+col*cell,y=y0+row*cell,pad=cell*.07;
  const p=F.plots[i];const wet=isWet(p,now);
  const tw=p.c&&wet?1:0;AN.wet[i]=AN.wet[i]==null?tw:(reduceMotion?tw:AN.wet[i]+(tw-AN.wet[i])*Math.min(1,FDT*2.5));const wk=AN.wet[i];
  rrect(c,x+pad,y+pad,cell-pad*2,cell-pad*2,cell*.12);c.fillStyle='rgb('+Math.round(lerp(139,96,wk))+','+Math.round(lerp(94,60,wk))+','+Math.round(lerp(60,32,wk))+')';c.fill();
  if(wk>.05){c.save();c.globalAlpha=wk*.18;c.fillStyle='#BFE3FF';[[.28,.3],[.66,.52],[.4,.72]].forEach(([a,b2])=>{c.beginPath();c.ellipse(x+cell*a,y+cell*b2,cell*.08,cell*.025,0,0,Math.PI*2);c.fill();});c.restore();}c.lineWidth=2;c.strokeStyle='rgba(50,30,15,.5)';c.stroke();
  c.strokeStyle='rgba(40,25,10,.28)';c.lineWidth=1.5;for(let k=1;k<4;k++){c.beginPath();c.moveTo(x+pad*2,y+pad+k*(cell-pad*2)/4);c.lineTo(x+cell-pad*2,y+pad+k*(cell-pad*2)/4);c.stroke();}
  if(p.c){
    const st=stageOf(p),ready=st===3;const bob=ready&&!reduceMotion?Math.sin(NOW*5+i)*1.5:0;
    if(ready){const gl=c.createRadialGradient(x+cell/2,y+cell*.55,2,x+cell/2,y+cell*.55,cell*.5);gl.addColorStop(0,'rgba(255,230,120,.55)');gl.addColorStop(1,'rgba(255,230,120,0)');c.fillStyle=gl;c.fillRect(x,y,cell,cell);}
    const key=p.c+st;if(AN.key[i]!==undefined&&AN.key[i]!==key)AN.b[i]=NOW;AN.key[i]=key;
    const bt=NOW-(AN.b[i]==null?-9:AN.b[i]),sc=reduceMotion||bt>.55?1:1+.3*Math.sin(bt/.55*Math.PI)*(1-bt/.55*.5);
    sprite(c,p.c,st,x+cell/2,y+cell*.8,cell*.95,bob,sc);
    if(!ready){const bw=cell*.62,bx=x+(cell-bw)/2,by=y+cell-pad-cell*.1;rrect(c,bx,by,bw,5,2.5);c.fillStyle='rgba(0,0,0,.28)';c.fill();c.save();rrect(c,bx,by,bw,5,2.5);c.clip();c.fillStyle='#FFD95A';c.fillRect(bx,by,bw*progress(p),5);c.restore();}
    if(!wet&&!ready){c.fillStyle='#3B8FD9';const dx=x+cell-pad-cell*.16,dy=y+pad+cell*.16;c.beginPath();c.moveTo(dx,dy-9);c.quadraticCurveTo(dx+9,dy+2,dx,dy+8);c.quadraticCurveTo(dx-9,dy+2,dx,dy-9);c.fill();c.fillStyle='#fff';c.font='700 10px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillText('!',dx,dy+2);}
    if(p.weed){for(let k=0;k<4;k++){leaf(c,x+pad*2.4+k*cell*.07,y+cell-pad*2.6,cell*.2,-Math.PI/2+(k-1.5)*.45+(reduceMotion?0:Math.sin(NOW*2.4+i+k*.8)*.15),'#4E8F3A');}}
    if(p.bug){const t=reduceMotion?.6:NOW*.8+i*1.7,bx=x+cell*(.5+.24*Math.cos(t)),by=y+cell*(.4+.14*Math.sin(t*2)),ang=Math.atan2(.28*Math.cos(t*2),-.24*Math.sin(t)),lw=reduceMotion?0:Math.sin(NOW*16+i)*1.8;
      c.save();c.translate(bx,by);c.rotate(ang);c.strokeStyle='#222';c.lineWidth=1.2;for(let L=-1;L<=1;L++){const w2=L===0?-lw:lw;c.beginPath();c.moveTo(L*3,-3);c.lineTo(L*3+w2,-8);c.moveTo(L*3,3);c.lineTo(L*3-w2,8);c.stroke();}
      c.fillStyle='#C2453B';c.beginPath();c.ellipse(0,0,7,5.5,0,0,Math.PI*2);c.fill();c.strokeStyle='#6B1E17';c.beginPath();c.moveTo(-6,0);c.lineTo(4,0);c.stroke();c.fillStyle='#222';c.beginPath();c.arc(6.5,0,3,0,Math.PI*2);c.fill();[[-2,-2.6],[-2,2.6]].forEach(([a,b2])=>{c.beginPath();c.arc(a,b2,1.2,0,Math.PI*2);c.fill();});c.restore();}
  }else if(tool==='plant'){c.strokeStyle='rgba(255,255,255,.6)';c.setLineDash([5,5]);c.lineWidth=2;rrect(c,x+pad*2,y+pad*2,cell-pad*4,cell-pad*4,cell*.1);c.stroke();c.setLineDash([]);}
}
const AN={wet:[],key:[],b:[]},DROPS=[];let FDT=0;
function c2drop(c,x,y){c.fillStyle='#8CCBF5';c.beginPath();c.moveTo(x,y-5);c.quadraticCurveTo(x+3.5,y+1,x,y+3);c.quadraticCurveTo(x-3.5,y+1,x,y-5);c.fill();}
function splashDrops(i){if(reduceMotion||!layout)return;const{cols,cell,x0,y0}=layout,x=x0+(i%cols)*cell,y=y0+Math.floor(i/cols)*cell;for(let k=0;k<9;k++)DROPS.push({x:x+cell*(.2+.6*Math.random()),y:y+cell*(.02+.15*Math.random()),vy:40+Math.random()*60,floor:y+cell*(.5+.35*Math.random()),s:0});}
function drawRain(c){const w=weather();if(w!=='rain'&&w!=='typhoon')return;const ty=w==='typhoon',n=ty?70:40,t=reduceMotion?0:NOW,sl=ty?9:2;
  c.strokeStyle='rgba(210,230,255,.55)';c.lineWidth=1.2;c.beginPath();for(let k=0;k<n;k++){const x=((k*97.3+t*(ty?200:30))%(W+40))-20,y=((k*61.7)+t*(ty?520:380))%(H+20)-10;c.moveTo(x,y);c.lineTo(x-sl,y+12);}c.stroke();}
function flyCrop(i,col,n){const tgt=$('#coins');if(!tgt||!layout)return;if(reduceMotion){bumpEl(tgt);return;}
  try{const r=cv.getBoundingClientRect(),{cols,cell,x0,y0}=layout,sx=r.left+x0+(i%cols)*cell+cell/2,sy=r.top+y0+Math.floor(i/cols)*cell+cell*.5,tr=tgt.getBoundingClientRect(),tx=tr.left+tr.width*.3,ty=tr.top+tr.height/2;
    for(let k=0;k<Math.min(n,3);k++){const e=document.createElement('span');e.className='fly';e.style.background=col;document.body.appendChild(e);const mx=(sx+tx)/2+(k-1)*22,my=Math.min(sy,ty)-50;
      const a=e.animate([{transform:'translate('+sx+'px,'+sy+'px) scale(.6)'},{transform:'translate('+mx+'px,'+my+'px) scale(1.15)',offset:.45},{transform:'translate('+tx+'px,'+ty+'px) scale(.5)',opacity:.7}],{duration:650,delay:k*90,easing:'ease-in',fill:'both'});
      a.onfinish=()=>{e.remove();if(k===0)bumpEl(tgt);};setTimeout(()=>e.remove(),1500);}}catch(e){}}
function render(){
  const now=Date.now();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineJoin='round';ctx.lineCap='round';
  drawScene(ctx);
  if(layout){for(let i=0;i<layout.n;i++)drawPlot(ctx,i,now);drawRain(ctx);
    const{cols,cell,x0,y0}=layout;
    DROPS.forEach(d=>{if(!d.s){c2drop(ctx,d.x,d.y);}else{const k=(NOW-d.s)/.3;ctx.strokeStyle='rgba(190,225,255,'+(1-k)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(d.x,d.floor,3+k*7,1+k*2,0,0,Math.PI*2);ctx.stroke();}});
    fx.forEach(f=>{const col=f.i%cols,row=Math.floor(f.i/cols);const x=x0+col*cell+cell/2,y=y0+row*cell+cell*.35-f.t*34;ctx.globalAlpha=clamp(1.2-f.t*1.2,0,1);ctx.font='700 '+Math.round(cell*.14+4)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.strokeText(f.text,x,y);ctx.fillStyle=f.col;ctx.fillText(f.text,x,y);ctx.globalAlpha=1;});
  }
}
/* pointer */
let down=false,visited=null,holdT=0,holdI=-1,holdOn=false,holdXY=null;
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  down=true;visited=new Set();const p=pos(e),i=plotAt(p.x,p.y);
  if(tool===''){
    /* 預設模式：點一下照顧，按住約 0.45 秒看這塊田的狀態（按住時不會照顧） */
    clearTimeout(holdT);holdT=0;holdOn=false;holdI=i;holdXY=p;
    if(i>=0)holdT=setTimeout(()=>{holdT=0;holdOn=true;buzz(6);renderPlotCard(i);},450);
    return;
  }
  if(i>=0){visited.add(i);tapPlot(i);}
});
cv.addEventListener('pointermove',e=>{
  if(!down)return;const p=pos(e);
  if(tool===''){if(holdXY&&Math.hypot(p.x-holdXY.x,p.y-holdXY.y)>10){clearTimeout(holdT);holdT=0;holdI=-1;}return;}
  const i=plotAt(p.x,p.y);if(i>=0&&!visited.has(i)){visited.add(i);tapPlot(i);}
});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,()=>{
  if(tool===''){
    clearTimeout(holdT);holdT=0;
    if(n==='pointerup'&&holdI>=0&&!holdOn)tapPlot(holdI);
    holdI=-1;holdOn=false;
  }
  down=false;
}));

/* ---------- loop ---------- */
let last=performance.now(),acc=0,saveT=0;
function loop(t){
  const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;NOW+=dt;FDT=dt;
  for(let k=DROPS.length-1;k>=0;k--){const d=DROPS[k];if(!d.s){d.vy+=500*dt;d.y+=d.vy*dt;if(d.y>=d.floor)d.s=NOW;}else if(NOW-d.s>.3)DROPS.splice(k,1);}
  acc+=dt;if(acc>=1){acc=0;{const ty=typhoonCheck();if(ty){toast(typhoonText(ty));buzz([30,40,30]);}}sim(Date.now());genOrders();updateHud();if(!tool)renderSeedbar();refreshPlotCard();}
  saveT+=dt;if(saveT>10){saveT=0;save();}
  fx.forEach(f=>f.t+=dt);for(let i=fx.length-1;i>=0;i--)if(fx[i].t>1)fx.splice(i,1);
  if(W>0&&H>0)render();requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
function boot(){
  const first=!load();F=load()||newFarm();F.kit=F.kit||[];F.hen=F.hen||{t:Date.now(),fed:0,prog:0,eggs:0};F.pond=F.pond||{n:POND_MAX,t:Date.now()};
  if(F.hen.mood==null)F.hen.mood=70;F.vil=F.vil||{};F.dex=F.dex||{};F.auto=F.auto||{};F.wx=F.wx||{};autoLog={h:0,p:0};
  const away=Date.now()-F.last;const beforeReady=F.plots.slice(0,F.up.plots).filter(p=>p.c&&progress(p)>=1).length;
  const ty=typhoonCheck();sim(Date.now());genOrders();
  const afterReady=F.plots.slice(0,F.up.plots).filter(p=>p.c&&progress(p)>=1).length;
  const d=today();let bonus=0;if(F.daily!==d){F.daily=d;if(!first){bonus=15;addCoins(bonus);}}
  save();makeLayout();updateHud();resize();
  GCmax({level:level(),plots:F.up.plots});
  if(!first&&!F.kitHint){F.kitHint=1;save();setTimeout(()=>toast('新功能：下方的「加工」可以把作物做成果醬'),first?0:2600);}
  const news=!first&&!F.hint3;F.hint3=1;save();
  if(first){F.kitHint=1;/* 第一次的說明改由 gc.js 的新手教學顯示 */}
  const al={h:autoLog.h,p:autoLog.p};
  if(first){}else if(away>3*MIN||bonus||ty||news){setTimeout(()=>{const m=Math.round(away/MIN);const t=(m>=60?Math.floor(m/60)+' 小時 '+(m%60)+' 分鐘':m+' 分鐘');const w=weather(),tw=weather(tomorrow());
    sheet('<div class="shead"><h3>歡迎回來</h3></div><p class="soft">'+(away>3*MIN?'離開了 '+t+'。':'')+(al.h?'自動收成了 '+al.h+' 塊田'+(al.p?'，補種了 '+al.p+' 塊':'')+'。':afterReady>0?'有 '+afterReady+' 塊田的作物可以收成了。':'作物還在慢慢長大。')+
      '<br>今天'+WX[w].i+WX[w].n+(w==='rain'?'，不用澆水':'')+'。'+(ty?'<br><b>'+typhoonText(ty)+'</b>':'')+(tw==='typhoon'?'<br><b>明天有颱風，今天先收成比較保險。</b>':'')+(isMarket()?'<br>今天有週末市集，'+CROPS[hotCrop()].n+'特別搶手。':'')+(bonus?'<br>今日第一次來，送你 $'+bonus+'。':'')+'</p>'+
      (news?'<p class="soft"><b>小菜園更新</b>：上方多了天氣（點一下看明天）；週末有市集；村民有名字和喜歡的作物，訂單可以一鍵交貨；池塘有魚圖鑑；雞有心情；Lv6 起可以買自動收成和自動補種。</p>':'')+
      '<button class="btn main" type="button" data-close style="width:100%">去看看</button>');},300);}
  autoLog={h:0,p:0};
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&F){sim(Date.now());updateHud();}else save();});
boot();
})();
