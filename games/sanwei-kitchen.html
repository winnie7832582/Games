<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三味廚房：即時料理挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#cfe8dc; --tile-line:#b4d6c6; --ink:#16372e; --ink-soft:#4d6d63;
  --porcelain:#fffdf8; --tomato:#e8412c; --tomato-deep:#a92a19;
  --yolk:#ffc531; --yolk-deep:#c48700; --zone:#2f9e64; --veil:rgba(22,55,46,.38);
  --f-display:"Huninn","jf-openhuninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tile:#10241f; --tile-line:#1c3a32; --ink:#e9f5ef; --ink-soft:#9fc0b4;
    --porcelain:#1b322c; --tomato:#ff5a43; --tomato-deep:#b8341f;
    --yolk:#ffc531; --yolk-deep:#e0a419; --zone:#3fc07c; --veil:rgba(4,12,10,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --tile:#10241f; --tile-line:#1c3a32; --ink:#e9f5ef; --ink-soft:#9fc0b4;
  --porcelain:#1b322c; --tomato:#ff5a43; --tomato-deep:#b8341f;
  --yolk:#ffc531; --yolk-deep:#e0a419; --zone:#3fc07c; --veil:rgba(4,12,10,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:var(--f-body); color:var(--ink); background-color:var(--tile);
  background-image:linear-gradient(var(--tile-line) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--tile-line) 1.5px,transparent 1.5px);
  background-size:30px 30px; background-position:-1px -1px;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
.app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column}
.screen{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--yolk);outline-offset:3px}

/* home */
#home{overflow-y:auto;padding:0 18px 24px}
.sign{position:relative;margin:22px 0 14px;padding:26px 16px 20px;background:var(--tomato);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);text-align:center}
.sign::before{content:"";position:absolute;inset:7px;border:5px dotted #ffe38a;border-radius:15px;pointer-events:none;filter:drop-shadow(0 0 3px rgba(255,214,90,.9))}
.sign h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,15vw,66px);line-height:1.05;letter-spacing:.12em;margin-right:-.12em;color:var(--yolk);text-shadow:0 4px 0 var(--tomato-deep)}
.sign p{margin-top:8px;font-family:var(--f-display);font-size:17px;letter-spacing:.3em;margin-right:-.3em;color:#fff6dc}
.lead{font-size:15px;line-height:1.7;color:var(--ink-soft);margin:6px 2px 16px}
.list{display:flex;flex-direction:column;gap:14px}
.dish{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;padding:12px 16px 12px 12px;background:var(--porcelain);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);text-align:left;width:100%}
.dish:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.dish canvas{width:86px;height:86px;display:block}
.dish h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15}
.dish .meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.dish .best{text-align:right;font-size:12px;color:var(--ink-soft);line-height:1.5}
.stars{color:var(--yolk-deep);font-size:16px;letter-spacing:1px}
.stars .off{color:var(--tile-line)}
.homefoot{display:flex;justify-content:center;margin-top:20px}
.textbtn{background:none;border:none;font-size:14px;color:var(--ink-soft);padding:8px 12px;text-decoration:underline;text-underline-offset:4px}

/* game */
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.iconbtn{flex:none;width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--porcelain);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:20px;height:20px}
.dishname{flex:1;font-family:var(--f-display);font-size:21px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink)}
.dot.done{background:var(--ink)}
.dot.now{background:var(--yolk)}
.hint{margin:4px 16px 0;font-size:14px;line-height:1.5;min-height:21px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--ink);font-weight:700;margin-right:8px}
.stage{position:relative;flex:1 1 auto;min-height:210px;margin:6px 14px 8px;border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 4px 0 var(--ink);background:var(--tile)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--veil)}
.overlay.hide{display:none}
.card{background:var(--porcelain);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:18px 18px 16px;width:100%;max-width:340px}
.card .stepno{font-size:13px;color:var(--ink-soft)}
.card h3{font-family:var(--f-display);font-weight:400;font-size:30px;margin:2px 0 8px}
.card p{font-size:15px;line-height:1.7;margin-bottom:16px}
.card .btn{width:100%}
.judge{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;font-family:var(--f-display);white-space:nowrap}
.judge .big{display:block;font-size:46px;line-height:1.1;color:var(--yolk);text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 6px 0 var(--ink)}
.judge .sub{display:inline-block;margin-top:8px;font-size:17px;padding:4px 12px;border-radius:999px;background:var(--porcelain);border:2px solid var(--ink)}
.judge[data-k="good"] .big{color:#5fd897}
.judge[data-k="ok"] .big{color:#fffdf8}
.judge[data-k="bad"] .big{color:var(--tomato)}
.judge.show{animation:pop 1.5s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}24%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.hud{display:flex;flex-direction:column;gap:7px;padding:2px 18px 4px}
.mtop{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:3px}
.mtop .mright{font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{position:relative;height:16px;border:2px solid var(--ink);border-radius:10px;background:var(--porcelain);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--yolk)}
.zone{position:absolute;top:0;bottom:0;background:var(--zone);opacity:.45;border-left:2px solid var(--zone);border-right:2px solid var(--zone)}
.meter[data-state="in"] .zone{opacity:.9}
.meter[data-state="warn"] .fill{background:var(--tomato)}
.needle{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2.5px;background:var(--ink);border-radius:3px;display:none}
.controls{display:flex;gap:10px;padding:6px 14px 14px;min-height:96px;align-items:stretch}
.controls.locked{opacity:.4;pointer-events:none}
.btn{flex:1;font-family:var(--f-display);font-size:22px;border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);background:var(--porcelain);padding:10px 14px;min-height:60px}
.btn.primary{background:var(--tomato);color:#fff}
.btn.big{min-height:72px;font-size:27px}
.btn.pressed,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.hold.pressed{background:var(--tomato-deep)}
.note{flex:1;display:grid;place-items:center;font-size:15px;color:var(--ink-soft);border:2.5px dashed var(--tile-line);border-radius:18px;text-align:center;padding:8px}
.pickgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{font-family:var(--f-body);font-size:13px;font-weight:700;border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);background:var(--porcelain);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:4px 2px}
.pick .em{font-size:27px;line-height:1.1}
.pick.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pick.got{background:var(--zone);color:#fff;transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pick.wrong{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* result */
#result{overflow-y:auto}
.rwrap{padding:12px 18px 26px;display:flex;flex-direction:column;align-items:center}
.rcanvas{width:min(80vw,300px);height:min(80vw,300px);display:block}
.rhead{text-align:center;margin-top:2px}
.rstars{font-size:34px;letter-spacing:4px;color:var(--yolk-deep);margin-right:-4px}
.rstars .off{color:var(--tile-line)}
.rtitle{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.15}
.rscore{font-size:16px;color:var(--ink-soft);margin-top:2px}
.rscore b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--ink);margin-right:2px}
.newbest{display:inline-block;margin-left:8px;font-size:13px;font-weight:700;color:#fff;background:var(--tomato);border-radius:999px;padding:2px 10px;vertical-align:4px}
.rcomment{font-size:15px;line-height:1.7;text-align:center;max-width:30em;margin:10px 0 14px}
.rsteps{list-style:none;width:100%;background:var(--porcelain);border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--ink)}
.rsteps li{display:grid;grid-template-columns:5.5em 1fr 2.4em;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.rsteps li+li{border-top:1.5px dashed var(--tile-line)}
.rsteps .sb{height:10px;border-radius:6px;background:var(--tile);overflow:hidden}
.rsteps .sb i{display:block;height:100%;background:var(--yolk);border-radius:6px}
.rsteps .sv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rbtns{display:flex;gap:12px;width:100%;margin-top:18px}
@media (prefers-reduced-motion: reduce){
  .judge.show{animation:fade 1.5s linear forwards}
  @keyframes fade{0%,85%{opacity:1}100%{opacity:0}}
  .pick.wrong{animation:none;outline:3px solid var(--tomato)}
}
</style>
<script src="../gc.js"></script>
</head>
<body>
<div class="app">
  <section id="home" class="screen on" aria-label="選擇料理">
    <div class="sign"><h1>三味廚房</h1><p>即時料理挑戰</p></div>
    <p class="lead">挑一道菜，跟著每一步即時操作。按的時機、畫圈的力道、火候的拿捏，都會反映在最後端上桌的樣子。</p>
    <div class="list" id="dishList"></div>
    <div class="homefoot"><button class="textbtn" id="sndHome">音效：開</button></div>
  </section>

  <section id="game" class="screen" aria-label="料理中">
    <div class="bar">
      <button class="iconbtn" id="backBtn" aria-label="回到菜單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="dishname" id="dishName"></div>
      <div class="dots" id="dots"></div>
      <button class="iconbtn" id="sndBtn" aria-label="切換音效"></button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="stage" id="stage">
      <canvas id="stageCv"></canvas>
      <div class="judge" id="judge"></div>
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="stepno" id="ovNo"></div>
          <h3 id="ovTitle"></h3>
          <p id="ovHint"></p>
          <button class="btn primary big" id="ovGo">開始</button>
        </div>
      </div>
    </div>
    <div class="hud" id="hud"></div>
    <div class="controls" id="controls"></div>
  </section>

  <section id="result" class="screen" aria-label="成品">
    <div class="rwrap">
      <canvas id="resCv" class="rcanvas"></canvas>
      <div class="rhead">
        <div class="rstars" id="rStars"></div>
        <h2 class="rtitle" id="rTitle"></h2>
        <div class="rscore"><b id="rScore"></b>分<span class="newbest" id="rBest" hidden>新紀錄</span></div>
      </div>
      <p class="rcomment" id="rComment"></p>
      <ol class="rsteps" id="rSteps"></ol>
      <div class="rbtns">
        <button class="btn" id="rHome">換一道菜</button>
        <button class="btn primary" id="rAgain">再做一次</button>
      </div>
    </div>
  </section>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const $ = s => document.querySelector(s);
const RND = []; { let s = 11; for (let i = 0; i < 800; i++) { s = (s * 16807) % 2147483647; RND.push((s - 1) / 2147483646); } }
const rnd = i => RND[((i % 800) + 800) % 800];
const FONT_D = '"Huninn","Noto Sans TC","PingFang TC",sans-serif';
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(c1, c2, t, a) { const x = hex2rgb(c1), y = hex2rgb(c2); t = clamp(t, 0, 1); const r = [0, 1, 2].map(i => Math.round(lerp(x[i], y[i], t))); return a == null ? `rgb(${r})` : `rgba(${r},${a})`; }
function ramp(stops, v) { v = clamp(v, stops[0][0], stops[stops.length - 1][0]); for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) { const [p0, c0] = stops[i - 1], [p1, c1] = stops[i]; return mix(c0, c1, (v - p0) / ((p1 - p0) || 1)); } return stops[stops.length - 1][1]; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sec = t => Math.max(0, t).toFixed(1) + ' 秒';

/* ---------- palette ---------- */
const P = {};
function readPalette() {
  const cs = getComputedStyle(document.documentElement);
  ['tile', 'tile-line', 'ink', 'ink-soft', 'porcelain', 'tomato', 'yolk', 'zone'].forEach(k => P[k] = cs.getPropertyValue('--' + k).trim());
  const th = document.documentElement.dataset.theme;
  P.dark = th === 'dark' || (th !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
}

/* ---------- sound ---------- */
const Snd = {
  on: true, ac: null, sz: null,
  ctx() { if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); } if (this.ac.state === 'suspended') this.ac.resume(); return this.ac; },
  tone(f, d, type, v, slide) {
    if (!this.on) return; try {
      const c = this.ctx(); if (!c) return; const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
      g.gain.setValueAtTime(v || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .03);
    } catch (e) { }
  },
  play(n) {
    const seq = (fs, gap, d, ty, v) => fs.forEach((f, i) => setTimeout(() => this.tone(f, d, ty, v), i * gap));
    switch (n) {
      case 'tap': this.tone(520 + Math.random() * 60, .05, 'triangle', .1); break;
      case 'whisk': this.tone(900 + Math.random() * 300, .025, 'square', .02); break;
      case 'pick': this.tone(740, .07, 'square', .05); break;
      case 'perfect': seq([660, 880, 1175], 70, .14, 'triangle', .13); break;
      case 'good': seq([660, 880], 80, .12, 'triangle', .12); break;
      case 'ok': this.tone(520, .14, 'triangle', .1); break;
      case 'bad': this.tone(220, .28, 'sawtooth', .06, .55); break;
      case 'start': seq([523, 659, 784], 60, .1, 'triangle', .1); break;
      case 'fanfare': seq([523, 659, 784, 1047, 784, 1047], 110, .22, 'triangle', .12); break;
    }
  },
  sizzle(level) {
    try {
      if (!this.on || level <= 0) { if (this.sz) this.sz.g.gain.setTargetAtTime(0, this.ac.currentTime, .05); return; }
      const c = this.ctx(); if (!c) return;
      if (!this.sz) {
        const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < .03 ? 1 : .35);
        const s = c.createBufferSource(); s.buffer = b; s.loop = true;
        const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2400;
        const g = c.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(c.destination); s.start(); this.sz = { s, g };
      }
      this.sz.g.gain.setTargetAtTime(level * .05, c.currentTime, .06);
    } catch (e) { }
  }
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };

/* ---------- canvas primitives ---------- */
let ctx = null, W = 0, H = 0;
function bindCanvas(cv, w, h) {
  const dpr = Math.min(2.5, window.devicePixelRatio || 1), pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); W = w; H = h;
}
function circ(x, y, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw || 1; ctx.strokeStyle = stroke; ctx.stroke(); } }
function ell(x, y, rx, ry, rot, fill, stroke, lw) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw || 1; ctx.strokeStyle = stroke; ctx.stroke(); } }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw || 1; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function blobPath(x, y, r, k, si, n, sy) {
  n = n || 12; sy = sy || 1; const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU, q = r * (1 + k * (rnd(si + i) * 2 - 1)); pts.push([x + Math.cos(a) * q, y + Math.sin(a) * q * sy]); }
  const m = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  ctx.beginPath(); const s = m(pts[n - 1], pts[0]); ctx.moveTo(s[0], s[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = m(p, pts[(i + 1) % n]); ctx.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
  ctx.closePath();
}

  ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(20,60,45,.25)'; ctx.shadowBlur = 4;
  for (let i = 0; i < 3; i++) { const ph = (t * .45 + i / 3) % 1, x = W / 2 + (i - 1) * W * .12, y = topY - ph * H * .22; ctx.strokeStyle = `rgba(255,255,255,${Math.sin(ph * Math.PI) * .55})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, y + 26); ctx.bezierCurveTo(x - 10, y + 14, x + 10, y + 8, x, y - 4); ctx.stroke(); }
  ctx.shadowBlur = 0;
}

/* ---------- input ---------- */
function canvasPt(e) { const r = stageCv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
stageCv.addEventListener('pointerdown', e => {
  if (!S || !S.running) return; e.preventDefault(); try { stageCv.setPointerCapture(e.pointerId); } catch (_) { }
  const p = canvasPt(e); S.down = true; S.ptr = p; S.impl.pdown && S.impl.pdown(S, p.x, p.y);
});
stageCv.addEventListener('pointermove', e => {
  if (!S || !S.running || !S.down) return; e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) { const p = canvasPt(ev); S.ptr = p; S.impl.pmove && S.impl.pmove(S, p.x, p.y); if (!S.running) break; }
});
const canvasUp = () => { if (!S) return; S.down = false; S.ptr = null; S.impl.pup && S.impl.pup(S); };
stageCv.addEventListener('pointerup', canvasUp); stageCv.addEventListener('pointercancel', canvasUp);
stageCv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (curScreen !== 'game' || e.repeat || !S) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (!overlayEl.classList.contains('hide')) { startPlay(); return; }
    if (S.running && S.primary) { S.primary.el.classList.add('pressed'); S.primary.down && S.primary.down(); }
  }
});
addEventListener('keyup', e => {
  if (curScreen !== 'game' || !S || !(e.code === 'Space' || e.code === 'Enter')) return;
  if (S.primary && S.primary.el.classList.contains('pressed')) { S.primary.el.classList.remove('pressed'); S.primary.up && S.primary.up(); }
});

/* ---------- UI wiring ---------- */
$('#ovGo').addEventListener('click', startPlay);
$('#backBtn').addEventListener('click', () => { G = null; S = null; Snd.sizzle(0); renderHome(); show('home'); });
$('#rAgain').addEventListener('click', () => startDish(RS.id));
$('#rHome').addEventListener('click', () => { renderHome(); show('home'); });
const SPK_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function syncSound() { $('#sndBtn').innerHTML = Snd.on ? SPK_ON : SPK_OFF; $('#sndBtn').setAttribute('aria-pressed', String(!Snd.on)); $('#sndHome').textContent = '音效：' + (Snd.on ? '開' : '關'); }
function toggleSound() { Snd.on = !Snd.on; if (!Snd.on) Snd.sizzle(0); else Snd.play('tap'); syncSound(); try { GCStore.setItem('sanwei-sound', Snd.on ? '1' : '0'); } catch (e) { } }
$('#sndBtn').addEventListener('click', toggleSound); $('#sndHome').addEventListener('click', toggleSound);
try { if (GCStore.getItem('sanwei-sound') === '0') Snd.on = false; } catch (e) { }

function renderHome() {
  const best = loadBest(), list = $('#dishList'); list.innerHTML = '';
  for (const id of Object.keys(DISHES)) {
    const d = DISHES[id], b = best[id], base = id.replace('+', ''), locked = d.pro && !(best[base] && best[base].stars >= 3), btn = document.createElement('button'); btn.type = 'button'; btn.className = 'dish'; if (locked) { btn.disabled = true; btn.style.opacity = '.55'; }
    btn.innerHTML = `<canvas width="86" height="86" aria-hidden="true"></canvas><div><h2></h2><div class="meta"></div></div><div class="best"></div>`;
    btn.querySelector('h2').textContent = d.name; btn.querySelector('.meta').textContent = `${d.tag}，${d.steps.length} 個步驟`;
    btn.querySelector('.best').innerHTML = locked ? '普通版<br>拿到三顆星解鎖' : b ? `<div class="stars">${starsHTML(b.stars)}</div>最佳 ${b.score} 分` : '還沒做過';
    btn.addEventListener('click', () => startDish(id)); list.appendChild(btn);
    const cv = btn.querySelector('canvas'); bindCanvas(cv, 86, 86); drawDish(id, 43, 43, 84, PERFECT_Q[base]);
  }
}

/* ---------- pro variants & daily conditions ---------- */
function resize_(d, kw, tw, ts) {
  const c = JSON.parse(JSON.stringify(d));
  c.steps.forEach(st => {
    if (st.zone) { const m = (st.zone[0] + st.zone[1]) / 2, w = (st.zone[1] - st.zone[0]) * kw; st.zone = [m - w / 2, m + w / 2]; }
    if (st.speed) st.speed *= ts; if (st.time) st.time = Math.max(4, Math.round(st.time * tw));
  });
  return c;
}
const BASE_IDS = ['souffle', 'omurice', 'oajian', 'friedrice'];
BASE_IDS.forEach(id => { const c = resize_(DISHES[id], .72, .85, 1.2); c.name = DISHES[id].name + '・職人版'; c.tag = '高難度'; c.pro = true; DISHES[id + '+'] = c; });
const CONDS = [
  { id: 'ok', n: '一切正常', d: '今天廚房狀況很好。', w: 3, kw: 1, tw: 1, ts: 1 },
  { id: 'rush', n: '客人很趕時間', d: '限時的步驟時間縮短。', w: 2, kw: 1, tw: .85, ts: 1 },
  { id: 'slip', n: '手有點滑', d: '綠區變窄，要抓得更準。', w: 2, kw: .85, tw: 1, ts: 1 },
  { id: 'fire', n: '瓦斯爐火力很大', d: '指針變快，綠區也變窄。', w: 1, kw: .9, tw: 1, ts: 1.12 },
  { id: 'kind', n: '客人很好說話', d: '綠區變寬，比較好得分。', w: 2, kw: 1.15, tw: 1, ts: 1 }
];
let COND = CONDS[0];
function rollCond() { const t = CONDS.reduce((a, c) => a + c.w, 0); let r = Math.random() * t; for (const c of CONDS) { r -= c.w; if (r <= 0) return c; } return CONDS[0]; }

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try {
    if (curScreen === 'game' && S && stageW > 0) {
      if (S.running) S.impl.update(S, dt);
      if (S) { S.at += dt; bindCanvas(stageCv, stageW, stageH); stageBG(); SC[S.step.scene](S, dt); drawPops(dt); }
    } else if (curScreen === 'result' && RS) { RS.t += dt; drawResult(dt); }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
readPalette(); syncSound(); renderHome();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readPalette(); if (curScreen === 'home') renderHome(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (curScreen === 'home') renderHome(); });
requestAnimationFrame(frame);
</script>
