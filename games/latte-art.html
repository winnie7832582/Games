<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拉一杯花</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#20262B; --soft:#66707A; --line:#DADFD8; --track:#E1E5DF;
  --accent:#2F6FDB; --gold:#D99A1E; --good:#2E8B57; --bad:#C2453B; --on-accent:#FFFFFF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121519; --surface:#1C2127; --ink:#EEF1F4; --soft:#9AA5B1; --line:#2A3139; --track:#2A3139;
    --accent:#7AA7FF; --gold:#F2C14E; --good:#6CC793; --bad:#F07A6E; --on-accent:#121519;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121519; --surface:#1C2127; --ink:#EEF1F4; --soft:#9AA5B1; --line:#2A3139; --track:#2A3139;
  --accent:#7AA7FF; --gold:#F2C14E; --good:#6CC793; --bad:#F07A6E; --on-accent:#121519;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px}
.btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:13px 18px;font-weight:700;font-size:1.05rem;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .05s,background-color .1s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.hold{touch-action:none}
.btn.held{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn:focus-visible,.lv:focus-visible,.thumb:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.back{border:0;background:transparent;font-weight:700;padding:8px 4px;cursor:pointer;color:var(--soft)}
#p-guide[aria-pressed="true"]{color:var(--accent)}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px}
.top h2{margin:0;font-size:1.15rem;font-weight:700;flex:1;min-width:0}

/* title */
#title{align-items:center;justify-content:center;text-align:center;padding:10px 24px 24px}
.hero{display:block;width:min(70vw,280px);aspect-ratio:1}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:clamp(2.8rem,14vw,4rem);margin:6px 0 8px;letter-spacing:.1em;line-height:1.1}
.lede{color:var(--soft);line-height:1.8;margin:0 0 20px;max-width:19em;text-wrap:balance}
.menu{display:flex;flex-direction:column;gap:10px;width:min(290px,100%)}
.tot{margin:14px 0 0;color:var(--soft);min-height:1.5em}

/* levels */
.lv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.lv:disabled{opacity:.5;cursor:default}
.lv canvas{width:56px;height:56px;flex:none}
.lv .tx{flex:1;min-width:0}
.lv b{display:block;font-size:1.08rem}
.lv span{display:block;color:var(--soft);font-size:.88rem;line-height:1.5}
.lv .st{flex:none;color:var(--gold);font-size:1.1rem;letter-spacing:1px}
.lv .st.dim{color:var(--line)}

/* play */
.board{position:relative;flex:1;min-height:240px;margin:2px 12px 6px}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.coach{min-height:1.6em;text-align:center;margin:0 16px;font-weight:700;color:var(--accent)}
.toast{position:absolute;left:50%;top:6px;transform:translate(-50%,-6px);opacity:0;padding:6px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:.95rem;white-space:nowrap;pointer-events:none;transition:opacity .15s,transform .15s;z-index:2}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tipcard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,18,22,.35);z-index:3}
.tipcard[hidden]{display:none}
.tipcard .c{background:var(--surface);border-radius:20px;padding:18px;max-width:340px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.tipcard h3{margin:0 0 4px;font-size:1.35rem}
.tipcard .k{margin:0;color:var(--soft);font-size:.88rem}
.tipcard p.t{line-height:1.75;margin:8px 0 16px;text-wrap:pretty}
.tipcard canvas{display:block;width:96px;height:96px;margin:6px auto 4px}
.tipcard .btn{width:100%}
.ctl{display:flex;gap:10px;padding:8px 12px 14px}
.ctl .btn{flex:1;min-width:0}
.ctl .btn.sm{flex:none;padding:13px 16px}

/* result */
.sheet{background:var(--surface);border-radius:24px;padding:18px 18px 20px}
.rtitle{text-align:center;margin:0;color:var(--soft);font-size:.92rem}
.rcanvas{display:block;width:100%;max-width:340px;aspect-ratio:1;margin:4px auto 0}
.score{text-align:center;margin:0}
.score b{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.score span{margin-left:4px}
.stars{text-align:center;color:var(--gold);font-size:1.6rem;letter-spacing:4px;margin:2px 0 4px}
.stars .off{color:var(--line)}
.newb{text-align:center;color:var(--good);font-weight:700;min-height:1.5em;margin:0 0 8px}
.bk{margin:6px 0 12px}
.bk div{display:grid;grid-template-columns:3.6em 1fr 2.4em;align-items:center;gap:10px;padding:5px 0;font-size:.95rem}
.bk i{display:block;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bk i s{display:block;height:100%;border-radius:4px;text-decoration:none}
.bk b{text-align:right;font-variant-numeric:tabular-nums}
.note{background:var(--bg);border-radius:14px;padding:12px 14px;line-height:1.7;margin:0 0 14px}
.racts{display:flex;flex-direction:column;gap:10px}
.racts .row{display:flex;gap:10px}
.racts .row .btn{flex:1}

/* gallery */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sml{margin:6px 0 12px}
.sml div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sml div b{font-variant-numeric:tabular-nums}
.thumb{position:relative;border:0;padding:0;background:transparent;cursor:pointer;text-align:center}
.thumb img{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:var(--surface)}
.thumb span{display:block;font-size:.8rem;color:var(--soft);margin-top:4px}
.empty{color:var(--soft);text-align:center;line-height:1.8;margin:40px 10px}
.viewer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,12,15,.75);z-index:5}
.viewer[hidden]{display:none}
.viewer .c{background:var(--surface);border-radius:22px;padding:16px;max-width:360px;width:100%;text-align:center}
.viewer img{width:100%;border-radius:50%}
.viewer p{margin:8px 0 12px;color:var(--soft)}
.viewer .row{display:flex;gap:10px}.viewer .row .btn{flex:1}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){.btn,.toast{transition:none}}
</style>
<script src="../gc.js"></script>
</head>
<body>
<div class="app" style="position:relative">

  <section class="screen on" id="title" aria-labelledby="t-h">
    <canvas class="hero" id="hero" aria-hidden="true"></canvas>
    <h1 id="t-h">拉一杯花</h1>
    <p class="lede">從一個圓開始，練到愛心、鬱金香和葉子。手指就是你的拉花杯。</p>
    <div class="menu">
      <button class="btn main" id="m-levels" type="button">拉花課程</button>
      <button class="btn" id="m-order" type="button">客人指定</button>
      <button class="btn" id="m-timed" type="button">限時挑戰</button>
      <button class="btn" id="m-free" type="button">自由創作</button>
      <button class="btn" id="m-gal" type="button">作品集</button>
    </div>
    <p class="tot" id="tot"></p>
  </section>

  <section class="screen" id="levels" aria-label="拉花課程">
    <div class="top"><button class="back" id="lv-back" type="button">‹ 返回</button><h2>拉花課程</h2></div>
    <div class="scroll" id="lv-list"></div>
  </section>

  <section class="screen" id="play" aria-label="拉花">
    <div class="top"><button class="back" id="p-back" type="button">‹ 返回</button><h2 id="p-name"></h2><button class="back" id="p-guide" type="button" aria-pressed="true">輔助線</button><button class="back" id="p-tip" type="button">技巧</button></div>
    <p class="coach" id="coach" aria-live="polite"></p>
    <div class="board" id="board">
      <canvas id="cv" aria-label="咖啡杯，按住杯面拉花"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="tipcard" id="tipcard" hidden><div class="c"><p class="k" id="tc-k"></p><h3 id="tc-h"></h3><canvas id="tc-cv" aria-hidden="true"></canvas><p class="t" id="tc-t"></p><button class="btn main" id="tc-go" type="button">開始</button></div></div>
    </div>
    <div class="ctl">
      <button class="btn sm" id="b-reset" type="button" aria-label="重新倒一杯">重來</button>
      <button class="btn hold" id="b-high" type="button" aria-label="按住高處注入">高處注入</button>
      <button class="btn main" id="b-done" type="button">完成</button>
    </div>
  </section>

  <section class="screen" id="result" aria-label="成果">
    <div class="scroll"><div class="sheet">
      <p class="rtitle" id="r-title"></p>
      <canvas class="rcanvas" id="r-cv" aria-label="你的拉花"></canvas>
      <p class="score"><b id="r-score">0</b><span>分</span></p>
      <div class="stars" id="r-stars"></div>
      <p class="newb" id="r-new"></p>
      <div class="bk" id="r-bk"></div>
      <p class="note" id="r-note"></p>
      <div class="racts">
        <button class="btn main" id="r-next" type="button">下一課</button>
        <div class="row"><button class="btn" id="r-again" type="button">再拉一杯</button><button class="btn" id="r-save" type="button">存到作品集</button></div>
        <button class="back" id="r-menu" type="button">回到課程</button>
      </div>
    </div></div>
  </section>

  <section class="screen" id="summary" aria-label="總結">
    <div class="scroll"><div class="sheet">
      <p class="rtitle" id="sm-k"></p>
      <p class="score"><b id="sm-n">0</b><span id="sm-u">分</span></p>
      <div class="stars" id="sm-s"></div>
      <p class="newb" id="sm-new"></p>
      <div id="sm-list"></div>
      <p class="note" id="sm-note"></p>
      <div class="racts"><button class="btn main" id="sm-again" type="button">再來一次</button><button class="back" id="sm-menu" type="button">回到首頁</button></div>
    </div></div>
  </section>

  <section class="screen" id="gallery" aria-label="作品集">
    <div class="top"><button class="back" id="g-back" type="button">‹ 返回</button><h2>作品集</h2></div>
    <div class="scroll"><div class="grid" id="g-grid"></div></div>
  </section>

  <div class="viewer" id="viewer" hidden><div class="c"><img id="v-img" alt=""><p id="v-cap"></p><div class="row"><button class="btn" id="v-del" type="button">刪除</button><button class="btn main" id="v-close" type="button">關閉</button></div></div></div>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hex(h){h=String(h).trim();const m=h.match(/^rgba?\(([^)]+)\)/);if(m){const q=m[1].split(',').map(Number);return[q[0]||0,q[1]||0,q[2]||0];}h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(a,b,t){const A=hex(a),B=hex(b);t=clamp(t,0,1);return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const OUT='#20262B',GLAZE=(window.GC&&GC.val&&GC.val('glaze'))||'#2B5FB8',FOAM='#F7EEE0',CREMA='#A0612F';
const CX=50,CY=50;

/* ---------- patterns ---------- */
const ART={
  circ(u,v){return u*u+v*v<=1;},
  heart(u,v){const a=u*u+v*v-1;return a*a*a-u*u*v*v*v<=0;},
  tulip(u,v){
    if(u*u+(v-.5)*(v-.5)<=.36)return true;
    if(u*u+(v+.02)*(v+.02)<=.25)return true;
    if(u*u+(v+.45)*(v+.45)<=.15)return true;
    if(v<-.6&&v>-1.1&&Math.abs(u)<.13*(v+1.1)/.5)return true;
    return false;},
  tulip5(u,v){
    const L=[[.72,.42],[.34,.4],[-.02,.36],[-.35,.32],[-.64,.27]];
    for(const[c,r]of L)if(u*u+(v-c)*(v-c)<=r*r)return true;
    if(v<-.85&&v>-1.18&&Math.abs(u)<.11*(v+1.18)/.33)return true;
    return false;},
  leaf(u,v){const t=(v-.05)/1.3;if(Math.abs(t)>=1)return false;return Math.abs(u)<.6*Math.pow(1-t*t,.85);},
  swan(u,v){
    if(((u+.1)/.8)*((u+.1)/.8)+((v+.5)/.46)*((v+.5)/.46)<=1)return true;
    if(v>-.3&&v<.85){const t=(v+.3)/1.15,uc=.2+.45*t*t,w=.2-.07*t;if(Math.abs(u-uc)<w)return true;}
    if((u-.7)*(u-.7)+(v-.92)*(v-.92)<=.04)return true;
    if(v>.84&&v<1&&u>.85&&u<1.1&&Math.abs(v-.92)<(1.1-u)*.5)return true;
    if(u<-.78&&u>-1.15&&v>-.62&&v<-.3+(u+.78)*-.6)return true;
    return false;},
  rose(u,v){return u*u+v*v<=1.05;},
  leafheart(u,v){
    const hu=u/.62,hv=(v-.52)/.62,a=hu*hu+hv*hv-1;if(a*a*a-hu*hu*hv*hv*hv<=0)return true;
    const t=(v+.5)/.75;if(Math.abs(t)<1&&Math.abs(u)<.5*Math.pow(1-t*t,.85))return true;return false;},
  ref(u,v){return u*u+(v-.1)*(v-.1)<=1.2;}
};
const ROTS={swan:1,rose:1,leafheart:1};
const LEVELS=[
  {id:'dot',name:'圓形',pat:'circ',sub:'第一課，學會讓奶泡浮起來',tip:'先按住「高處注入」，把杯子倒到一半，這時奶會沉下去。接著手指按在杯子正中間不動，白色的圓會慢慢長大，大小適中就放手。'},
  {id:'heart',name:'愛心',pat:'heart',sub:'推出圓，再一劃穿過',tip:'一樣先注入到一半。在中間推出一個圓，圓夠大的時候，從圓的上方外面開始，快速往下一劃穿過它，下方就會拉出愛心的尖角。'},
  {id:'tulip',name:'三層鬱金香',pat:'tulip',layers:3,sub:'在一條線上推三團',tip:'在一直線上推三團奶泡：先在上方推一團，放手；往下一點再推一團，再一團。每推一團都會把前一團往上擠成彎月。最後從最上方快速往下一劃，穿過三團。'},
  {id:'leaf',name:'葉子',pat:'leaf',wiggles:8,sub:'左右擺動，一邊往後退',tip:'先在上方推一小團，接著手指左右小幅度快速擺動，一邊慢慢往下退，畫出一層層的葉片。退到杯緣附近，再快速往上一劃穿回去。'},
  {id:'tulip5',name:'五層鬱金香',pat:'tulip5',layers:5,sub:'進階：五團要越推越小',tip:'跟三層鬱金香一樣由上往下推，但要推出五團。每團都要小一點、靠得近一點，不然杯子會太早滿。'},
  {id:'swan',name:'天鵝',pat:'swan',sub:'推出身體，再拉出彎彎的脖子',tip:'先在偏左下推出一團橢圓當身體。接著從身體右上方的邊緣出發，快速往上再往右上方畫一道彎弧線，把奶泡拉成細細的脖子。脖子要比身體窄很多，往右彎；天鵝朝左也可以，左右都算對。'},
  {id:'rose',name:'玫瑰',pat:'rose',layers:4,sub:'同一個位置，一層一層推',tip:'在杯子正中間按住推出一小團，放手；在同一個位置再按一次，圓會把前一圈往外擠。至少重複四次，就會得到一圈一圈的玫瑰花紋。每一次都要放手再按。'},
  {id:'leafheart',name:'葉子加愛心',pat:'leafheart',wiggles:6,sub:'下方是葉子，上方收成愛心',tip:'先在偏上方推一小團，左右小幅度快速擺動，邊擺邊往下退，做出下半部的葉片。再在葉子上方補一個圓，最後從最上方快速往下一劃穿過，頂端就會成為愛心。'}
];

/* ---------- pour engine ---------- */
function gsfx(n){try{window.GC&&GC.sfx(n);}catch(e){}}
class Pour{
  constructor(tq){this.tq=tq==null?1:tq;this.parts=[];this.emit=0;this.layer=0;this.fill=0;this.t=0;this.pours=0;this.pourT=0;this.cut=false;this.cutLen=0;this.wiggles=0;this.revT=[];this.dir=null;
    this.px=CX;this.py=CY;this.tx=CX;this.ty=CY;this.ux=0;this.uy=0;this.active=false;this.pouring=false;this.high=false;this.fresh=false;this.done=false;this.mode='';this.pulled=false;}
  surfR(){return lerp(21,32.5,clamp(this.fill/100,0,1));}
  vis(){let n=0;for(const p of this.parts)if(p.a>.6)n++;return n;}
  down(x,y){if(this.done)return;this.active=true;this.fresh=true;this.px=this.tx=x;this.py=this.ty=y;this.ux=this.uy=0;this.layer++;this.pourT=0;this.cutLen=0;this.dir=null;}
  move(x,y){this.tx=x;this.ty=y;}
  up(){if(this.active&&this.pourT>.35)this.pours++;this.active=false;}
  step(dt){
    this.t+=dt;
    let vx=0,vy=0;
    if(this.active){if(this.fresh){this.fresh=false;}else{vx=(this.tx-this.px)/dt;vy=(this.ty-this.py)/dt;}this.px=this.tx;this.py=this.ty;}
    this.ux+=(vx-this.ux)*Math.min(1,dt*14);this.uy+=(vy-this.uy)*Math.min(1,dt*14);
    if(this.done){this.pouring=false;return;}
    const rs=this.surfR(),inCup=Math.hypot(this.px-CX,this.py-CY)<rs;
    this.tooEarly=this.active&&inCup&&this.fill<20;const pouring=this.active&&inCup&&!this.tooEarly;this.pouring=pouring;
    if(this.high&&!pouring){if(this.fill<52)this.fill+=22*dt;else if(!this.halfDone){this.halfDone=true;if(this.onHalf)this.onHalf();}}
    const sp=Math.hypot(this.ux,this.uy);

  }
}

      c.beginPath();for(const p of arr){c.moveTo(p.x+p.r,p.y);c.arc(p.x,p.y,p.r,0,Math.PI*2);}c.fillStyle=FOAM;c.fill();});

const TGT={};

function fit(canvas,vw,vh){const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2.5);const w=Math.max(1,r.width),h=Math.max(1,r.height),pw=Math.round(w*dpr),ph=Math.round(h*dpr);

/* ---------- scoring ---------- */
function grid(parts){
  const N=44,size=70,cell=size/N,x0=CX-size/2,y0=CY-size/2,den=new Float32Array(N*N);
  for(const p of parts){if(p.thin)continue;const i=Math.floor((p.x-x0)/cell),j=Math.floor((p.y-y0)/cell);
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){const ii=i+di,jj=j+dj;if(ii<0||jj<0||ii>=N||jj>=N)continue;den[jj*N+ii]+=(di||dj?.35:1)*p.a;}}

  return{N,cell,x0,y0,cov,n,cx:n?sx/n:CX,cy:n?sy/n:CY};

function fitShape(G,pat){

  for(const mir of (pat==='swan'?[0,1]:[0]))for(const sc of [.6,.75,.9,1.05,1.2,1.35])for(let rot=0;rot<(ROTS[pat]||4);rot++){if(pat==='circ'&&rot)continue;for(let ox=-6;ox<=6;ox+=3)for(let oy=-6;oy<=6;oy+=3){
    const s=15*sc;let inter=0,uni=0;
    for(let j=0;j<G.N;j++){const y=G.y0+(j+.5)*G.cell-CY-oy;for(let i=0;i<G.N;i++){const x=G.x0+(i+.5)*G.cell-CX-ox;let u=x/s,v=-y/s;if(mir)u=-u;
      if(rot===1){const t=u;u=v;v=-t;}else if(rot===2){u=-u;v=-v;}else if(rot===3){const t=u;u=-v;v=t;}
      const m=f(u,v),cv=G.cov[j*G.N+i];if(m&&cv)inter++;if(m||cv)uni++;}}
    const iou=uni?inter/uni:0;if(iou>best.iou)best={iou,sc,rot,ox,oy,mir};}}

function maskAt(pat,F,x,y){const s=15*F.sc;let u=(x-CX-F.ox)/s,v=-(y-CY-F.oy)/s;if(F.mir)u=-u;if(F.rot===1){const t=u;u=v;v=-t;}else if(F.rot===2){u=-u;v=-v;}else if(F.rot===3){const t=u;u=-v;v=t;}return ART[pat](u,v);}

  if(!G.n)return 0;const vert=!F||F.rot%2===0;const ax=F?CX+F.ox:G.cx,ay=F?CY+F.oy:G.cy;let match=0;

function zones(G,pat,F){const k=[1,1];const s=15*F.sc;const A={lobe:[0,0],tip:[0,0],notch:[0,0],side:[0,0]};
  for(let j=0;j<G.N;j++)for(let i=0;i<G.N;i++){const x=G.x0+(i+.5)*G.cell,y=G.y0+(j+.5)*G.cell;let u=(x-CX-F.ox)/s,v=-(y-CY-F.oy)/s;
    if(F.rot===1){const t=u;u=v;v=-t;}else if(F.rot===2){u=-u;v=-v;}else if(F.rot===3){const t=u;u=-v;v=t;}
    u*=k[0];v*=k[1];const au=Math.abs(u);let z=null;

function score(pour,level){

}

  if(pour.vis()===0){s=pour.tooEarly?'杯子還太空，先按住「高處注入」':pour.fill<40?(pour.high?'按著不放，倒到一半會自動停':'先按住下面的「高處注入」'):(pour.high?'可以放開了':'手指按在杯面上，奶泡會落在指尖上方的白圈');}
  else if(level){
    if(level.pat==='swan')s=pour.pulled?'按完成看看成果':(pour.vis()<200?'先推出一團橢圓當身體':'從身體邊緣快速往右上方畫彎線，拉出脖子');
    else if(level.pat==='rose')s=pour.pours<level.layers?'已推 '+pour.pours+' / '+level.layers+' 層，同一個位置再按一次':'夠了，按完成';
    else if(level.pat==='leafheart')s=pour.cut?'按完成看看成果':(pour.wiggles<level.wiggles?'左右擺動 '+pour.wiggles+' / '+level.wiggles+' 下，邊擺邊往下退':'在上方補一個圓，再快速往下一劃穿過');
    else if(level.pat==='circ')s=pour.active?'不要動，讓圓長大':'圓的大小夠了就按完成';
    else if(level.pat==='heart')s=pour.cut?'按完成看看成果':(pour.active?(pour.vis()>380?'圓夠大了，快速一劃！':'按住不動，推出一個圓'):'從圓的上方按下去，快速往下劃');
    else if(level.layers)s=pour.cut?'按完成看看成果':(pour.pours<level.layers?'已推出 '+pour.pours+' / '+level.layers+' 團'+(pour.active?'':'，往下一點再推'):'最後從最上方快速往下一劃');
    else if(level.pat==='leaf')s=pour.cut?'按完成看看成果':(pour.wiggles<level.wiggles?'左右擺動 '+pour.wiggles+' / '+level.wiggles+' 下，邊擺邊往下退':'夠了，快速往上一劃穿回去');
  }else s=pour.mode==='wiggle'?'擺動中':pour.mode==='cut'?'拉線中':pour.active?'注入中':'';
  if(pour.miss&&pour.t-pour.miss.t<2.5&&!pour.cut)s=pour.miss.why==='small'?'圓還太小就劃了，再推大一點，或按重來':'要從圓的正中間劃過去';
  if(pour.fill>=92&&!pour.done)s='杯子快滿了';
  if(el.textContent!==s)el.textContent=s;
}
function finish(auto){
  if(!pour||pour.done||!running)return;
  if(!auto&&pour.vis()<20){toast('先在杯面上拉花');return;}
  if(MODE==='timed'){timedCupDone(auto);return;}
  pour.up();pour.done=true;pour.high=false;hEnd();running=false;
  lastRes=score(pour,level);
  setTimeout(showResult,auto?500:150);
}

function note(r){
  const items=[];
  if(r.sunk>.25)items.push([r.sunk*2,'太早壓低注入，有些奶泡沉下去了。先用高處注入把杯子倒到一半再開始。']);
  if(r.cover>.62)items.push([(r.cover-.6)*4,'白色太多，蓋住了咖啡，圖案的邊界不清楚。推小一點，或早點收尾。']);
  if(r.cover<.12&&r.total>0)items.push([.6,'圖案太小了，按住久一點讓奶泡推開。']);
  if(r.center<60)items.push([(100-r.center)/80,'圖案偏離中心，從杯子正中間開始倒。']);
  if(r.sym!=null&&r.sym<65)items.push([(100-r.sym)/80,'左右不太對稱，拉的時候手指要走直線。']);
  if(level&&r.shape!=null&&r.shape<70){let t='';
    if(level.pat==='circ')t='圓形不夠圓，推的時候手指不要移動。';
    else if(level.pat==='swan'&&!pour.pulled)t='脖子還沒拉出來：先推出一團當身體，再從身體邊緣快速往右上方畫一道彎線。';
    else if(level.pat==='swan')t='看看藍色虛線，身體要偏左下、脖子要細長往右彎，頭在最上面。';
    else if(!pour.cut)t='少了最後快速一劃，形狀收不起來。要先推出夠大的圓，再從圓的正中間劃過。';
    else if((level.pat==='heart'||level.layers)&&r.tip!=null&&r.tip<.5)t='下方的尖角沒有拉出來。劃的時候要快、要直，從圓的上方一路劃過圓心到下方。';
    else if((level.pat==='heart'||level.layers)&&r.notch!=null&&r.notch>.9)t='上方中間沒有凹進去，看起來比較像一團圓。劃線要從圓的外面開始。';
    else if(level.layers&&pour.pours<level.layers)t='這次只推出 '+pour.pours+' 團，要推 '+level.layers+' 團。每團都要放手再推。';
    else if((level.pat==='leaf'||level.pat==='leafheart')&&pour.wiggles<level.wiggles)t='只擺動了 '+pour.wiggles+' 下，多擺幾下，葉片才會一層一層出現。';
    else t='輪廓還不太像'+level.name+'，看看藍色虛線，對照一下哪裡多了、哪裡少了。';
    items.push([(100-r.shape)/60,t]);}
  if(r.total===0)return '杯面上幾乎看不到圖案。先高處注入到一半，再把手指按在杯子中間。';
  if(!items.length)return r.total>=85?'非常漂亮，可以端給客人了。':'整體不錯，再練幾杯會更穩。';
  items.sort((a,b)=>b[0]-a[0]);return items[0][1];
}

const GHOST={};
function ghostPts(pat){if(GHOST[pat])return GHOST[pat];const F={sc:1,rot:0,ox:0,oy:0};const pts=[],st=1.25;
  for(let y=CY-30;y<=CY+30;y+=st)for(let x=CX-30;x<=CX+30;x+=st){if(maskAt(pat,F,x,y)&&(!maskAt(pat,F,x+st,y)||!maskAt(pat,F,x-st,y)||!maskAt(pat,F,x,y+st)||!maskAt(pat,F,x,y-st)))pts.push([x,y]);}
  return GHOST[pat]=pts;}
function drawGhost(c,pat,rs){c.fillStyle='rgba(255,255,255,.42)';ghostPts(pat).forEach(([x,y])=>{if(Math.hypot(x-CX,y-CY)<rs-1)c.fillRect(x-.3,y-.3,.6,.6);});
  if(pat==='tulip'||pat==='tulip5'){const L=pat==='tulip'?[[-.02,.5],[-.45,.387]]:[[.34,.4],[-.02,.36],[-.35,.32],[-.64,.27]];c.save();c.setLineDash([.6,.9]);c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=.6;L.forEach(([cv,rv])=>{c.beginPath();c.arc(CX,CY-cv*15,rv*15,Math.PI*1.12,Math.PI*1.88);c.stroke();});c.restore();}}
function drawCutArrow(c){const now=performance.now()/1000,a=.45+.4*Math.sin(now*4),up=level&&level.pat==='leaf';const y0=up?CY+24:CY-24,y1=up?CY-20:CY+20,d=up?-1:1;
  c.save();c.globalAlpha=a;c.setLineDash([1.6,1.2]);c.beginPath();c.moveTo(CX,y0);c.lineTo(CX,y1);c.lineWidth=.9;c.strokeStyle='#FFFFFF';c.stroke();c.setLineDash([]);
  c.beginPath();c.moveTo(CX-2.6,y1-d*4.5);c.lineTo(CX,y1);c.lineTo(CX+2.6,y1-d*4.5);c.stroke();c.restore();
  txt(c,up?'從這裡快速往上劃':'從這裡快速往下劃',CX,up?CY+28.5:CY-28.5,2.8,'rgba(255,255,255,.9)');}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  if(screen==='title'){if(!reduceMotion)demoStep(dt);else if(!demo){demo=new Pour(1);for(let i=0;i<420;i++)demoStep(1/60);}drawHero();}
  if(screen==='play'&&pour){if(running){pour.step(dt);if(pour.fill>=100&&!pour.done){toast('杯子滿了');finish(true);}if(MODE==='timed'&&TS&&running){TS.t-=dt;updateTimedName();if(TS.t<=0&&!pour.done){if(pour.vis()>=20)timedCupDone(true);else endTimed();}}}renderPlay();setCoach();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{if(screen==='result'&&lastRes)drawResultCanvas($('#r-cv'),pour,level,lastRes,true);});
renderTitle();
})();
</script>
