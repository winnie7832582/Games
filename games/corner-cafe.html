<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>巷口咖啡館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@500;900&display=swap">
<style>
:root{
  --bg:#EFE7F2; --surface:#FFFFFF; --ink:#2E2433; --soft:#6F6475; --line:#DDD0E3; --track:#E6DCEB;
  --amber:#C97A1E; --rose:#D35D7A; --teal:#2E8B7A; --on-amber:#FFFFFF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1724; --surface:#282134; --ink:#F2ECF5; --soft:#B3A8BC; --line:#3A3147; --track:#3A3147;
    --amber:#F2A94A; --rose:#F07A98; --teal:#5CC8B4; --on-amber:#1C1724;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1724; --surface:#282134; --ink:#F2ECF5; --soft:#B3A8BC; --line:#3A3147; --track:#3A3147;
  --amber:#F2A94A; --rose:#F07A98; --teal:#5CC8B4; --on-amber:#1C1724;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 22px}
.btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .05s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn:focus-visible,.opt:focus-visible,.choice:focus-visible,.dbox:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* title */
#title{align-items:center;justify-content:center;text-align:center;padding:16px 22px 24px}
.store{display:block;width:min(86vw,340px);height:auto}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:clamp(2.4rem,12vw,3.4rem);margin:10px 0 6px;letter-spacing:.1em}
.lede{color:var(--soft);line-height:1.85;max-width:20em;margin:0 0 20px;font-family:"Noto Serif TC",serif;text-wrap:balance}
.tb{display:flex;flex-direction:column;gap:10px;width:min(280px,100%)}
.rec{color:var(--soft);margin:14px 0 0;min-height:1.5em}

/* hub */
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid var(--line)}
.bar .day{font-weight:700;font-size:1.05rem}
.bar .day small{color:var(--soft);font-weight:500;margin-left:4px}
.bar .money{margin-left:auto;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
.bar .stat{border:0;background:transparent;color:var(--soft);cursor:pointer;padding:4px}
.energy{display:flex;align-items:center;gap:8px;padding:8px 14px 0;font-size:.88rem;color:var(--soft)}
.energy .eb{flex:1;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.energy .eb i{display:block;height:100%;background:var(--teal);border-radius:4px;transition:width .3s}
.view{margin:10px 14px 0;border-radius:18px;overflow:hidden;aspect-ratio:2.1;position:relative;flex:none}
.view svg{display:block;width:100%;height:100%}
.view .cap{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:3px 10px;font-size:.85rem}
.msg{padding:12px 16px 4px;line-height:1.8;font-family:"Noto Serif TC",serif}
.opts{padding:6px 14px 18px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.opt:disabled{opacity:.45;cursor:default}
.opt .tx{flex:1;min-width:0}
.opt b{display:block;font-size:1.02rem}
.opt span{display:block;color:var(--soft);font-size:.86rem;line-height:1.5}
.opt .pt{flex:none;width:44px;height:48px;border-radius:12px;overflow:hidden;background:var(--bg)}
.opt .pt svg{width:100%;height:100%}
.opt.big{border-color:var(--amber)}
.sect{font-weight:700;margin:10px 4px 0;color:var(--soft);font-size:.9rem}

/* scene */
#scene{position:relative}
.stagebg{position:absolute;inset:0}
.stagebg svg{width:100%;height:100%;display:block}
.stagearea{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-top:44px;z-index:1}
.who{height:100%;max-height:340px;display:flex;align-items:flex-end;justify-content:center}
.who svg{display:block;height:100%;width:auto;max-width:86vw}
.where{position:absolute;left:12px;top:10px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:3px 12px;font-size:.85rem;z-index:2}
.sbar{position:absolute;right:12px;top:10px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:3px 12px;font-size:.85rem;z-index:2;font-variant-numeric:tabular-nums}
.dwrap{position:relative;padding:0 10px 12px;z-index:3}
.dbox{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:14px 16px 16px;min-height:120px;cursor:pointer;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.dname{position:absolute;top:-14px;left:14px;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 12px;font-size:.9rem}
.dname:empty{display:none}
.dtext{font-family:"Noto Serif TC","Songti TC",serif;line-height:1.85;font-size:1.04rem;min-height:3.7em}
.dnext{position:absolute;right:14px;bottom:8px;color:var(--soft);font-size:.8rem;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.choices.grid{display:grid;grid-template-columns:1fr 1fr}
.choice{background:var(--surface);border:2px solid var(--amber);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;line-height:1.5;font-weight:700}
.choice small{display:block;color:var(--soft);font-weight:500}
.pop{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-weight:700;font-size:1.2rem;pointer-events:none;animation:up 1.1s ease-out forwards;z-index:4;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.2)}
@keyframes up{to{transform:translate(-50%,-40px);opacity:0}}

/* sheet */
.sheet{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;background:rgba(20,10,25,.5)}
.sheet[hidden]{display:none}
.sbox{width:100%;max-height:86%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sbox h3{margin:0 0 6px;font-size:1.25rem}
.sbox .soft{color:var(--soft);font-size:.92rem;line-height:1.6;margin:0 0 10px}
.kv{display:grid;grid-template-columns:3.4em 1fr 2.2em;gap:10px;align-items:center;padding:6px 0}
.kv i{display:block;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.kv i s{display:block;height:100%;background:var(--amber);border-radius:4px;text-decoration:none}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.ppl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px solid var(--line)}
.ppl:last-child{border-bottom:0}
.ppl .pt{width:48px;height:52px;border-radius:12px;overflow:hidden;background:var(--bg);flex:none}
.ppl .tx{flex:1}
.ppl .tx span{display:block;color:var(--soft);font-size:.85rem;line-height:1.5}
.hearts{color:var(--rose);letter-spacing:2px}
.hearts .off{color:var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .tx span{display:block;color:var(--soft);font-size:.86rem}
.row .btn{flex:none;padding:8px 12px}
.close{width:100%;margin-top:10px}
.namein{display:flex;gap:8px;margin:10px 0}
.namein input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface)}
.end{text-align:center}
.end .k{color:var(--soft);margin:0}
.end h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.8rem;margin:6px 0}
.end p.t{font-family:"Noto Serif TC",serif;line-height:1.9;text-align:left}
.gal .row b{font-weight:700}
@media (max-height:680px){.dbox{min-height:104px}}
@media (prefers-reduced-motion:reduce){.btn,.who,.energy .eb i{transition:none}.dnext{animation:none}.pop{animation-duration:.01s}}
</style>
<script src="../gc.js"></script>
</head>
<body>
<div class="app">

  <section class="screen on" id="title" aria-labelledby="t-h">
    <div id="store"></div>
    <h1 id="t-h">巷口咖啡館</h1>
    <p class="lede">外婆留下了一間小咖啡館。三十天裡，你要讓它重新熱鬧起來，也許，還會遇見某個人。</p>
    <div class="tb"><button class="btn main" id="b-cont" type="button" hidden>繼續</button><button class="btn" id="b-new" type="button">新的開始</button><button class="btn" id="b-gal" type="button">結局圖鑑</button></div>
    <p class="rec" id="rec"></p>
  </section>

  <section class="screen" id="hub" aria-label="今天">
    <div class="bar"><span class="day" id="h-day"></span><span class="money" id="h-money"></span><button class="stat" id="h-stat" type="button">狀態</button></div>
    <div class="energy"><span>精神</span><span class="eb"><i id="h-en"></i></span><span id="h-env"></span></div>
    <div class="view" id="h-view"></div>
    <p class="msg" id="h-msg"></p>
    <div class="opts" id="h-opts" style="overflow-y:auto;flex:1;min-height:0"></div>
  </section>

  <section class="screen" id="scene" aria-label="劇情">
    <div class="stagebg" id="s-bg"></div>
    <span class="where" id="s-where"></span><span class="sbar" id="s-bar" hidden></span>
    <div class="stagearea"><div class="who" id="s-who"></div></div>
    <div class="dwrap"><div class="choices" id="s-ch"></div><div class="dbox" id="s-box" tabindex="0" role="button" aria-label="繼續"><span class="dname" id="s-name"></span><div class="dtext" id="s-text" aria-live="polite"></div><span class="dnext" id="s-next">點一下繼續</span></div></div>
  </section>

  <section class="screen" id="ending" aria-label="結局"><div class="scroll" id="end-body"></div></section>

  <div class="sheet" id="sheet" hidden><div class="sbox" id="sbox" role="dialog" aria-modal="true"></div></div>
</div>

const KEY='cornercafe-v1',GAL='cornercafe-endings';
let G=null;

/* ================= VN ENGINE ================= */
let typing=null,advance=null;
function setScene(bg,where,bar){$('#s-bg').innerHTML=bg;$('#s-where').textContent=where||'';const b=$('#s-bar');b.hidden=!bar;if(bar)b.textContent=bar;}
function showWho(L,face){$('#s-who').innerHTML=L?portrait(L,face):'';}
function say(name,text,L,face){
  if(L!==undefined)showWho(L,face);
  $('#s-name').textContent=name||'';$('#s-ch').innerHTML='';$('#s-next').hidden=false;
  text=text.replace(/\{n\}/g,G?G.name:'');
  return new Promise(res=>{
    const el=$('#s-text');let i=0;el.textContent='';
    const done=()=>{clearInterval(typing);typing=null;el.textContent=text;};
    if(reduceMotion){done();}else typing=setInterval(()=>{i++;el.textContent=text.slice(0,i);if(i>=text.length)done();},24);
    advance=()=>{if(typing){done();return;}advance=null;res();};
  });
}
function choose(opts,grid,prompt){
  return new Promise(res=>{
    $('#s-next').hidden=true;if(prompt!=null){$('#s-name').textContent='';$('#s-text').textContent=prompt;}
    const box=$('#s-ch');box.className='choices'+(grid?' grid':'');
    box.innerHTML=opts.map((o,i)=>'<button class="choice" type="button" data-i="'+i+'"'+(o.dis?' disabled style="opacity:.45"':'')+'>'+esc(o.t)+(o.s?'<small>'+esc(o.s)+'</small>':'')+'</button>').join('');
    advance=null;
    box.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{const o=opts[+b.dataset.i];if(o.dis)return;box.innerHTML='';buzz(8);res(+b.dataset.i);}));
    const f=box.querySelector('.choice:not([disabled])');if(f)f.focus();
  });
}
$('#s-box').addEventListener('click',()=>{if(advance)advance();});
$('#s-box').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&advance){e.preventDefault();advance();}});
function pop(text,color){const p=document.createElement('span');p.className='pop';p.textContent=text;p.style.color=color||'var(--rose)';$('#scene').appendChild(p);setTimeout(()=>p.remove(),1150);}
function affPop(v){if(!v)return;pop((v>0?'♥ +':'♥ ')+v,v>0?'var(--rose)':'var(--soft)');}

function goHub(){
  show('hub');
  $('#h-day').innerHTML='第 '+G.day+' 天<small>／'+DAYS+'，週'+WEEK[wd()]+'</small>';$('#h-money').textContent=fmt(G.money);
  $('#h-en').style.width=G.energy+'%';$('#h-env').textContent=Math.round(G.energy);
  const opts=$('#h-opts');let h='';
  if(G.phase==='morning'){
    $('#h-view').innerHTML=BG.cafe('day')+'<span class="cap">早上・咖啡館</span>';
    const vis=ORDER_IDS.filter(c=>CHARS[c].visit.includes(wd())&&G.met[c]);
    $('#h-msg').textContent=(G.day===1?'第一天開店，有點緊張。':pick(['陽光照進窗戶，是開店的好天氣。','磨豆機轉起來，店裡慢慢有了香味。','門口的風鈴輕輕響著。']))+(vis.length?'今天'+vis.map(c=>CHARS[c].short).join('、')+'可能會來。':'');
    h='<button class="opt big" type="button" id="o-open"><span class="tx"><b>開店營業</b><span>招呼客人，記住常客喜歡什麼。精神 −20，店租與材料 $300</span></span></button>';
  }else{
    $('#h-view').innerHTML=BG.street('')+'<span class="cap">晚上・巷口</span>';

async function cafeDay(){
  show('scene');const bar=()=>'今日 '+fmt(earn);let earn=0,repD=0;
  setScene(BG.cafe('day'),'巷口咖啡館','今日 $0');
  const vis=ORDER_IDS.filter(c=>CHARS[c].visit.includes(wd()));
  const nGen=2+Math.floor(G.rep/25);const queue=[];
  for(let i=0;i<nGen;i++)queue.push({gen:true});
  vis.forEach(c=>queue.splice(Math.floor(Math.random()*(queue.length+1)),0,{c}));
  const mult=1+G.stats.cook/100;
  const menuOpts=()=>G.menu.map(k=>({t:MENU[k].n,s:fmt(MENU[k].p)}));
  for(const q of queue){
    if(q.gen){
      const L=genericLook();const pool=ORDERS.filter(o=>G.menu.includes(o[1]));const [txt,want]=pick(pool);
      await say('客人',txt,L,'normal');
      const i=await choose(menuOpts(),true,'要端什麼給客人？');const got=G.menu[i];
      if(got===want){const v=Math.round(MENU[got].p*mult+(G.rep>=50?20:0));earn+=v;repD+=1;showWho(L,'smile');pop('+'+fmt(v),'var(--amber)');await say('客人',pick(['就是想要這個，謝謝！','好喝！下次還會再來。','你很懂耶。']));}
      else{const v=Math.round(MENU[got].p*.5);earn+=v;repD-=2;showWho(L,'sad');pop('+'+fmt(v),'var(--soft)');await say('客人',pick(['呃……這不是我想要的，算了。','嗯……跟我想的不太一樣。']));}
    }else{
      const c=q.c,C=CHARS[c];
      if(!G.met[c]){await introScene(c);}
      else{await say(C.n,C.lines.again,C.look,'normal');}
      const i=await choose(menuOpts(),true,'要端什麼給'+C.short+'？');const got=G.menu[i];
      let d,face,line;
      if(got===C.fav){d=4;face='smile';line=C.lines.fav;}else if(C.ok.includes(got)){d=1;face='normal';line=C.lines.ok;}else if(C.bad.includes(got)){d=-2;face='sad';line=C.lines.bad;}else{d=0;face='normal';line=C.lines.ok;}
      const v=Math.round(MENU[got].p*mult);earn+=v;addAff(c,d);showWho(C.look,face);affPop(d);await say(C.n,line);
      if(got!==C.fav&&!G.menu.includes(C.fav)&&!G.seenHint[c]){G.seenHint[c]=1;await say('',C.short+'好像在找菜單上沒有的東西。也許研發「'+MENU[C.fav].n+'」會讓他開心。');}
    }
    $('#s-bar').textContent=bar();
  }
  G.rep=clamp(G.rep+repD,0,100);G.money+=earn-300;G.energy=clamp(G.energy-20,0,100);G.phase='evening';save();
  showWho(null);setScene(BG.cafe('night'),'打烊後');
  await say('','打烊了。今天收入 '+fmt(earn)+'，扣掉店租和材料 $300。店的名聲 '+(repD>=0?'+':'')+repD+'。');
  goHub();
}

async function meet(c){
  const C=CHARS[c];G.energy=clamp(G.energy-20,0,100);
  show('scene');setScene(BG[C.eve.bg]?BG[C.eve.bg]('night'):BG.street(''),C.eve.place);
  const k=G.ev[c],req=EVREQ[k];
  const ready=req&&G.aff[c]>=req.aff&&(req.si==null||G.stats[C.stats[req.si]]>=req.sv)&&(!req.day||G.day>=req.day)&&!(k===4&&G.partner&&G.partner!==c);
  if(ready){await EVENTS[c][k]();G.ev[c]=k+1;}
  else{await chat(c);
    if(req&&G.aff[c]>=req.aff&&req.si!=null&&G.stats[C.stats[req.si]]<req.sv)await say('','（'+C.short+'好像還想聊更深的話題。也許你的'+STATS[C.stats[req.si]]+'要再提升到 '+req.sv+'。）');}
  const gi=Object.keys(G.gifts).filter(g=>G.gifts[g]>0);
  if(gi.length){const opts=gi.map(g=>({t:'送'+GIFTS[g].n}));opts.push({t:'不送禮物'});
    const i=await choose(opts,false,'要送禮物給'+C.short+'嗎？');
    if(i<gi.length){const g=gi[i];G.gifts[g]--;const v=C.gifts[g]!=null?C.gifts[g]:2;addAff(c,v);
      showWho(C.look,v>=8?'blush':v>0?'smile':'sad');affPop(v);
      await say(C.n,v>=8?pick(['這……是特地為我準備的嗎？謝謝你，我會好好珍惜。','你怎麼知道我想要這個？']):v>0?'謝謝你，我很喜歡。':'謝謝……不過我可能用不太到。');}}
  endDay('和'+C.short+'度過了一個晚上。',0);
}
async function chat(c){
  const C=CHARS[c];
  await say(C.n,pick({yuan:['又見面了。這間書店的建築書區很齊。','你也來看書？'],qing:['{n}！你也來散步嗎？','嘿嘿，我剛好在畫這邊的夕陽。'],kai:['喔！{n}！你也來運動？','來來來，我教你怎麼用這台機器！'],lin:['你來了。今晚的演出，還喜歡嗎？','剛好結束，要不要坐一下？']}[c]),C.look,'smile');
  const all=shuffle(C.topics.good.slice()).slice(0,1).concat(shuffle(C.topics.bad.slice()).slice(0,1)).concat([pick(['天氣','咖啡館最近的事','小時候的回憶'])]);shuffle(all);
  const i=await choose(all.map(t=>({t:'聊聊'+t})),false,'要聊什麼呢？');const t=all[i];
  let d,face,line;
  if(C.topics.good.includes(t)){d=5+Math.floor(G.stats.talk/25);face='smile';line=C.lines.good;}
  else if(C.topics.bad.includes(t)){d=-2;face='sad';line=C.lines.dull;}
  else{d=2;face='normal';line=C.lines.meh;}
  addAff(c,d);showWho(C.look,face);affPop(d);await say('',line);
}
async function doAct(id){
  const a=ACTS.find(x=>x.id===id);G.money-=a.cost;G.energy=clamp(G.energy-a.en,0,100);
  const fx=Object.assign({},a.fx);const boost=1+G.stats.fit/200;Object.keys(fx).forEach(k=>fx[k]=Math.round(fx[k]*boost));addStat(fx);
  let extra='';
  if(id==='gym'&&G.met.kai&&Math.random()<.4){addAff('kai',3);extra='在健身房遇到阿凱，他熱心地幫你調整姿勢。（阿凱好感 +3）';}
  if(id==='museum'&&G.met.qing&&Math.random()<.4){addAff('qing',3);extra='在美術館遇到曉晴，她拉著你講了一整排畫的故事。（曉晴好感 +3）';}
  if(id==='book'&&G.met.yuan&&Math.random()<.4){addAff('yuan',3);extra='予安也來參加讀書會，你們剛好選了同一本書。（予安好感 +3）';}
  endDay('去了'+a.n+'。'+Object.keys(fx).map(k=>STATS[k]+' +'+fx[k]).join('、')+'。'+(extra?'\n'+extra:''),0);
}

const ENDINGS=[
  {id:'love-yuan',n:'窗邊的老位子',who:'yuan',t:'一年後，予安設計的第一棟建築落成了。開幕那天，他在致詞時說：「靈感來自巷口一間咖啡館。」\n每天早上八點，他仍然坐在窗邊的老位子，點同一杯手沖。只是現在，他會等你打烊，一起走回家。'},
  {id:'love-qing',n:'畫在奶泡上的愛心',who:'qing',t:'曉晴畫的菜單掛在牆上，成了店裡最受歡迎的拍照角落。她的繪本出版了，書名叫《巷口咖啡館》。\n簽書會那天，她在每一本書的最後一頁都畫了一顆小小的愛心，就像你每天為她拉的那杯拿鐵。'},
  {id:'love-kai',n:'最強的早餐',who:'kai',t:'阿凱升上了小隊長，每次下夜班，第一件事還是衝進咖啡館。\n「老闆，老樣子！」他總是這樣喊，然後趁沒人注意時，偷偷在你臉頰上親一下。整條巷子的人都知道，這間店有一位專屬守護者。'},
  {id:'love-lin',n:'寫給你的曲子',who:'lin',t:'若琳出國的那一年，每個月都寄來一張明信片。第十二張寄到的那天，她本人也推開了店門。\n那晚，她在店裡拉了一首新曲子，曲名就叫〈巷口〉。從此以後，每個下雨的夜晚，店裡都會響起小提琴的聲音。'},
  {id:'friend-yuan',n:'安靜的常客',who:'yuan',t:'予安還是每天來喝咖啡，偶爾留下一張速寫。你們成了能安靜共處的朋友，有時一句話都不說，也覺得很自在。'},
  {id:'friend-qing',n:'最佳拍檔',who:'qing',t:'曉晴成了咖啡館的專屬插畫家，你們一起辦了好幾次小市集。她說，你是她遇過最好的拍檔。'},
  {id:'friend-kai',n:'可靠的鄰居',who:'kai',t:'阿凱成了店裡最可靠的鄰居。颱風、停電、搬貨，只要一通電話，他總是第一個趕到。'},
  {id:'friend-lin',n:'遠方的明信片',who:'lin',t:'若琳出國後，常寄明信片回來。每一張的背面都寫著：「等我回去，要喝你泡的伯爵茶。」'},
  {id:'cafe-top',n:'巷口人氣名店',t:'三十天後，咖啡館門口排起了隊。雜誌來採訪，問你成功的秘訣。\n你想起外婆的信：「只要讓來的人都能喝到一杯暖暖的就好。」你笑著說，秘訣大概就是這個。'},
  {id:'cafe-warm',n:'溫暖的日常',t:'咖啡館不算大紅大紫，但每天都有熟悉的面孔推門進來。你漸漸覺得，這樣的日子也很好。外婆一定也會這麼想。'},
  {id:'cafe-next',n:'下一章',t:'三十天過去，咖啡館還在努力中。帳本上的數字不太好看，但你學會了好多事。你決定再給自己一次機會，故事才正要開始。'}
];
async function finale(){
  let id;
  if(G.partner)id='love-'+G.partner;
  else{const best=ORDER_IDS.slice().sort((a,b)=>G.aff[b]-G.aff[a])[0];
    if(G.aff[best]>=60)id='friend-'+best;
    else if(G.money>=25000&&G.rep>=60)id='cafe-top';
    else if(G.money>=8000)id='cafe-warm';else id='cafe-next';}
  const E=ENDINGS.find(e=>e.id===id);addGal(id);try{GCStore.removeItem(KEY);}catch(e){}
  show('scene');setScene(E.who?BG[CHARS[E.who].eve.bg]('night'):BG.cafe('day'),'第三十天');showWho(E.who?CHARS[E.who].look:null,'smile');
  await say('','三十天，就這樣過去了。');
  show('ending');
  const ex=E.who?'<div style="width:160px;margin:0 auto">'+portrait(CHARS[E.who].look,E.id.startsWith('love')?'blush':'smile')+'</div>':storeSVG();
  $('#end-body').innerHTML='<div class="end">'+ex+'<p class="k">'+(E.id.startsWith('love')?'戀愛結局':E.id.startsWith('friend')?'友情結局':'咖啡館結局')+'</p><h2>'+E.n+'</h2>'+E.t.split('\n').map(p=>'<p class="t">'+esc(p)+'</p>').join('')+
    '<div class="row"><div class="tx"><b>最後的成績</b><span>現金 '+fmt(G.money)+'，名聲 '+G.rep+'，菜單 '+G.menu.length+' 樣</span></div></div>'+
    '<p class="k" style="margin:12px 0">已解鎖 '+gal().length+' / '+ENDINGS.length+' 個結局</p><button class="btn main close" type="button" id="e-again">再玩一次</button><button class="btn close" type="button" id="e-gal">結局圖鑑</button></div>';
  $('#e-again').addEventListener('click',()=>{titleInit();});$('#e-gal').addEventListener('click',showGallery);
}
function showGallery(){
  const g=gal();
  sheet('<h3>結局圖鑑</h3><p class="soft">已解鎖 '+g.length+' / '+ENDINGS.length+'。每個角色都有戀愛和友情兩種結局，咖啡館也有三種。</p><div class="gal">'+ENDINGS.map(e=>{const ok=g.includes(e.id);return '<div class="row">'+(e.who?'<span class="pt" style="width:44px;height:48px;border-radius:12px;overflow:hidden;background:var(--bg);flex:none">'+(ok?portrait(CHARS[e.who].look,'smile'):'')+'</span>':'')+'<div class="tx"><b>'+(ok?e.n:'？？？')+'</b><span>'+(e.id.startsWith('love')?'戀愛結局・'+CHARS[e.who].n:e.id.startsWith('friend')?'友情結局・'+CHARS[e.who].n:'咖啡館結局')+'</span></div></div>';}).join('')+'</div><button class="btn close" type="button" data-close>關閉</button>');
}

titleInit();
})();
