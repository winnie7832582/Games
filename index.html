<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小遊戲合集</title>
<meta name="theme-color" content="#EAF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121822" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="遊戲合集">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700&display=swap">
<script src="config.js"></script>
<style>
:root{
  --bg:#EAF1F7; --surface:#FFFFFF; --ink:#1F2A37; --soft:#5E6B7A; --line:#D5E0EA; --accent:#3B6EF5; --on-accent:#FFFFFF; --warn:#C2453B;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121822;--surface:#1B2230;--ink:#E8EDF4;--soft:#9AA8B8;--line:#2A3444;--accent:#7FA3FF;--on-accent:#121822;--warn:#F07A6E;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#121822;--surface:#1B2230;--ink:#E8EDF4;--soft:#9AA8B8;--line:#2A3444;--accent:#7FA3FF;--on-accent:#121822;--warn:#F07A6E;color-scheme:dark;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 32px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
h1{font-family:Huninn,"Noto Sans TC",sans-serif;font-weight:400;font-size:clamp(1.7rem,7vw,2.2rem);margin:0;flex:1;min-width:0;letter-spacing:.04em}
.ver{color:var(--soft);font-size:.8rem;margin-left:6px;font-family:"Noto Sans TC",sans-serif;letter-spacing:0}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;max-width:48%}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:.95rem}
.btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.game:focus-visible,.prof:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:10px 12px;margin:0 0 12px}
.banner[hidden]{display:none}
.banner p{margin:0;flex:1;line-height:1.5}
.banner .btn{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent);padding:8px 12px}
.tip{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;line-height:1.7;position:relative}
.tip[hidden]{display:none}
.tip b{display:block;margin-bottom:2px}
.tip .x{position:absolute;right:6px;top:4px;border:0;background:transparent;color:var(--soft);font-size:1.2rem;cursor:pointer;padding:6px 10px}
.cont{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:0 0 16px;text-decoration:none;color:inherit}
.cont[hidden]{display:none}
.cont .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.7rem;flex:none}
.cont .tx{flex:1;min-width:0}
.cont small{display:block;color:var(--soft)}
.cont b{font-size:1.05rem}
.find{margin:0 0 12px}
.find input{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 14px;background:var(--surface);font-size:1rem}
.find input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.92rem;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cats button small{opacity:.6;margin-left:4px}
.cats button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.game .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.game .tags i{font-style:normal;font-size:.72rem;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.none{color:var(--soft);text-align:center;margin:24px 0}
[hidden]{display:none !important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.game{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--surface);border-radius:18px;overflow:hidden;border:2px solid var(--line);transition:transform .08s}
.game:active{transform:scale(.97)}
.game .top{aspect-ratio:1.5;display:grid;place-items:center;font-size:2.6rem;position:relative}
.game .dot{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);color:#1F2A37;font-size:.72rem;border-radius:999px;padding:2px 8px}
.game .bd{padding:10px 12px 12px}
.game b{display:block;font-size:1.05rem}
.game span{display:block;color:var(--soft);font-size:.84rem;line-height:1.5;margin-top:2px}
.foot{display:flex;gap:10px;margin-top:18px}
.credit{margin:22px 0 4px;text-align:center;color:var(--soft);font-size:.82rem;line-height:1.7}
.foot .btn{flex:1}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,15,25,.5)}
.sheet[hidden]{display:none}
.sbox{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sbox h2{margin:0 0 6px;font-size:1.25rem}
.sbox p.soft{color:var(--soft);line-height:1.7;margin:0 0 12px;font-size:.93rem}
.sbox h3{font-size:1rem;margin:16px 0 8px}
.sbox .btn{width:100%;margin-top:8px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.shead{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;margin:-18px -16px 8px;padding:16px 16px 10px;background:var(--surface);z-index:1;border-bottom:1px solid var(--line)}
.shead h2{flex:1;margin:0}
.sbox .btn.sm{width:auto;margin:0;padding:8px 14px}
.danger{color:var(--warn);margin-top:28px;padding-top:14px;border-top:2px dashed var(--line)}
.prof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.prof[aria-current="true"]{border-color:var(--accent)}
.prof .tx{flex:1;min-width:0}
.prof small{display:block;color:var(--soft)}
.mini{border:0;background:transparent;color:var(--soft);padding:6px 8px;cursor:pointer;border-radius:8px;white-space:nowrap;flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.field[hidden]{display:none}
.field input,.field textarea{border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);width:100%}
.field textarea{min-height:90px;font-size:.8rem;word-break:break-all}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.log{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:0 0 12px}
.log b{display:block}.log small{color:var(--soft)}
.log ul{margin:4px 0 0;padding-left:18px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;transition:opacity .15s,transform .15s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.game,.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="upd" hidden role="status"><p id="upd-t">有新版本可以更新</p><button class="btn" type="button" id="upd-b">更新</button></div>
  <header><h1 id="ttl"></h1><button class="chip" type="button" id="chip" aria-label="切換玩家"><span class="av" id="chip-av"></span><span id="chip-n"></span></button></header>
  <div class="tip" id="tip" hidden><button class="x" type="button" id="tip-x" aria-label="關閉提示">×</button><b id="tip-h"></b><span id="tip-t"></span><div id="tip-a"></div></div>
  <a class="cont" id="cont" hidden><span class="ic" id="cont-ic"></span><span class="tx"><small>繼續玩</small><b id="cont-n"></b></span><span aria-hidden="true">›</span></a>
  <div class="find"><input id="q" type="search" placeholder="搜尋遊戲名稱或類型" aria-label="搜尋遊戲" autocomplete="off" enterkeyhint="search"><div class="cats" id="cats" role="group" aria-label="遊戲類型"></div></div>
  <div class="grid" id="grid"></div>
  <p class="none" id="none" hidden>找不到符合的遊戲，換個關鍵字試試。</p>
  <div class="foot"><button class="btn" type="button" id="b-backup">備份與轉移</button><button class="btn" type="button" id="b-about">關於與更新</button></div>
  <footer class="credit" id="credit"></footer>
</div>
<div class="sheet" id="sheet" hidden><div class="sbox" id="sbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const C=self.GC_CONFIG;const $=s=>document.querySelector(s);
const PK='gc:profiles',CUR='gc:current';
const COLORS=['#3B6EF5','#E5483A','#2E8B57','#F2A23B','#8250B0','#2A9D8F','#D35D7A','#5E6B7A'];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.className='toast show';clearTimeout(tt);tt=setTimeout(()=>t.className='toast',2400);}
document.title=C.title;
$('#credit').textContent='© '+(C.year||new Date().getFullYear())+' '+(C.author||'hua')+'　版權所有　v'+C.version;$('#ttl').innerHTML=esc(C.title)+'<span class="ver">v'+esc(C.version)+'</span>';

/* ---------- profiles ---------- */
function profiles(){try{return JSON.parse(localStorage.getItem(PK)||'[]');}catch(e){return [];}}
function saveProfiles(p){localStorage.setItem(PK,JSON.stringify(p));}
function current(){const id=localStorage.getItem(CUR);const ps=profiles();return ps.find(p=>p.id===id)||ps[0]||null;}
function setCurrent(id){localStorage.setItem(CUR,id);}
function newId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function prefix(id){return 'gc:p:'+id+':';}
function keysOf(id){const pre=prefix(id),out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(pre)===0)out.push(k);}return out;}
function meta(id){try{return JSON.parse(localStorage.getItem(prefix(id)+'__meta')||'{}');}catch(e){return {};}}
function addProfile(name,color){const ps=profiles();const p={id:newId(),name:name,color:color,created:Date.now()};ps.push(p);saveProfiles(ps);setCurrent(p.id);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}return p;}
function uniqueName(n){const ps=profiles();let x=n,i=2;while(ps.some(p=>p.name===x))x=n+'（'+(i++)+'）';return x;}

/* ---------- render ---------- */
function render(){
  const p=current();
  if(!p){profileForm(true);return;}
  setCurrent(p.id);
  $('#chip-av').textContent=p.name.slice(0,1);$('#chip-av').style.background=p.color;$('#chip-n').textContent=p.name;
  const m=meta(p.id);const g=C.games.find(x=>x.id===m.lastGame);
  const cont=$('#cont');if(g){cont.hidden=false;cont.href=g.file;$('#cont-ic').textContent=g.icon;$('#cont-ic').style.background=g.color+'33';$('#cont-n').textContent=g.name;}else cont.hidden=true;
  renderCats();renderGrid();
  installTip();
}

/* ---------- categories & search ---------- */
let CAT='全部',Q='';
const CATS=['全部'].concat(C.categories||Array.from(new Set(C.games.flatMap(g=>g.tags||[]))));
function matches(g){const q=Q.trim().toLowerCase();const inCat=CAT==='全部'||(g.tags||[]).includes(CAT);if(!inCat)return false;if(!q)return true;
  return [g.name,g.desc].concat(g.tags||[],g.kw||[]).join(' ').toLowerCase().includes(q);}
function renderCats(){$('#cats').innerHTML=CATS.map(c=>{const n=c==='全部'?C.games.length:C.games.filter(g=>(g.tags||[]).includes(c)).length;return '<button type="button" data-cat="'+esc(c)+'" aria-pressed="'+(c===CAT)+'">'+esc(c)+'<small>'+n+'</small></button>';}).join('');}
function renderGrid(){const p=current();if(!p)return;const m=meta(p.id);const list=C.games.filter(matches);
  $('#grid').innerHTML=list.map(x=>{const played=m.games&&m.games[x.id];return '<a class="game" href="'+esc(x.file)+'"><span class="top" style="background:'+x.color+'26"><span aria-hidden="true">'+x.icon+'</span>'+(played?'<span class="dot">玩過</span>':'')+'</span><span class="bd"><b>'+esc(x.name)+'</b><span>'+esc(x.desc)+'</span><span class="tags">'+(x.tags||[]).map(t=>'<i>'+esc(t)+'</i>').join('')+'</span></span></a>';}).join('');
  $('#none').hidden=list.length>0;}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;CAT=b.dataset.cat;renderCats();renderGrid();});
$('#q').addEventListener('input',e=>{Q=e.target.value;if(Q.trim()&&CAT!=='全部'){CAT='全部';renderCats();}renderGrid();});

/* ---------- sheets ---------- */
function sheet(h,bind,lock){$('#sbox').innerHTML=h;$('#sheet').hidden=false;$('#sheet').dataset.lock=lock?'1':'';$('#sbox').querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheet));if(bind)bind($('#sbox'));const f=$('#sbox').querySelector('input,button');if(f)f.focus();}
function closeSheet(){$('#sheet').hidden=true;}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&!$('#sheet').dataset.lock)closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden&&!$('#sheet').dataset.lock)closeSheet();});

function profileForm(first,edit){
  let color=edit?edit.color:COLORS[profiles().length%COLORS.length];
  sheet('<h2>'+(first?'歡迎！先建立一個玩家':edit?'編輯玩家':'新增玩家')+'</h2><p class="soft">'+(first?'每個玩家有自己的遊戲進度。家人朋友共用這台裝置時，可以各建一個。':'每個玩家的進度分開存。')+'</p>'+
    '<div class="field"><label for="pf-n">名字</label><input id="pf-n" maxlength="10" value="'+esc(edit?edit.name:'')+'" placeholder="例如：小美"></div>'+
    '<div class="colors" role="group" aria-label="顏色">'+COLORS.map(c=>'<button type="button" data-c="'+c+'" style="background:'+c+'" aria-pressed="'+(c===color)+'" aria-label="顏色"></button>').join('')+'</div>'+
    '<button class="btn main" type="button" id="pf-ok">'+(edit?'儲存':'建立')+'</button>'+(first?'<button class="btn" type="button" id="pf-imp">我有存檔，要匯入</button>':'<button class="btn" type="button" data-close>取消</button>'),b=>{
    b.querySelectorAll('[data-c]').forEach(x=>x.addEventListener('click',()=>{color=x.dataset.c;b.querySelectorAll('[data-c]').forEach(y=>y.setAttribute('aria-pressed',String(y===x)));}));
    const ok=()=>{const n=(b.querySelector('#pf-n').value||'').trim();if(!n){toast('請輸入名字');return;}
      if(edit){const ps=profiles();const q=ps.find(p=>p.id===edit.id);q.name=n;q.color=color;saveProfiles(ps);}else addProfile(uniqueName(n),color);
      closeSheet();render();};
    b.querySelector('#pf-ok').addEventListener('click',ok);b.querySelector('#pf-n').addEventListener('keydown',e=>{if(e.key==='Enter')ok();});
    const im=b.querySelector('#pf-imp');if(im)im.addEventListener('click',()=>backupSheet(true));
  },first);
}
$('#chip').addEventListener('click',profilesSheet);
function profilesSheet(){
  const ps=profiles(),cur=current();
  sheet('<h2>選擇玩家</h2><p class="soft">切換後，遊戲會讀取該玩家的進度。</p>'+ps.map(p=>{const m=meta(p.id),g=C.games.find(x=>x.id===m.lastGame);return '<div style="display:flex;gap:4px;align-items:center"><button class="prof" type="button" data-sw="'+p.id+'" aria-current="'+(cur&&cur.id===p.id)+'"><span class="av" style="background:'+p.color+'">'+esc(p.name.slice(0,1))+'</span><span class="tx"><b>'+esc(p.name)+'</b><small>'+(g?'最近玩：'+esc(g.name):'還沒玩過')+'</small></span></button><button class="mini" type="button" data-ed="'+p.id+'" aria-label="編輯 '+esc(p.name)+'">編輯</button></div>';}).join('')+
    '<button class="btn main" type="button" id="ps-add">新增玩家</button><button class="btn" type="button" data-close>關閉</button>',b=>{
    b.querySelectorAll('[data-sw]').forEach(x=>x.addEventListener('click',()=>{setCurrent(x.dataset.sw);closeSheet();render();toast('切換到 '+current().name);}));
    b.querySelectorAll('[data-ed]').forEach(x=>x.addEventListener('click',()=>editSheet(profiles().find(p=>p.id===x.dataset.ed))));
    b.querySelector('#ps-add').addEventListener('click',()=>profileForm(false));});
}
function editSheet(p){
  sheet('<h2>'+esc(p.name)+'</h2><button class="btn" type="button" id="ed-r">改名字或顏色</button><button class="btn warn" type="button" id="ed-d">刪除這個玩家</button><button class="btn" type="button" data-close>關閉</button>',b=>{
    b.querySelector('#ed-r').addEventListener('click',()=>profileForm(false,p));
    b.querySelector('#ed-d').addEventListener('click',()=>sheet('<h2>刪除「'+esc(p.name)+'」？</h2><p class="soft">這個玩家在所有遊戲的進度都會從這台裝置刪除，無法復原。需要的話，先到「備份與轉移」匯出。</p><div class="row2"><button class="btn" type="button" data-close>取消</button><button class="btn warn" type="button" id="dd">刪除</button></div>',b2=>b2.querySelector('#dd').addEventListener('click',()=>{
      keysOf(p.id).forEach(k=>localStorage.removeItem(k));saveProfiles(profiles().filter(x=>x.id!==p.id));if(localStorage.getItem(CUR)===p.id)localStorage.removeItem(CUR);closeSheet();render();toast('已刪除');})));});
}

/* ---------- backup / transfer ---------- */
function packProfile(p){const data={};keysOf(p.id).forEach(k=>{data[k.slice(prefix(p.id).length)]=localStorage.getItem(k);});return{name:p.name,color:p.color,created:p.created,data};}
function pack(list){return{app:'gc-save',format:1,version:C.version,exported:new Date().toISOString(),profiles:list.map(packProfile)};}
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function toCode(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'GC1:'+b64u(buf);}
  return 'GC0:'+b64u(raw);}
async function fromCode(code){code=String(code);try{code=code.normalize('NFKC');}catch(e){}code=code.replace(/[\u2010-\u2015\u2212]/g,'-').replace(/\s+/g,'');const m=code.match(/gc([01])[:：]([A-Za-z0-9_-]+)/i);if(!m)throw new Error('format');const bytes=unb64u(m[2]);
  if(m[1]==='1'){if(!window.DecompressionStream)throw new Error('nogzip');const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text());}
  return JSON.parse(new TextDecoder().decode(bytes));}
function packForCode(list){const o=pack(list);o.profiles.forEach(pd=>{Object.keys(pd.data).forEach(k=>{if(k==='latteart-v1'){try{const v=JSON.parse(pd.data[k]);if(v&&v.gallery){v.gallery=[];pd.data[k]=JSON.stringify(v);}}catch(e){}}});});return o;}
function manualCopy(ta){ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length);}catch(e){}let ok=false;try{ok=document.execCommand('copy');}catch(e){}toast(ok?'轉移碼已複製':'已全選，請長按選「拷貝」');}
function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
async function exportFile(list){
  const obj=pack(list);const name=(list.length===1?list[0].name:'全部玩家')+'-存檔-'+stamp()+'.json';
  const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name});toast('已開啟分享，可以存到「檔案」或傳給自己');return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('存檔已下載：'+name);
}
function validate(obj){return obj&&obj.app==='gc-save'&&Array.isArray(obj.profiles)&&obj.profiles.every(p=>p&&typeof p.name==='string'&&p.data&&typeof p.data==='object');}
function writeProfile(id,pd){try{const old=localStorage.getItem(prefix(id)+'latteart-v1'),nw=pd.data['latteart-v1'];if(old&&nw){const o=JSON.parse(old),n=JSON.parse(nw);if(n&&Array.isArray(n.gallery)&&!n.gallery.length&&o.gallery&&o.gallery.length){n.gallery=o.gallery;pd.data['latteart-v1']=JSON.stringify(n);}}}catch(e){}keysOf(id).forEach(k=>localStorage.removeItem(k));Object.keys(pd.data).forEach(k=>localStorage.setItem(prefix(id)+k,String(pd.data[k])));}
function applyImport(obj){
  if(!validate(obj)){toast('這不是遊戲合集的存檔');return;}
  const cur=current();
  const asNew=()=>{try{obj.profiles.forEach(pd=>{const p=addProfile(uniqueName(pd.name),pd.color||COLORS[0]);writeProfile(p.id,pd);});closeSheet();render();toast('匯入完成，已切換到「'+current().name+'」');}catch(e){toast('裝置空間不足，匯入失敗');}};
  if(obj.profiles.length===1&&cur){
    const pd=obj.profiles[0];
    sheet('<h2>匯入「'+esc(pd.name)+'」的存檔</h2><p class="soft">存檔時間：'+esc((obj.exported||'').slice(0,10))+'，版本 '+esc(obj.version||'')+'。</p><button class="btn main" type="button" id="im-new">新增成一個新玩家</button><button class="btn warn" type="button" id="im-over">覆蓋目前玩家「'+esc(cur.name)+'」</button><button class="btn" type="button" data-close>取消</button>',b=>{
      b.querySelector('#im-new').addEventListener('click',asNew);
      b.querySelector('#im-over').addEventListener('click',()=>{try{writeProfile(cur.id,pd);closeSheet();render();toast('已用存檔覆蓋「'+cur.name+'」');}catch(e){toast('裝置空間不足，匯入失敗');}});});
  }else asNew();
}
function backupSheet(fromFirst){
  const ps=profiles(),cur=current();
  sheet('<div class="shead"><h2>備份與轉移</h2>'+(fromFirst?'':'<button class="btn sm" type="button" data-close>關閉</button>')+'</div><p class="soft">進度只存在這台裝置。換手機、換電腦，或想留一份備份時，先在舊裝置匯出，再到新裝置匯入。</p>'+
    (cur?'<h3>匯出「'+esc(cur.name)+'」的進度</h3><button class="btn main" type="button" id="bk-file">匯出存檔檔案</button>'+(ps.length>1?'<button class="btn" type="button" id="bk-all">匯出全部玩家的存檔檔案</button>':'')+'<button class="btn" type="button" id="bk-code">複製轉移碼</button>'+
      '<div class="field" id="bk-show" hidden><label for="bk-out">沒辦法自動複製，請長按下面的轉移碼，選「全選」再「拷貝」</label><textarea id="bk-out" readonly></textarea></div>'+
      '<p class="soft" style="margin-top:8px">轉移碼可以用訊息傳，但不包含「拉一杯花」作品集的照片；要連照片一起搬，請用存檔檔案。</p>':'')+
    '<h3>匯入其他裝置或玩家的進度</h3><button class="btn" type="button" id="bk-open">選擇存檔檔案</button><input type="file" id="bk-in" accept=".json,application/json" hidden>'+
    '<div class="field"><label for="bk-txt">或貼上轉移碼</label><textarea id="bk-txt" placeholder="GC1:..." autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea></div>'+
    '<div class="row2"><button class="btn" type="button" id="bk-pastebtn">貼上</button><button class="btn main" type="button" id="bk-import">匯入</button></div>'+
    '<p class="soft" style="margin-top:12px">iPhone 小提醒：從 Safari 和從「主畫面圖示」打開，會是兩份不同的存檔。建議先加入主畫面，之後都從圖示打開。</p>'+
    (fromFirst?'<button class="btn" type="button" id="bk-back">返回建立玩家</button>':''),b=>{
    const f=b.querySelector('#bk-file');if(f)f.addEventListener('click',()=>exportFile([cur]));
    const a=b.querySelector('#bk-all');if(a)a.addEventListener('click',()=>exportFile(profiles()));
    const c=b.querySelector('#bk-code');if(c)c.addEventListener('click',()=>{
      const p=toCode(packForCode([cur]));
      const okMsg=code=>{const n=code.length;return n>9000?'已複製，不過轉移碼有 '+n+' 個字，用 LINE 傳可能會被截斷，建議改用存檔檔案':'轉移碼已複製，可以用訊息傳到另一台裝置';};
      const fail=()=>p.then(code=>{const box=b.querySelector('#bk-show'),out=b.querySelector('#bk-out');out.value=code;box.hidden=false;out.focus();out.select();toast('請長按轉移碼，選「拷貝」');});
      let started=false;
      try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){started=true;
        navigator.clipboard.write([new ClipboardItem({'text/plain':p.then(code=>new Blob([code],{type:'text/plain'}))})]).then(()=>p.then(code=>{b.querySelector('#bk-show').hidden=true;toast(okMsg(code));})).catch(fail);}}catch(e){started=false;}
      if(!started)p.then(code=>(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast(okMsg(code)))).catch(fail);
    });
    const inp=b.querySelector('#bk-in');b.querySelector('#bk-open').addEventListener('click',()=>inp.click());
    inp.addEventListener('change',()=>{const file=inp.files&&inp.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{applyImport(JSON.parse(r.result));}catch(e){toast('讀不懂這個檔案，請確認是遊戲合集的存檔');}};r.readAsText(file);});
    const ta=b.querySelector('#bk-txt');
    b.querySelector('#bk-pastebtn').addEventListener('click',async()=>{
      try{if(!navigator.clipboard||!navigator.clipboard.readText)throw 0;const t=await navigator.clipboard.readText();if(!t||!t.trim()){toast('剪貼簿是空的，請先複製轉移碼');return;}ta.value=t.trim();toast('已貼上，按「匯入」');}
      catch(e){ta.focus();toast('請長按輸入框，選「貼上」');}});
    b.querySelector('#bk-import').addEventListener('click',async()=>{const v=ta.value;if(!v.trim()){toast('請先貼上轉移碼');return;}
      try{applyImport(await fromCode(v));}catch(e){toast(e.message==='nogzip'?'這個瀏覽器版本太舊，請改用存檔檔案':e.message==='format'?'找不到轉移碼，請確認有完整貼上（開頭是 GC1:）':'轉移碼不完整，可能複製時漏了一段或被聊天軟體截斷，請改用存檔檔案');}});
    const bb=b.querySelector('#bk-back');if(bb)bb.addEventListener('click',()=>profileForm(true));
  },fromFirst);
}

$('#b-backup').addEventListener('click',()=>backupSheet(false));

/* ---------- about / update ---------- */
let REG=null;
$('#b-about').addEventListener('click',async()=>{
  let usage='';try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();usage='這台裝置已用 '+(e.usage/1048576).toFixed(1)+' MB';}}catch(e){}
  let persisted='';try{if(navigator.storage&&navigator.storage.persisted)persisted=(await navigator.storage.persisted())?'，資料已設為長期保存':'';}catch(e){}
  sheet('<div class="shead"><h2>'+esc(C.title)+'</h2><button class="btn sm" type="button" data-close>關閉</button></div><p class="soft">目前版本 v'+esc(C.version)+'。'+usage+persisted+'</p><button class="btn main" type="button" id="ab-up">檢查更新</button>'+
    '<h3>更新紀錄</h3>'+C.changelog.map(l=>'<div class="log"><b>v'+esc(l.v)+'</b><small>'+esc(l.date)+'</small><ul>'+l.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>').join('')+
    '<h3 class="danger">危險區</h3><p class="soft">以下操作無法復原。</p><button class="btn warn" type="button" id="ab-clear">清除這台裝置的所有遊戲資料</button>',b=>{
    b.querySelector('#ab-up').addEventListener('click',async()=>{if(!REG){toast('這個瀏覽器不支援自動更新，重新整理頁面即可');return;}toast('檢查中…');try{await REG.update();setTimeout(()=>{if(REG.waiting)showUpdate();else toast('已經是最新版本');},1500);}catch(e){toast('現在沒有網路，稍後再試');}});
    b.querySelector('#ab-clear').addEventListener('click',()=>sheet('<h2>清除所有資料？</h2><p class="soft">所有玩家、所有遊戲的進度都會從這台裝置刪除。建議先匯出備份。</p><div class="row2"><button class="btn" type="button" data-close>取消</button><button class="btn warn" type="button" id="cl">全部清除</button></div>',b2=>b2.querySelector('#cl').addEventListener('click',()=>{
      Object.keys(localStorage).filter(k=>k.indexOf('gc:')===0).forEach(k=>localStorage.removeItem(k));closeSheet();render();})));});
});
async function showUpdate(){
  let v='';try{const t=await (await fetch('config.js',{cache:'no-store'})).text();const m=t.match(/version:\s*'([^']+)'/);if(m)v=m[1];}catch(e){}
  $('#upd-t').textContent=v?'有新版本 v'+v+' 可以更新':'有新版本可以更新';$('#upd').hidden=false;
}
$('#upd-b').addEventListener('click',()=>{if(REG&&REG.waiting){REG.waiting.postMessage('skip');$('#upd-t').textContent='更新中…';}else location.reload();});
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{REG=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdate();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate();});});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{});});
  }).catch(()=>{});
  let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});
}
(function whatsNew(){const seen=localStorage.getItem('gc:seenVersion');localStorage.setItem('gc:seenVersion',C.version);
  if(seen&&seen!==C.version){const l=C.changelog.find(x=>x.v===C.version);setTimeout(()=>{if($('#sheet').hidden)sheet('<h2>已更新到 v'+esc(C.version)+'</h2>'+(l?'<ul style="line-height:1.8">'+l.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'')+'<button class="btn main" type="button" data-close>好</button>');},400);}})();

/* ---------- install tip ---------- */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;installTip();});
function installTip(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const tip=$('#tip');if(standalone||localStorage.getItem('gc:hideTip')){tip.hidden=true;return;}
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){$('#tip-h').textContent='加到主畫面，玩起來像 App';$('#tip-t').textContent='用 Safari 打開這個網址，點下方的分享按鈕，選「加入主畫面」。之後從桌面圖示打開，沒有網路也能玩。';$('#tip-a').innerHTML='';}
  else if(deferred){$('#tip-h').textContent='安裝到這台電腦';$('#tip-t').textContent='安裝後會有桌面圖示，可以離線玩。';$('#tip-a').innerHTML='<button class="btn main" type="button" id="tip-i" style="margin-top:8px">安裝</button>';$('#tip-i').addEventListener('click',async()=>{deferred.prompt();await deferred.userChoice;deferred=null;installTip();});}
  else{$('#tip-h').textContent='可以安裝成 App';$('#tip-t').textContent='用 Edge 或 Chrome 打開時，點網址列右側的「安裝」圖示，就能放到桌面。';$('#tip-a').innerHTML='';}
  tip.hidden=false;
}
$('#tip-x').addEventListener('click',()=>{localStorage.setItem('gc:hideTip','1');$('#tip').hidden=true;});

render();
})();
</script>
